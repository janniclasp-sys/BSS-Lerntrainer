<script>
const Q=[{"id":1,"e":1,"t":"formula","src":"Ü1 S.2","q":"Gib die Definition der Nennspannung Uₙ als Formel an.","answer":"U_N = (1/T) · ∫ U_Entladung(t) dt","alts":["1/t","integral","uentladung"],"ex":"Die Nennspannung ist der zeitliche Mittelwert der Spannung während einer Entladung unter nominalen Bedingungen."},{"id":2,"e":1,"t":"formula","src":"Ü1 S.2","q":"Wie wird die entnehmbare Batteriekapazität C aus dem Entladestrom bestimmt?","answer":"C = ∫ I_Entladung(t) dt","alts":["integral","ientladung"],"ex":"Kapazität ist eine Ladungsmenge; deshalb wird der Strom über die Zeit integriert."},{"id":3,"e":1,"t":"cloze","src":"Ü1 S.3","q":"Vervollständige den Zusammenhang zwischen SOC und DOD.","parts":["DOD(t) = "," % − ","(t)"],"blanks":["100","SOC"],"ex":"DOD beschreibt den bereits entladenen Anteil, SOC den noch verfügbaren Anteil."},{"id":4,"e":1,"t":"mc","src":"Ü1 S.4–5","q":"Welcher Teil einer Batteriezelle speichert im Allgemeinen die Energie?","opts":["Elektrolyt","Separator","Aktivmaterialien","Stromsammler"],"correct":2,"ex":"Die Energie steckt in den elektrochemisch aktiven Materialien."},{"id":5,"e":1,"t":"mc","src":"Ü1 S.5","q":"Was ist im Allgemeinen die Aufgabe des Elektrolyten?","opts":["Elektrische Isolation der Elektroden","Ionen leiten","Elektronen leiten","Energie speichern"],"correct":1,"ex":"Der Elektrolyt ermöglicht den Ionentransport zwischen den Elektroden."},{"id":6,"e":1,"t":"graphic","src":"Ü1 S.6–10","q":"Welche Verschaltung ist dargestellt und was passiert mit Spannung und Kapazität?","graphic":"parallel","opts":["Reihenschaltung: U steigt, C bleibt gleich","Parallelschaltung: U bleibt gleich, C steigt","Parallelschaltung: U steigt, C bleibt gleich","Reihenschaltung: U bleibt gleich, C steigt"],"correct":1,"ex":"Bei Parallelschaltung bleibt die Zellspannung erhalten; die Kapazitäten addieren sich."},{"id":7,"e":1,"t":"graphic","src":"Ü1 S.9–10","q":"Welche Verschaltung ist dargestellt und was passiert mit Spannung und Kapazität?","graphic":"series","opts":["Reihenschaltung: U addiert sich, C bleibt gleich","Parallelschaltung: U bleibt gleich, C addiert sich","Reihenschaltung: U bleibt gleich, C addiert sich","Parallelschaltung: U addiert sich, C bleibt gleich"],"correct":0,"ex":"In Serie addieren sich die Zellspannungen; die Ah-Kapazität bleibt die einer Einzelzelle."},{"id":8,"e":1,"t":"cloze","src":"Ü1 S.13","q":"Vervollständige die Aussage zum äquivalenten Vollzyklus.","parts":["Anzahl Zyklen × "," = Anzahl "," Vollzyklen"],"blanks":["DOD","äquivalenter"],"ex":"Beispiel: vier Zyklen mit je 25 % DOD entsprechen einem äquivalenten Vollzyklus."},{"id":9,"e":1,"t":"open","src":"Ü1 S.14","q":"Ein Fahrzeug benötigt 15 kWh/100 km und fährt täglich 60 km. Wie viel Energie benötigt es pro Tag?","answer":"9 kWh","ex":"60 km × 15 kWh / 100 km = 9 kWh."},{"id":10,"e":2,"t":"cloze","src":"Ü2 S.3–4","q":"Vervollständige die Wirkungsgrad-Beziehungen.","parts":["Coulombscher Wirkungsgrad ηAh = entladene "," / geladene ",". Energetischer Wirkungsgrad ηWh = entnommene "," / eingeladene ","."],"blanks":["Ah","Ah","Wh","Wh"],"ex":"Der Coulombsche Wirkungsgrad betrachtet Ladungsmenge, der energetische Wirkungsgrad Energie."},{"id":11,"e":2,"t":"mc","src":"Ü2 S.4","q":"Welcher typische energetische Wirkungsgrad wird für Lithium-Ionen-Batterien angegeben?","opts":["65–75 %","80–90 %","90–95 %","≈50 %"],"correct":2,"ex":"In der Übung werden für Lithium-Ionen-Batterien etwa 90–95 % genannt; ηAh liegt ungefähr bei 100 %."},{"id":12,"e":2,"t":"graphic","src":"Ü2 S.5","q":"Welche Kurve entspricht einer CC-CV-CC-Ladung?","graphic":"cccvcc","opts":["A","B","C"],"correct":1,"ex":"Bei CC-CV-CC folgt auf einen Konstantstromabschnitt ein Konstantspannungsabschnitt und danach wieder ein Konstantstromabschnitt."},{"id":13,"e":2,"t":"formula","src":"Ü2 S.6","q":"Vervollständige die allgemeine Gleichung der Batterieklemmenspannung.","answer":"U_Batterieklemme = U_Gleichgewicht + U_Widerstand + U_Reaktion + U_Diffusion","alts":["gleichgewicht","widerstand","reaktion","diffusion"],"ex":"Die Klemmenspannung setzt sich aus Gleichgewichtsspannung und den drei Überspannungsanteilen zusammen."},{"id":14,"e":2,"t":"mc","src":"Ü2 S.10–13","q":"Welche Zuordnung ist korrekt?","opts":["U_Gleichgewicht → Ohmsches Gesetz","U_Widerstand → Butler-Volmer","U_Reaktion → Butler-Volmer","U_Diffusion → freie Gibbs-Energie"],"correct":2,"ex":"U_Gleichgewicht: Thermodynamik/Gibbs bzw. Nernst; U_Widerstand: Ohm; U_Reaktion: Butler-Volmer; U_Diffusion: Fick."},{"id":15,"e":2,"t":"mc","src":"Ü2 S.12","q":"Welche Widerstände tragen laut Übung zur ohmschen Überspannung U_Widerstand bei?","opts":["Stromsammler + Batteriepole + Elektrolyt","Nur Ladungsdurchtrittswiderstand","Nur Separator","Nur Aktivmaterial"],"correct":0,"ex":"Genannt werden Stromsammler, Batteriepole und Elektrolyt. Der Ladungsdurchtrittswiderstand gehört zur Reaktionskinetik."},{"id":16,"e":2,"t":"open","src":"Ü2 S.16","q":"Eine C20-Batterie besitzt 100 Ah. Welche Stromstärke entspricht I20 und welche 4·I20?","answer":"I20 = 5 A; 4·I20 = 20 A","ex":"C20 bedeutet Entladung der Nennkapazität über 20 h: 100 Ah / 20 h = 5 A."},{"id":17,"e":3,"t":"cloze","src":"Ü3 S.3","q":"Vervollständige die thermodynamischen Grundbeziehungen.","parts":["ΔG = ΔH − ","·ΔS;   ΔG = −U₀·","·F;   Q = n·","·F"],"blanks":["T","z","z"],"ex":"z ist die Zahl der übertragenen Elektronen pro Stoffumsatz."},{"id":18,"e":3,"t":"mc","src":"Ü3 S.4","q":"Für die Gesamtreaktion der Blei-Säure-Batterie werden wie viele Elektronen übertragen?","opts":["0,5","1","2","4"],"correct":2,"ex":"In der Gesamtreaktion werden zwei Elektronen übertragen, also z = 2."},{"id":19,"e":3,"t":"formula","src":"Ü3 S.5","q":"Wie wird die Reaktions-Gibbsenergie ΔG aus den freien Bildungsenthalpien bestimmt?","answer":"ΔG = ΣΔG_Produkte − ΣΔG_Reaktanden","alts":["produkte","reaktanden","-"],"ex":"Produkte minus Reaktanden, jeweils mit stöchiometrischen Faktoren."},{"id":20,"e":3,"t":"open","src":"Ü3 S.7","q":"Warum besitzen elementares Pb und H⁺ in der Tabelle eine freie Bildungsenthalpie von 0?","answer":"Referenzzustand; die Bildungsenergie elementarer Stoffe im Standardzustand wird als 0 definiert.","ex":"Die Folie veranschaulicht zusätzlich: Energie steckt in chemischen Bindungen."},{"id":21,"e":3,"t":"mc","src":"Ü3 S.9","q":"Welche Aussagen zur C-Rate sind korrekt?","opts":["120 A an 60 Ah = 2C; 10 A an 50 Ah = 0,2C; 200 A an 50 Ah = 4C","120 A an 60 Ah = 3C","5 A an 50 Ah = 10C","Nur 10 A an 50 Ah = 0,2C"],"correct":0,"ex":"C-Rate = Strom / Nennkapazität. Damit: 2C, 0,2C und 4C."},{"id":22,"e":3,"t":"cloze","src":"Ü3 S.11–13","q":"Vervollständige die elektrochemische Kinetik.","parts":["Oxidation bedeutet "," von Elektronen und entspricht hier der ",". Reduktion bedeutet "," von Elektronen und entspricht hier der ","."],"blanks":["Entzug","Entladung","Zuführung","Ladung"],"ex":"Die Übung ordnet anodische Reaktion der Oxidation/Entladung und kathodische Reaktion der Reduktion/Ladung zu."},{"id":23,"e":3,"t":"mc","src":"Ü3 S.12","q":"Was repräsentieren die beiden Exponentialterme der Butler-Volmer-Gleichung?","opts":["Oxidation und Reduktion an einer Elektrode","Je eine Reaktion an den beiden unterschiedlichen Elektroden","Ohmschen und diffusionsbedingten Spannungsabfall","SOC und DOD"],"correct":0,"ex":"Beide Teilreaktionen gehören zur selben Elektrode: anodischer und kathodischer Teilstrom."},{"id":24,"e":4,"t":"mc","src":"Ü4 S.2–4","q":"Welche Komponenten gelten im elektrochemischen Sinn als aktive Komponenten einer Lithium-Ionen-Batterie?","opts":["Stromsammler und BMS","Aktivmaterial und Elektrolyt","Separator und Batteriepole","Nur Stromsammler"],"correct":1,"ex":"Die Übungen markieren Aktivmaterial und Elektrolyt als aktive Komponenten."},{"id":25,"e":4,"t":"graphic","src":"Ü4 S.5","q":"Im gezeigten Ladezustand wandern Li-Ionen zur Graphitanode. Wann ist die Zelle vollgeladen?","graphic":"liion","opts":["Wenn die negative Elektrode mit Li-Ionen gefüllt ist","Wenn die positive Elektrode maximal mit Li-Ionen gefüllt ist","Wenn die Spannung der negativen Elektrode maximal steigt","Wenn keine Li-Ionen im Elektrolyt sind"],"correct":0,"ex":"Beim Laden werden Li-Ionen aus der positiven Elektrode deinterkaliert und in Graphit eingelagert."},{"id":26,"e":4,"t":"mc","src":"Ü4 S.6","q":"Was ist ein grundlegender Unterschied zwischen Hochleistungs- (HP) und Hochenergiezellen (HE)?","opts":["HP besitzen typischerweise dünneres/weniger Aktivmaterial","HP besitzen grundsätzlich mehr Aktivmaterial","HE haben immer dünnere Elektroden","Es gibt keinen geometrischen Unterschied"],"correct":0,"ex":"Dünnere Elektroden verkürzen Transportwege und begünstigen Leistung, reduzieren aber den Aktivmaterialanteil."},{"id":27,"e":4,"t":"graphic","src":"Ü4 S.7–10","q":"Welche Größe entspricht näherungsweise der Zellspannung in einem Halbzellspannungsdiagramm?","graphic":"halfcells","opts":["Potential positive Elektrode + Potential negative Elektrode","Potential positive Elektrode − Potential negative Elektrode","Nur Potential der Anode","Nur Potential der Kathode"],"correct":1,"ex":"Die Zellspannung ist die Potentialdifferenz zwischen positiver und negativer Elektrode."},{"id":28,"e":4,"t":"mc","src":"Ü4 S.11","q":"Was bedeutet eine Einschränkung 0 < x < 0,6 für den Lithiierungsgrad der positiven Elektrode?","opts":["Nur 60 % der Reaktionsenergie sind elektrisch nutzbar","Maximal 60 % der Li-Ionen sollen der positiven Elektrode entnommen werden","Nur 60 % der Li-Ionen benötigen Elektronen","Der SOC darf nie über 60 % liegen"],"correct":1,"ex":"x beschreibt die Stöchiometrie/Lithiierung; die Grenze beschränkt die nutzbare Entlithiierung."},{"id":29,"e":4,"t":"formula","src":"Ü4","q":"Wie hängt der Leitwert G eines Elektrolyten qualitativ von Leitfähigkeit κ, Fläche A und Elektrodenabstand l ab?","answer":"G = κ · A / l","alts":["kappa","a","/l"],"ex":"Große Fläche und kleiner Abstand erhöhen den Leitwert und senken damit den Elektrolytwiderstand."},{"id":  wird unendlich.","Die Gleichgewichtsspannung wird null."],"correct":0,"ex":"Eine hohe Austauschstromdichte steht für schnelle Elektrodenkinetik."},{"id":132,"e":"VL03","t":"mc","src":"VL03 S.65","q":"Was ist bei einer High-Power-Li-Ionen-Zelle unter hoher Entladerate charakteristisch?","opts":["Die Klemmspannung fällt durch höhere Überspannungen stärker ab.","Die Zellspannung ist unabhängig vom Strom.","Die nutzbare Leistung wird ausschließlich durch die Zellmasse bestimmt.","Der Innenwiderstand erzeugt keine Verluste."],"correct":0,"ex":"Die Entladecharakteristik in VL03 zeigt die Stromabhängigkeit der Zellspannung."},{"id":133,"e":"VL03","t":"mc","src":"VL03 S.124","q":"Welche Folge kann mechanisches Cracking von Graphitpartikeln für die Alterung haben?","opts":["Neue Oberfläche entsteht, auf der zusätzliche SEI gebildet werden kann.","Die SEI verschwindet dauerhaft ohne Nebenreaktion.","Die Energiedichte steigt automatisch.","Lithium-Plating wird unmöglich."],"correct":0,"ex":"Neue Oberfläche kann weiteren Elektrolytverbrauch und SEI-Bildung verursachen."},{"id":134,"e":"VL03","t":"mc","src":"VL03 S.198–199","q":"Warum kann die geringere Energiedichte von Natrium-Ionen-Zellen einen Teil des Rohstoffkostenvorteils wieder aufzehren?","opts":["Pro kWh werden mehr Zellmaterial, Gehäuse, Stromableiter, Elektrolyt und Produktionskapazität benötigt.","Natrium ist teurer als Lithiumcarbonat.","Natrium-Ionen-Zellen benötigen keine Stromableiter.","Die Zellspannung ist immer höher als bei NMC."],"correct":0,"ex":"VL03 nennt bei etwa halber Energiedichte ungefähr doppelten Aufwand für mehrere passive Komponenten pro kWh."},{"id":135,"e":"VL03","t":"cloze","src":"VL03 S.199","q":"Vervollständige die in VL03 gezeigten typischen Systemvolumina.","parts":["SIB ca. "," l/kWh, LFP ca. "," l/kWh, NMC ca. "," l/kWh."],"blanks":["3,7","2,7","1,5"],"ex":"Die niedrigere Zellspannung und Energiedichte erhöhen bei SIB den Pack- und Elektronikaufwand."},{"id":136,"e":"VL04","t":"open"," opts":["Parallele Zellen teilen den Strom und bilden gemeinsam eine Kapazitäts-/Stromeinheit; einzelne Abweichungen wirken anders als in einem reinen langen Serienstrang.","Weil parallel geschaltete Zellen unterschiedliche Spannungen behalten können.","Weil kein BMS mehr nötig ist.","Weil Parallelschaltung die Zellchemie verändert."],"correct":0,"ex":"VL05 diskutiert Verschaltung als Stellhebel für Leistung, Redundanz und Alterungsverhalten."},{"id":142,"e":"VL05","t":"open","src":"VL05 S.62","q":"Ein Vorladekreis hat R = 100 Ω und C = 2 mF. Wie groß ist die Zeitkonstante τ und ungefähr 5τ?","answer":"τ = 0,2 s; 5τ ≈ 1,0 s","ex":"τ = R·C = 100 Ω × 0,002 F = 0,2 s."},{"id":143,"e":"VL05","t":"mc","src":"VL05 S.81/141","q":"Warum kann das BMS den SOC nicht einfach direkt mit einem Sensor messen?","opts":["SOC ist eine innere Zustandsgröße und wird aus Messgrößen wie Strom, Spannung, Temperatur und Modellen geschätzt.","SOC ist identisch mit der Zelltemperatur.","SOC ist immer exakt proportional zur momentanen Klemmspannung.","SOC existiert nur bei Blei-Säure-Batterien."],"correct":0,"ex":"Das BMS kombiniert Messung und Modell zur Zustandsbestimmung."},{"id":144,"e":"VL06","t":"formula","src":"VL06 S.18–26","q":"Wie viele Elektronen werden bei der Gesamtreaktion Pb + PbO₂ + 2 H₂SO₄ ⇌ 2 PbSO₄ + 2 H₂O übertragen?","answer":"z = 2","alts":["2"],"ex":"Die Teilreaktionen übertragen insgesamt zwei Elektronen pro stöchiometrischem Umsatz."},{"id":145,"e":"VL06","t":"mc","src":"VL06 S.26","q":"Warum kann die Säuredichte einer Blei-Säure-Batterie als Hinweis auf den Ladezustand dienen?","opts":["Weil Schwefelsäure Reaktant ist und ihre Konzentration beim Entladen abnimmt.","Weil Schwefelsäure nur Kühlmittel ist.","Weil beim Entladen zusätzliche Schwefelsäure entsteht.","Weil die Dichte ausschließlich von der Gehäusemasse abhängt."],"correct":0,"ex":"Beim Entladen werden Sulfationen in PbSO₄ gebunden und Wasser entsteht."},{"id":146,"e":"VL06","t":"open","src":"VL06 S.83–85","q":"Die Gasungsrate einer Zelle sei bei einem Referenzpunkt 1. Wie groß ist sie nach +100 mV Zellspannung und zusätzlich +10 °C nach der Daumenregel?","answer":"Faktor 6","ex":"×3 für +100 mV und ×2 für +10 K → insgesamt ×6."},{"id":147,"e":"VL06","t":"mc","src":"VL06 S.89–91","q":"Warum kann der Sauerstoffkreislauf einer VRLA-Batterie das Thermal-Runaway-Risiko erhöhen?","opts":["Die Sauerstoffrekombination ist exotherm und kann zusätzliche Wärme erzeugen.","Weil dabei keine Wärme entsteht.","Weil das Ventil die Batterie aktiv heizt.","Weil Schwefelsäure vollständig verdampft."],"correct":0,"ex":"Wasserrekombination reduziert Wasserverlust, erzeugt aber Wärme."},{"id":148,"e":1,"t":"open","src":"Ü1 S.6–10","q":"Vier identische Zellen mit 3,7 V und 5 Ah werden parallel geschaltet. Welche Nennspannung und Kapazität hat der Verbund idealisiert?","answer":"3,7 V und 20 Ah","ex":"Parallel: Spannung bleibt gleich, Kapazitäten addieren sich."},{"id":149,"e":1,"t":"open","src":"Ü1 S.9–10","q":"Vier identische Zellen mit 3,7 V und 5 Ah werden in Serie geschaltet. Welche Nennspannung und Kapazität hat der Verbund idealisiert?","answer":"14,8 V und 5 Ah","ex":"Serie: Spannungen addieren sich, Ah-Kapazität bleibt gleich."},{"id":150,"e":2,"t":"open","src":"Ü2 S.3–4","q":"Eine Batterie nimmt beim Laden 10,0 Ah auf und gibt 9,8 Ah wieder ab. Wie groß ist der coulombsche Wirkungsgrad?","answer":"98 %","ex":"ηAh = 9,8 Ah / 10,0 Ah = 0,98."},{"id":151,"e":2,"t":"mc","src":"Ü2 S.10–13","q":"Welche physikalische Ursache wird mit der Diffusionsüberspannung verknüpft?","opts":["Begrenzter Stofftransport bzw. Konzentrationsgradienten.","Elektronenwiderstand der Batteriepole allein.","Freie Gibbs-Energie im Gleichgewicht.","Mechanische Gehäuseverformung."],"correct":0,"ex":"Der Diffusionsanteil wird über Stofftransport/Fick beschrieben."},{"id":152,"e":2,"t":"open","src":"Ü2 S.16","q":"Eine C20-Batterie besitzt 80 Ah. Wie groß sind I20 und 4·I20?","answer":"I20 = 4 A; 4·I20 = 16 A","ex":"8 ,"src":"Ü6 Ü6.2","q":"Vier identische Supercaps mit je 100 F werden in Serie geschaltet. Welche Ersatzkapazität ergibt sich?","answer":"25 F","ex":"C_pack = C_einzel/N = 100 F / 4 = 25 F."},{"id":162,"e":6,"t":"open","src":"Ü6 Ü6.2","q":"Vier identische Supercaps mit je 2 mΩ Innenwiderstand werden in Serie geschaltet. Wie groß ist der Gesamtwiderstand?","answer":"8 mΩ","ex":"Serienwiderstände addieren sich: 4 × 2 mΩ = 8 mΩ."},{"id":163,"e":"Klausurnah","t":"combi","src":"Klausurnahe Variante · Klausur A2 · Blei-Säure","q":"Blei-Säure-Grundlagen: Wähle pro Kategorie die richtige Aussage.","groups":[["Elektrolyt",["verdünnte Schwefelsäure","konzentrierte Schwefelsäure"],0],["Teilnahme des Elektrolyten an der Reaktion",["nimmt teil","nimmt nicht teil"],0],["Kapazitätsausnutzung bei hohen Strömen",["schlechter","besser"],0]],"ex":"Das entspricht dem in der Klausur verwendeten Combi-Choice-Prinzip."},{"id":164,"e":"Klausurnah","t":"combi","src":"Klausurnahe Variante · Klausur A2 · Blei-Säure","q":"Ordne die Tendenzen bei Blei-Säure-Batterien zu.","groups":[["Bei sinkendem SOC wird die Schwefelsäurekonzentration",["kleiner","größer"],0],["Dadurch wird die Gefriertemperatur",["höher","niedriger"],0],["Korrosion ist laut Klausur besonders bei",["niedriger Säurekonzentration und niedrigem SOC","hoher Säurekonzentration und hohem SOC"],0]],"ex":"Mehrere gekoppelte Aussagen statt isolierter Definitionsfragen."},{"id":165,"e":"Klausurnah","t":"open","src":"Klausurnahe Variante · Klausur A3 · DSK Anwendung","q":"Ein DSK hat C = 500 F und Umax = 2,6 V. Berechne die maximal gespeicherte Energie.","answer":"E = 1/2·C·U² = 1690 J","ex":"Prüfungsformat: Rechnen aus technischen Kenndaten."},{"id":166,"e":"Klausurnah","t":"combi","src":"Klausurnahe Variante · Klausur A3 · DSK Anwendung","q":"Welche Anwendung passt typischerweise zu einem DSK und warum?","groups":[["Anwendung",["hohe Leistung, niedriger Energiebedarf","niedrige Leistung, hoher Energiebedarf"],0],["Begründung",["hohe Lei function render(){const q=current;$('badgeExercise').textContent=(q.e==='Klausur'?'Klausurnahe Fragen':String(q.e).startsWith('VL')?'Vorlesung '+String(q.e).slice(2):'Übung '+q.e);$('badgeType').textContent=names[q.t];$('badgeSource').textContent=q.src;$('question').textContent=q.q;$('visual').innerHTML=q.graphic?visual(q.graphic):'';$('feedback').style.display='none';const f=$('answerForm');f.innerHTML='';
 if(q.t==='mc'||q.t==='graphic'||q.t==='ordering')q.opts.forEach((o,i)=>{const l=document.createElement('label');l.className='opt';l.innerHTML=`<input type="radio" name="ans" value="${i}"><span>${o}</span>`;f.appendChild(l)});
 else if(q.t==='multiselect')q.opts.forEach((o,i)=>{const l=document.createElement('label');l.className='opt';l.innerHTML=`<input type="checkbox" name="ansmulti" value="${i}"><span>${o}</span>`;f.appendChild(l)});
 else if(q.t==='combi'){q.groups.forEach((g,gi)=>{const box=document.createElement('div');box.className='feedback';box.style.display='block';box.style.margin='8px 0';box.innerHTML=`<b>${g[0]}</b>`;g[1].forEach((o,i)=>{const l=document.createElement('label');l.className='opt';l.innerHTML=`<input type="radio" name="group${gi}" value="${i}"><span>${o}</span>`;box.appendChild(l)});f.appendChild(box)})}
 else if(q.t==='cloze'){const w=document.createElement('div');w.className='cloze';q.parts.forEach((p,i)=>{w.append(document.createTextNode(p));if(i<q.blanks.length){const inp=document.createElement('input');inp.type='text';inp.dataset.blank=i;w.appendChild(inp)}});f.appendChild(w)}
 else{const a=document.createElement('textarea');a.id='textAns';a.rows=4;a.placeholder=q.t==='formula'?'Formel eingeben …':'Antwort in eigenen Worten …';f.appendChild(a)}
 $('check').textContent=q.t==='open'?'Musterlösung anzeigen':'Prüfen'}
function norm(s){return String(s).toLowerCase().replace(/\s/g,'').replace(/η/g,'eta').replace(/κ/g,'kappa').replace(/∫/g,'integral').replace(/·/g,'*').replace(/−/g,'-')}
function fb(title,body,kind='') {const e=$('feedback');e.style.display='block';e.className='feedback '+kind;e.innerHTML=`<b>${title}</b><div style="margin-top:6px">${body}</div>${current.ex?`<div class="muted" style="margin-top:8px;font-size:13px">${current.ex}</div>`:''}`}
function reg(ok){state.done++;if(ok)state.correct++;const k=String(current.id);if(!state.perQuestion[k])state.perQuestion[k]={attempts:0,correct:0,last:null};state.perQuestion[k].attempts++;if(ok)state.perQuestion[k].correct++;state.perQuestion[k].last=new Date().toISOString();save()}
function manualRate(ok){if(answered)return;answered=true;reg(ok);fb(ok?'✓ Als richtig gewertet':'✗ Als falsch gewertet',`Musterlösung: <b>${current.answer}</b>`,ok?'good':'bad')}
function openSolution(){const v=$('textAns')?.value||'';fb('Musterlösung',`<b>${current.answer}</b><div style="margin-top:12px">Deine Antwort: ${v?'<i>'+v.replace(/</g,'&lt;')+'</i>':'<i>keine Eingabe</i>'}</div><div class="row" style="margin-top:12px"><button type="button" class="primary" onclick="manualRate(true)">✓ Richtig gelöst</button><button type="button" onclick="manualRate(false)">✗ Falsch gelöst</button></div>`)}
function check(){if(answered)return;let ok=false;
 if(current.t==='mc'||current.t==='graphic'||current.t==='ordering'){const r=document.querySelector('input[name="ans"]:checked');if(!r)return fb('Noch keine Antwort','Wähle zuerst eine Antwort.');ok=Number(r.value)===current.correct}
 else if(current.t==='multiselect'){const sel=[...document.querySelectorAll('input[name="ansmulti"]:checked')].map(x=>Number(x.value)).sort((a,b)=>a-b);if(!sel.length)return fb('Noch keine Antwort','Wähle mindestens eine Antwort.');const cor=[...current.corrects].sort((a,b)=>a-b);ok=JSON.stringify(sel)===JSON.stringify(cor)}
 else if(current.t==='combi'){const vals=current.groups.map((g,gi)=>document.querySelector(`input[name="group${gi}"]:checked`));if(vals.some(x=>!x))return fb('Noch nicht vollständig','Wähle in jeder Kategorie eine Antwort.');ok=vals.every((x,gi)=>Number(x.value)===current.groups[gi][2])}
 else if(current.t==='cloze'){const ins=[...document.querySelectorAll('[data-blank]')];if(ins.some(x=>!x.value.trim()))return fb('Noch nicht vollständig','Fülle alle Lücken aus.');ok=ins.every((x,i)=>norm(x.value)===norm(current.blanks[i]))}
 else if(current.t==='formula'){const v=$('textAns').value;if(!v.trim())return fb('Noch keine Antwort','Gib zuerst eine Formel ein.');const n=norm(v);ok=current.alts.every(a=>n.includes(norm(a)))}
 else if(current.t==='open')return openSolution();
 else return fb('Musterlösung',`<b>${current.answer}</b>`);
 answered=true;reg(ok);fb(ok?'✓ Richtig':'✗ Noch nicht ganz',ok?'Sehr gut.':`Lösung: <b>${current.answer!==undefined?current.answer:current.opts[current.correct]}</b>`,ok?'good':'bad')}
function reveal(){let s='';if(current.t==='mc'||current.t==='graphic'||current.t==='ordering')s=current.opts[current.correct];else if(current.t==='multiselect')s=current.corrects.map(i=>current.opts[i]).join('<br>');else if(current.t==='combi')s=current.groups.map(g=>'<b>'+g[0]+':</b> '+g[1][g[2]]).join('<br>');else if(current.t==='cloze')s=current.parts.map((p,i)=>p+(i<current.blanks.length?'<b>'+current.blanks[i]+'</b>':'')).join('');else s=current.answer;fb('Lösung',s)}
function exportProgress(){const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='BSS_Lernfortschritt_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importProgress(file){const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(typeof x.done!=='number'||typeof x.correct!=='number')throw 0;state={version:1,perQuestion:{},...x};save();alert('Fortschritt importiert.')}catch(e){alert('Ungültige Fortschrittsdatei.')}};r.readAsText(file)}
$('newQuestion').onclick=pick;$('next').onclick=pick;$('check').onclick=check;$('show').onclick=reveal;$('exercise').onchange=pick;$('type').onchange=pick;
$('exportBtn').onclick=exportProgress;$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=e=>{if(e.target.files[0])importProgress(e.target.files[0]);e.target.value=''};
$('reset').onclick=()=>{if(confirm('Gesamten Fortschritt wirklich zurücksetzen?')){state={version:1,done:0,correct:0,perQuestion:{},updatedAt:null};save();pick()}};
load();pick();
</script></body></html>
