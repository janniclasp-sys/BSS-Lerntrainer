d": 396, "e": "F15-A3", "t": "open", "src": "F15 3.3c", "q": "Warum nur periodisch?", "answer": "Sie beschleunigt irreversible Alterung durch Korrosion und Wasserverlust."}, {"id": 397, "e": "F15-A3", "t": "open", "src": "F15 3.4a", "q": "Zweite Funktion der Schwefelsäure neben Reaktand?", "answer": "Ionenleiter/Elektrolyt."}, {"id": 398, "e": "F15-A3", "t": "open", "src": "F15 3.4b", "q": "Theoretische gravimetrische Energiedichte mit gegebenen Molmassen/U0?", "answer": "Musterlösung: 161 Wh/kg."}, {"id": 399, "e": "F15-A3", "t": "open", "src": "F15 3.4c", "q": "Praktische gravimetrische Energiedichte kommerzieller Blei-Batterien?", "answer": "30–50 Wh/kg."}, {"id": 400, "e": "F15-A3", "t": "open", "src": "F15 3.5a", "q": "1,765kg Gewichtsverlust/Jahr: Ladungsumsatz und Erhaltungsladestrom?", "answer": "Musterlösung: Q=876,14 Ah; daraus I≈100mA über ein Jahr."}, {"id": 401, "e": "F15-A3", "t": "open", "src": "F15 3.5b", "q": "Erhaltungsladestrom auf 25°C und 100Ah normieren?", "answer": "Aus berechneten 100mA bei 1000Ah/15°C: Temperaturfaktor 2 und Kapazitätsfaktor 0,1 → 20mA."}, {"id": 402, "e": "F15-A3", "t": "open", "src": "F15 3.5c", "q": "Betrieb bei 12V Nennspannung zur Wasserverlustreduktion sinnvoll?", "answer": "Wasserverlust wäre geringer, aber nicht sinnvoll: 2V/Zelle führt zur Entladung, Nennkapazität steht nicht bereit."}, {"id": 403, "e": "F15-A3", "t": "open", "src": "F15 3.5d", "q": "Folge fehlenden Wassernachfüllens?", "answer": "Extremer Wasserverlust → Elektrolyt bedeckt Platten nicht mehr → Kapazitätsverlust; zudem erhöhte Korrosions-/Alterungsrate."}, {"id": 404, "e": "F15-A4", "t": "open", "src": "F15 4.1a", "q": "Werden auch in Lithium-Metall-Batterien Li-Ionen zwischen Elektroden ausgetauscht?", "answer": "Ja."}, {"id": 405, "e": "F15-A4", "t": "open", "src": "F15 4.1b", "q": "Sind Anode/Kathode/Elektrolyt bei Li-Ion eindeutig festgelegt?", "answer": "Nein, alle können chemisch unterschiedlich gewählt werden."}, {"id": 406, "e": "F15-A4", "t": "open", "src": "F15 4.1c", "q": "Was ist bei Lithium-Metall-Batterien festgelegt?", "answer": "Die Anode ist metallisches Lithium; Kathode und Elektrolyt sind nicht eindeutig festgelegt."}, {"id": 407, "e": "F15-A4", "t": "open", "src": "F15 4.1d", "q": "Sicherheitsunterschied Li-Ion vs Lithium-Metall?", "answer": "Lithium-Metall ist hochreaktiv und kann Dendriten/Kurzschlüsse bilden; Li-Ion vermeidet metallisches Li im Normalbetrieb."}, {"id": 408, "e": "F15-A4", "t": "open", "src": "F15 4.2a-i", "q": "Beschrifte Zell-, Kathoden- und Anodenkurve in der Plating-Grafik.", "answer": "Oben Kathode, dazwischen Vollzellspannung als Differenz, unten Anode vs Li/Li+."}, {"id": 409, "e": "F15-A4", "t": "open", "src": "F15 4.2a-ii", "q": "Wo und bei welchem Potential beginnt Lithium-Plating?", "answer": "An der negativen Elektrode/Graphitanode bei etwa 0 V vs Li/Li+."}, {"id": 410, "e": "F15-A4", "t": "open", "src": "F15 4.2b-i", "q": "Zwei Bedingungen für Lithium-Metallabscheidung?", "answer": "Niedrige Temperatur und hohe Ladeströme."}, {"id": 411, "e": "F15-A4", "t": "open", "src": "F15 4.2b-ii", "q": "Beim Laden oder Entladen und warum?", "answer": "Beim Laden, weil das Anodenpotential gegen 0V vs Li/Li+ fällt bzw. es unterschreiten kann."}, {"id": 412, "e": "F15-A4", "t": "open", "src": "F15 4.2c", "q": "Warum reduziert 10–15% Anoden-Überkapazität das Plating-Risiko?", "answer": "Geringere lokale Ausnutzung/Überspannung der Anode; bei gleichem Strom bleibt Anodenpotential weiter über 0V."}, {"id": 413, "e": "F15-A4", "t": "open", "src": "F15 4.2d", "q": "Welche Elektrode definiert bei Anoden-Überkapazität die Vollzellkapazität und warum?", "answer": "Kathode: sie hat die kleinere Kapazität und trägt anfangs das aktive Lithium; außerdem ist Kathodenausnutzung chemisch begrenzt."}, {"id": 414, "e": "F15-A4", "t": "open", "src": "F15 4.2e", "q": "Unterschied Li-Plating vs SEI?", "answer": "Plating ist zunächst metallisches, potentiell noch reversibles Lithium; SEI sind Passivierungs-/Elektrolyt-Zersetzungsprodukte und bindet aktives Lithium."}, {"id": 415, "e": "F15-A4", "t": "open", "src": "F15 4.3a", "q": "Stöchiometrie bei 100% SOC nach Formierung mit 85% aktivem Li?", "answer": "x=0, y=0,85."}, {"id": 416, "e": "F15-A4", "t": "open", "src": "F15 4.3b", "q": "SOC bei Li0,17FePO4 + Li0,68C6?", "answer": "SOC=0,68/0,85=80%."}, {"id": 417, "e": "F15-A4", "t": "open", "src": "F15 4.3c", "q": "Gleiche Anodenstöchiometrie nach zusätzlichem 7% Lithiumverlust: SOC nominal/aktuell?", "answer": "Nominal bezogen 80%; aktuell 0,68/(0,85·0,92)≈86%."}, {"id": 418, "e": "F15-A4", "t": "open", "src": "F15 4.4a-i", "q": "Zyklischer Alterungstest: Anzahl Kapazitätstests und Alterungszyklen bis 3382h?", "answer": "Musterlösung: 66 Kapazitätstests und ca. 6500 Alterungszyklen."}, {"id": 419, "e": "F15-A4", "t": "open", "src": "F15 4.4a-ii", "q": "Äquivalente Vollzyklen der Alterungszyklen?", "answer": "3250 FCE."}, {"id": 420, "e": "F15-A4", "t": "open", "src": "F15 4.4a-iii", "q": "Ah-Umsatz der Alterungszyklen?", "answer": "195 000 Ah."}, {"id": 421, "e": "F15-A4", "t": "open", "src": "F15 4.4b-i", "q": "Kalendarischer Test 12 998h, Kapazitätstest alle 30 Tage: Anzahl Tests?", "answer": "19 Kapazitätstests."}, {"id": 422, "e": "F15-A4", "t": "open", "src": "F15 4.4b-ii", "q": "Ah-Umsatz dieser Kapazitätstests?", "answer": "1140 Ah."}, {"id": 423, "e": "F15-A4", "t": "open", "src": "F15 4.4b-iii", "q": "Verhältnis Ah-Umsatz kalendarischer Kapazitätstests zu zyklischer Alterung?", "answer": "≈0,58 % laut Musterlösung."}, {"id": 424, "e": "H15-A1", "t": "open", "src": "H15 1.1a", "q": "Vergleiche Blei mit Li-Ion/DSK bzgl. spezifischer Energie/Leistung, Überladesicherheit, Recycling.", "answer": "Energie: Blei<Li-Ion, aber >DSK. Leistung: Blei<Li-Ion und <DSK. Überladerisiko kleiner als Li-Ion. Recyclingquote höher als Li-Ion."}, {"id": 425, "e": "H15-A1", "t": "open", "src": "H15 1.1b", "q": "Hauptreaktion der Bleibatterie?", "answer": "Pb + PbO₂ + 2H₂SO₄ ⇌ 2PbSO₄ + 2H₂O."}, {"id": 426, "e": "H15-A1", "t": "open", "src": "H15 1.1c", "q": "Stoffe an positiver/negativer Elektrode vollgeladen vs vollentladen?", "answer": "Vollgeladen: negativ Pb, positiv PbO₂. Vollentladen: beide PbSO₄."}, {"id": 427, "e": "H15-A1", "t": "open", "src": "H15 1.1d", "q": "Vier Hauptalterungseffekte?", "answer": "Erosion, Korrosion, Sulfatierung, Wasserverlust."}, {"id": 428, "e": "H15-A1", "t": "open", "src": "H15 1.2a", "q": "Zeichne FCE-Kurve aus DOD-Zyklusdaten 50/60/70/80%.", "answer": "Äquivalente Vollzyklen = Zyklen·DOD; Punkte laut Musterlösung: 1250, 1200, 1050, 1000 FCE."}, {"id": 429, "e": "H15-A1", "t": "open", "src": "H15 1.2b", "q": "48V·90Ah-Pack, PV 864W·4h/Tag: resultierende DOD?", "answer": "WPV=3,456kWh; WBatt=4,32kWh; DOD=80%."}, {"id": 430, "e": "H15-A1", "t": "open", "src": "H15 1.2c", "q": "Gesamte entladene Energie über Lebensdauer bei DOD 80% bzw. Ersatz 70%?", "answer": "Bei 80%: 1000·48V·90Ah=4,32MWh; bei 70% laut Musterlösung 4,536MWh."}, {"id": 431, "e": "H15-A1", "t": "open", "src": "H15 1.3a1", "q": "Wie viele Elektronen pro gespaltenem H₂O bei Gasung?", "answer": "z=2 Elektronen pro H₂O."}, {"id": 432, "e": "H15-A1", "t": "open", "src": "H15 1.3a2", "q": "Gasungs-Ladungsumsatz bei 90mA über 365 Tage?", "answer": "Qgas=788,4 Ah."}, {"id": 433, "e": "H15-A1", "t": "open", "src": "H15 1.3a3", "q": "Stoffmengen H₂/O₂?", "answer": "nO₂=154,4 mol; nH₂=308,9 mol."}, {"id": 434, "e": "H15-A1", "t": "open", "src": "H15 1.3a4", "q": "Wasserverlust pro Zelle?", "answer": "m≈264,7g → V≈264,7ml."}, {"id": 435, "e": "H15-A1", "t": "open", "src": "H15 1.3b", "q": "Ladeerhaltung 49,77V statt 46,62V: welche Temperatur hält Gasungsrate konstant?", "answer": "Spannung je Zelle +150mV; mit i~2^(ΔT/10K)·3^(ΔU/100mV) ergibt sich T≈−3,77°C."}, {"id": 436, "e": "H15-A1", "t": "open", "src": "H15 1.3c", "q": "Vorteil/Nachteil VRLA gegenüber geflutet?", "answer": "Vorteil z.B. weniger Wartung/einfacherer Transport; Nachteil z.B. Thermal-Runaway-Risiko durch Rekombination bzw. höhere Kosten."}, {"id": 437, "e": "H15-A2", "t": "open", "src": "H15 2.1a", "q": "Einfaches DSK-Ersatzschaltbild und Bedeutung?", "answer": "L0 Induktivität, C0 Doppelschichtkapazität, Rs Innenwiderstand/ohmsche Verluste, Rp Selbstentladung."}, {"id": 438, "e": "H15-A2", "t": "open", "src": "H15 2.1b", "q": "Erweitertes Ersatzschaltbild für scheinbare Selbstentladung?", "answer": "Verteiltes Mehrfach-RC-Modell mit Macro/Meso/Micro-Zweigen und Leckwiderständen."}, {"id": 439, "e": "H15-A2", "t": "open", "src": "H15 2.1c1", "q": "Ordne Ladedauern der drei Relaxationskurven.", "answer": "Ladedauer 1 > 2 > 3."}, {"id": 440, "e": "H15-A2", "t": "open", "src": "H15 2.1c2", "q": "Warum unterscheiden sich die Kurven anfangs?", "answer": "Ladungsträgerumverteilung: längere Ladung lässt Ionen tiefer in Poren diffundieren."}, {"id": 441, "e": "H15-A2", "t": "open", "src": "H15 2.1d1", "q": "Beschrifte Elemente 1–4 im DSK-Querschnitt.", "answer": "1 Elektrolyt, 2 Separator, 3 Aluminium-Stromkollektor, 4 Graphit/Kohlenstoff-Elektrode."}, {"id": 442, "e": "H15-A2", "t": "open", "src": "H15 2.1d2", "q": "Wie verteilen sich positive/negative Ionen im vollgeladenen DSK?", "answer": "Gegenionen sammeln sich jeweils an den entgegengesetzt geladenen Elektrodenoberflächen und bilden die Doppelschicht."}, {"id": 443, "e": "H15-A2", "t": "open", "src": "H15 2.1d3", "q": "Wo liegen die Doppelschichtkapazitäten?", "answer": "Jeweils an beiden Elektroden/Elektrolyt-Grenzflächen."}, {"id": 444, "e": "H15-A2", "t": "open", "src": "H15 2.1d4", "q": "Qualitativer Potentialverlauf?", "answer": "Potentialabfälle konzentrieren sich an den beiden Doppelschichten; Elektrolytbulk näherungsweise feldarm."}, {"id": 445, "e": "H15-A2", "t": "open", "src": "H15 2.2a", "q": "Drei Gründe für DSK als Windkraft-Notverstellung?", "answer": "Hohe Stromfähigkeit, Wartungsfreiheit, mechanische Robustheit, Temperaturbeständigkeit, hohe Zyklenfestigkeit; nur geringe Energie nötig."}, {"id": 446, "e": "H15-A2", "t": "open", "src": "H15 2.2b1", "q": "F1500 2,7V, Umrichter max 60V: maximal seriell?", "answer": "floor(60/2,7)=22 DSK."}, {"id": 447, "e": "H15-A2", "t": "open", "src": "H15 2.2b2", "q": "Gesamtkapazität bei 22 Serien-DSK à 1500F?", "answer": "Cmod=1500/22≈68,2F."}, {"id": 448, "e": "H15-A2", "t": "open", "src": "H15 2.2c", "q": "Motor 5kW für 30s, ηUmrichter=97%: Modul-Leistung und Energie?", "answer": "Pmod=5/0,97≈5,155kW; E≈154,6kJ."}, {"id": 449, "e": "H15-A2", "t": "open", "src": "H15 2.2d", "q": "Qualitativer Strom-/Spannungsverlauf bei Konstantleistungsentladung?", "answer": "Mit fallender Spannung steigt der Strom betragsmäßig; Klemmspannung fällt, zusätzlich ohmscher Abfall."}, {"id": 450, "e": "H15-A2", "t": "open", "src": "H15 2.2e", "q": "Differentialgleichung für uc(t) bei Konstantleistungsentladung inkl. Ri?", "answer": "P=ui mit u=uc−iRi und i=−C·duc/dt (bei Entladevorzeichen); daraus nichtlineare DGL 1. Ordnung."}, {"id": 451, "e": "H15-A2", "t": "open", "src": "H15 2.2f1", "q": "Energieänderung des Moduls zwischen vollgeladen und uc,Ende=26,36V?", "answer": "Über ΔW=½Cmod(Ustart²−Uend²), mit n=22 falls b nicht gelöst."}, {"id": 452, "e": "H15-A2", "t": "open", "src": "H15 2.2f2", "q": "Maximal nutzbare Energie bei gemessenen Verlusten 3,3kJ?", "answer": "WNutz=ΔWModul−3,3kJ."}, {"id": 453, "e": "H15-A2", "t": "open", "src": "H15 2.2g", "q": "Erfüllt Modul 5kW·30s? Falls nein, was ändern?", "answer": "Mit nutzbarer Energie vergleichen; falls nicht ausreichend zusätzlichen Parallelstrang/mehr Kapazität vorsehen."}, {"id": 454, "e": "H15-A3", "t": "open", "src": "H15 3.1a", "q": "Zwei Unterschiede Li-Ion vs Lithium-Metall?", "answer": "Li-Ion speichert Li in Wirtsgittern und hat im Normalbetrieb kein metallisches Li; Lithium-Metall besitzt metallische Li-Anode."}, {"id": 455, "e": "H15-A3", "t": "open", "src": "H15 3.1b", "q": "High-Energy vs High-Power Aufbau?", "answer": "High-Energy: dickere Aktivmaterialschichten; High-Power: höherer Anteil passiver Leit-/Stützkomponenten, dünnere aktive Schichten."}, {"id": 456, "e": "H15-A3", "t": "open", "src": "H15 3.1c", "q": "Ein Vorteil/Nachteil LFP vs Metalloxide?", "answer": "Mehr thermische Sicherheit/Stabilität; geringere Zellspannung und damit geringere Energiedichte."}, {"id": 457, "e": "H15-A3", "t": "open", "src": "H15 3.1d", "q": "Drei Bauformen?", "answer": "Rundzelle, Pouch, Knopfzelle oder prismatisch."}, {"id": 458, "e": "H15-A3", "t": "open", "src": "H15 3.1e", "q": "Warum kein wässriger Elektrolyt?", "answer": "Hohe Zellspannung würde Wasser elektrolysieren."}, {"id": 459, "e": "H15-A3", "t": "open", "src": "H15 3.2a", "q": "Effekt an Kathode beim Überladen?", "answer": "Überentladung/Instabilität des Kathodenmaterials, Zersetzung und Thermal-Runaway-Risiko; Musterlösung nennt Kathodenzerfall/thermische Instabilität."}, {"id": 460, "e": "H15-A3", "t": "open", "src": "H15 3.2b", "q": "Zwei Effekte an Anode beim Überladen?", "answer": "Lithium-Plating, Cracking, Aktivmaterial-/Lithiumverlust, zusätzliche SEI, Co-Interkalation."}, {"id": 461, "e": "H15-A3", "t": "open", "src": "H15 3.2c", "q": "Welche Elektrode beginnt bei Überladung zuerst exotherm zu reagieren?", "answer": "Kathode/positive Elektrode."}, {"id": 462, "e": "H15-A3", "t": "open", "src": "H15 3.2d", "q": "Warum Einzelzellspannungsüberwachung bei Li-Ion?", "answer": "Keine gutmütigen Nebenreaktionen zum Ladungsausgleich; SOC serieller Zellen kann nicht selbstständig ausgeglichen werden."}, {"id": 463, "e": "H15-A3", "t": "open", "src": "H15 3.2e", "q": "Drei Balancing-Typen?", "answer": "Passiv, passiv gesteuert, aktiv."}, {"id": 464, "e": "H15-A3", "t": "open", "src": "H15 3.2f", "q": "Schädigender Effekt bei Tiefentladung?", "answer": "Kupfer-Ableiterkorrosion; beim Wiederaufladen kann Kupfer plattieren."}, {"id": 465, "e": "H15-A3", "t": "open", "src": "H15 3.3a", "q": "USV-Profil: entnommene Energie und Ladung?", "answer": "E=3402,78Wh; Q=76,64Ah."}, {"id": 466, "e": "H15-A3", "t": "open", "src": "H15 3.3b", "q": "40Ah-Zellen: erforderliche Parallelstränge?", "answer": "2 Stränge."}, {"id": 467, "e": "H15-A3", "t": "open", "src": "H15 3.3c", "q": "DOD bei 2 bzw. 3 parallelen Strängen?", "answer": "95,8% bei 2; 63,87% bei 3."}, {"id": 468, "e": "H15-A3", "t": "open", "src": "H15 3.3d", "q": "Wann Brennstoffzelle zuschalten, damit DOD nur 70%?", "answer": "Musterlösung: Qsoll=56Ah, Esoll=2486,4Wh; ΔE=3,3MJ; Brennstoffzelle spätestens nach ca. 3700s, Laufzeit etwa 3300s."}, {"id": 469, "e": "H15-A3", "t": "open", "src": "H15 3.3e", "q": "Welcher Effekt beim Laden in Kälte und was gilt für Anodenpotential?", "answer": "Lithium-Plating; Anodenpotential fällt auf/unter 0V vs Li/Li+."}, {"id": 470, "e": "H15-A3", "t": "open", "src": "H15 3.3f", "q": "Zwei Alterungsuntersuchungen?", "answer": "Zyklische und kalendarische Tests."}, {"id": 471, "e": "H15-A3", "t": "open", "src": "H15 3.4a", "q": "Theoretische gravimetrische Energiedichte LFP/Graphit?", "answer": "≈373,19Wh/kg."}, {"id": 472, "e": "H15-A3", "t": "open", "src": "H15 3.4b", "q": "Warum kann Li-Luft geladen/entladen unterschiedliche Energiedichten haben?", "answer": "O₂ wird nicht in beiden Zuständen als intern mitgeführter Reaktionspartner bilanziert; Systemgrenze ändert Massebilanz."}, {"id": 473, "e": "H15-A4", "t": "open", "src": "H15 4.1a", "q": "Welche 3 Größen misst BMS direkt?", "answer": "Spannung, Strom, Temperatur."}, {"id": 474, "e": "H15-A4", "t": "open", "src": "H15 4.1b", "q": "Nenne vier zerstörerische Batterietests.", "answer": "Z.B. Überladung, Kurzschluss, Tiefentladung/Überlast; Feuer/Wärmeexposition/thermische Zyklen; Quetsch-/Nageltest."}, {"id": 475, "e": "H15-A4", "t": "open", "src": "H15 4.1c", "q": "Vier Nachteile Schnellladen?", "answer": "Hohe Netzleistung, hohe Ladegeräte-Kosten, nur an zentralen Punkten, Erwärmung/hohe Batterielast, höhere Pack-/Kühlkosten."}, {"id": 476, "e": "H15-A4", "t": "open", "src": "H15 4.1d", "q": "Beschrifte EIS-Achsen und Bereiche hoher/tiefer Frequenz.", "answer": "Re(Z) horizontal, Im(Z) vertikal; hohe f links/nahe Ursprung, tiefe f weiter rechts/oben gemäß Plot."}, {"id": 477, "e": "H15-A4", "t": "open", "src": "H15 4.1e", "q": "Welche kombinierten Ladeverfahren?", "answer": "CC-CV; CC-CV-CV mit zwei Endspannungsniveaus; CC-CV-CC mit begrenzter Ladungsmenge/Zeit."}, {"id": 478, "e": "H15-A4", "t": "open", "src": "H15 4.2a", "q": "Welche SOC-Formel ist richtig?", "answer": "SOC=SOCinit+(1/Cnenn)∫i(t)dt."}, {"id": 479, "e": "H15-A4", "t": "open", "src": "H15 4.2b", "q": "ΔSOC des gezeigten Profils bei C=5Ah?", "answer": "ΔSOC = −17,5 %."}, {"id": 480, "e": "H15-A4", "t": "open", "src": "H15 4.2c", "q": "Start SOC 50%: wie oft Profil bis leer und wann?", "answer": "Nach 2 Profilen SOC=15%; beim dritten wird die Zelle leer, laut Musterlösung nach insgesamt ca. 145,5min."}, {"id": 481, "e": "H15-A4", "t": "open", "src": "H15 4.2d", "q": "Welche Restkapazität, wenn dasselbe Profil SOC von 40% auf 20% ändern soll?", "answer": "Cnenn=4,375Ah; mit Ersatzintegral −0,7Ah ergibt sich 3,5Ah."}, {"id": 482, "e": "H15-A4", "t": "open", "src": "H15 4.3a", "q": "10 EV/Tag, je 20kWh, η=0,95, 24h: minimale Stationsleistung?", "answer": "Ladedauer pro Fahrzeug 2,4h; Gesamtleistung etwa 8,77kW kontinuierlich über 24h."}, {"id": 483, "e": "H15-A4", "t": "open", "src": "H15 4.3b", "q": "Ladezeit je 20kWh-Fahrzeug bei 100kW?", "answer": "≈12,63min."}, {"id": 484, "e": "H15-A4", "t": "open", "src": "H15 4.3c", "q": "24V-Insel-Batterie für 10×20kWh täglich, 4 Jahre Lebensdauer: benötigte Kapazität?", "answer": "Aus Wöhlerkurve 50%DOD; Energie pro Tag≈210,52kWh inkl. η, Batteriespeicher≈421,05kWh; Kapazität≈17,5kAh."}, {"id": 485, "e": "H15-A4", "t": "open", "src": "H15 4.3d", "q": "Zusatzbatterie B, damit A zwei Jahre länger lebt: Größe?", "answer": "Musterlösung ohne Alterung B: ca. 2,631kAh. Mit Alterung von B ist ein größerer Wert erforderlich; beide auf 35%DOD auslegen function updateStats(){$('done').textContent=state.done;$('correct').textContent=state.correct;const r=state.done?Math.round(100*state.correct/state.done):0;$('rate').textContent=state.done?r+' %':'–';$('bar').style.width=r+'%';if(state.updatedAt)$('lastSaved').textContent='Gespeichert: '+new Date(state.updatedAt).toLocaleString();if($('moduleProgressPanel')&&$('moduleProgressPanel').style.display!=='none')renderModuleProgress()}
function pool(){const e=$('exercise').value,t=$('type').value;return Q.filter(x=>(e==='all'||String(x.e)===e)&&(t==='all'||x.t===t))}
function pick(){const p=pool();if(!p.length)return;let n=p[Math.floor(Math.random()*p.length)];if(p.length>1&&current&&n.id===current.id)n=p[(p.indexOf(n)+1)%p.length];current=n;answered=false;render()}

 return ''

function render(){const q=current;$('badgeExercise').textContent=(String(q.e).startsWith('VL')?'Vorlesung '+String(q.e).slice(2):'Übung '+q.e);$('badgeType').textContent=names[q.t];$('badgeSource').textContent=q.src;$('question').textContent=q.q;$('visual').innerHTML=q.graphic?visual(q.graphic):'';$('feedback').style.display='none';const f=$('answerForm');f.innerHTML='';
 if(q.t==='mc'||q.t==='graphic')q.opts.forEach((o,i)=>{const l=document.createElement('label');l.className='opt';l.innerHTML=`<input type="radio" name="ans" value="${i}"><span>${o}</span>`;f.appendChild(l)});
 else if(q.t==='multi')q.opts.forEach((o,i)=>{const l=document.createElement('label');l.className='opt';l.innerHTML=`<input type="checkbox" name="ansMulti" value="${i}"><span>${o}</span>`;f.appendChild(l)});
 else if(q.t==='cloze'){const w=document.createElement('div');w.className='cloze';q.parts.forEach((p,i)=>{w.append(document.createTextNode(p));if(i<q.blanks.length){const inp=document.createElement('input');inp.type='text';inp.dataset.blank=i;w.appendChild(inp)}});f.appendChild(w)}
 else{const a=document.createElement('textarea');a.id='textAns';a.rows=4;a.placeholder=q.t==='formula'?'Formel eingeben …':'Antwort in eigenen Worten …';f.appendChild(a)}
 $('check').textContent=q.t==='open'?'Musterlösung vergleichen':'Prüfen'}
function norm(s){return String(s).toLowerCase().replace(/\s/g,'').replace(/η/g,'eta').replace(/κ/g,'kappa').replace(/∫/g,'integral').replace(/·/g,'*').replace(/−/g,'-')}
function fb(title,body,kind='') {const e=$('feedback');e.style.display='block';e.className='feedback '+kind;e.innerHTML=`<b>${title}</b><div style="margin-top:6px">${body}</div>${current.ex?`<div class="muted" style="margin-top:8px;font-size:13px">${current.ex}</div>`:''}`}
function reg(ok){state.done++;if(ok)state.correct++;const k=String(current.id);if(!state.perQuestion[k])state.perQuestion[k]={attempts:0,correct:0,last:null};state.perQuestion[k].attempts++;if(ok)state.perQuestion[k].correct++;state.perQuestion[k].last=new Date().toISOString();save()}
function check(){if(answered&&current.t!=='open')return;let ok=false;
 if(current.t==='mc'||current.t==='graphic'){const r=document.querySelector('input[name="ans"]:checked');if(!r)return fb('Noch keine Antwort','Wähle zuerst eine Antwort.');ok=Number(r.value)===current.correct}
 else if(current.t==='multi'){const rs=[...document.querySelectorAll('input[name="ansMulti"]:checked')].map(x=>Number(x.value)).sort((a,b)=>a-b);if(!rs.length)return fb('Noch keine Antwort','Wähle mindestens eine Antwort aus.');const cor=[...current.correct].sort((a,b)=>a-b);ok=rs.length===cor.length&&rs.every((v,i)=>v===cor[i])}
 else if(current.t==='cloze'){const ins=[...document.querySelectorAll('[data-blank]')];if(ins.some(x=>!x.value.trim()))return fb('Noch nicht vollständig','Fülle alle Lücken aus.');ok=ins.every((x,i)=>norm(x.value)===norm(current.blanks[i]))}
 else if(current.t==='formula'){const v=$('textAns').value;if(!v.trim())return fb('Noch keine Antwort','Gib zuerst eine Formel ein.');const n=norm(v);ok=current.alts.every(a=>n.includes(norm(a)))}
 else return fb('Musterlösung',`<b>${current.answer}</b>`);
 answered=true;reg(ok);fb(ok?'✓ Richtig':'✗ Noch nicht ganz',ok?'Sehr gut.':`Lösung: <b>${current.answer!==undefined?current.answer:(current.t==='multi'?current.correct.map(i=>current.opts[i]).join(' · '):current.opts[current.correct])}</b>`,ok?'good':'bad')}
function reveal(){let s='';if(current.t==='mc'||current.t==='graphic')s=current.opts[current.correct];else if(current.t==='multi')s=current.correct.map(i=>'✓ '+current.opts[i]).join('<br>');else if(current.t==='cloze')s=current.parts.map((p,i)=>p+(i<current.blanks.length?'<b>'+current.blanks[i]+'</b>':'')).join('');else s=current.answer;fb('Lösung',s)}
function exportProgress(){const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='BSS_Lernfortschritt_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importProgress(file){const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(typeof x.done!=='number'||typeof x.correct!=='number')throw 0;state={version:1,perQuestion:{},...x};save();alert('Fortschritt importiert.')}catch(e){alert('Ungültige Fortschrittsdatei.')}};r.readAsText(file)}

function moduleLabel(e){
 const s=String(e);
 if(s.startsWith('VL'))return 'VL'+s.slice(2).padStart(2,'0');
 if(s==='K16-LI')return 'F16 · A1 Lithium';
 if(s==='K16-PB')return 'F16 · A2 Blei-Säure';
 if(s==='K16-DSK')return 'F16 · A3 DSK';
 if(s==='K16-BMS')return 'F16 · A4 BMS';
 if(/^(F14|H14|F15|H15)-A[1-4]$/.test(s))return s.replace('-',' · ');
 return 'Ü'+s.padStart(2,'0')
}
function moduleProgressData(){
 const order=['VL01','VL02','VL03','VL04','VL05','VL06',1,2,3,4,5,6,'F14-A1','F14-A2','F14-A3','F14-A4','H14-A1','H14-A2','H14-A3','H14-A4','F15-A1','F15-A2','F15-A3','F15-A4','H15-A1','H15-A2','H15-A3','H15-A4','K16-LI','K16-PB','K16-DSK','K16-BMS'];
 return order.map(e=>{
   const qs=Q.filter(q=>String(q.e)===String(e));
   let attempts=0,correct=0,seen=0;
   qs.forEach(q=>{const s=state.perQuestion[String(q.id)];if(s){attempts+=s.attempts||0;correct+=s.correct||0;if((s.attempts||0)>0)seen++}});
   const accuracy=attempts?Math.round(100*correct/attempts):0;
   const coverage=qs.length?Math.round(100*seen/qs.length):0;
   return {e,label:moduleLabel(e),total:qs.length,seen,attempts,correct,accuracy,coverage};
 });
}
function renderModuleProgress(){
 const panel=$('moduleProgressPanel');
 panel.innerHTML=moduleProgressData().map(x=>`<div class="moduleRow">
   <div class="moduleTop"><b>${x.label}</b><span>${x.seen}/${x.total} gesehen</span></div>
   <div class="moduleBar"><div style="width:${x.coverage}%"></div></div>
   <div class="moduleMeta">Abdeckung ${x.coverage}% · Versuche ${x.attempts} · richtig ${x.correct} · Trefferquote ${x.attempts?x.accuracy+'%':'–'}</div>
 </div>`).join('');
}
$('moduleProgressBtn').onclick=()=>{const p=$('moduleProgressPanel');p.style.display=p.style.display==='none'?'block':'none';if(p.style.display==='block')renderModuleProgress()};
$('newQuestion').onclick=pick;$('next').onclick=pick;$('check').onclick=check;$('show').onclick=reveal;$('exercise').onchange=pick;$('type').onchange=pick;
$('exportBtn').onclick=exportProgress;$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=e=>{if(e.target.files[0])importProgress(e.target.files[0]);e.target.value=''};
$('reset').onclick=()=>{if(confirm('Gesamten Fortschritt wirklich zurücksetzen?')){state={version:1,done:0,correct:0,perQuestion:{},updatedAt:null};save();pick()}};
load();pick();
</script></body></html>
