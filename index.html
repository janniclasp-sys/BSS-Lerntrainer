immt die Lebensdauer.", "Packdesign hat keinen Einfluss.", "Balancing verkürzt immer die Lebensdauer."], "correct": 0, "ex": "Gute Zellen sind notwendig, aber nicht hinreichend für ein langlebiges Pack."}, {"id": 98, "e": "VL06", "t": "mc", "src": "VL06 S.18–19", "q": "Welche Gesamtreaktion beschreibt die Blei-Säure-Batterie?", "opts": ["Pb + PbO₂ + 2 H₂SO₄ ⇌ 2 PbSO₄ + 2 H₂O", "LiC₆ + CoO₂ ⇌ LiCoO₂ + C₆", "2 H₂O ⇌ 2 H₂ + O₂ als Hauptreaktion", "Pb ⇌ PbO₂ ohne Elektrolyt"], "correct": 0, "ex": "Bei der Entladung entsteht an beiden Elektroden PbSO₄ – Doppelsulfattheorie."}, {"id": 99, "e": "VL06", "t": "cloze", "src": "VL06 S.18–23", "q": "Vervollständige die Materialien der Blei-Säure-Zelle.", "parts": ["Positive Aktivmasse: ", "; negative Aktivmasse: poröser ", "; Elektrolyt: verdünnte ", "."], "blanks": ["PbO2", "Bleischwamm", "Schwefelsäure"], "ex": "Das Nennpotential einer Zelle liegt bei etwa 2 V."}, {"id": 100, "e": "VL06", "t": "mc", "src": "VL06 S.26", "q": "Welche besondere Rolle spielt Schwefelsäure in der Bleibatterie?", "opts": ["Sie ist Elektrolyt und Reaktant; ihre Konzentration sinkt beim Entladen.", "Sie ist nur Kühlmittel.", "Sie nimmt nicht an der Reaktion teil.", "Ihre Konzentration steigt beim Entladen."], "correct": 0, "ex": "Die Säuredichte korreliert deshalb mit Ladezustand und Gleichgewichtsspannung."}, {"id": 101, "e": "VL06", "t": "mc", "src": "VL06 S.68", "q": "Welche beiden Grundformen der Alterung werden unterschieden?", "opts": ["Kalendarische und zyklische Alterung.", "Nur Korrosion und Kurzschluss.", "Nur reversible und irreversible Spannung.", "Mechanische und optische Alterung."], "correct": 0, "ex": "Für die kalendarische Alterung nennt die Vorlesung u.a. Temperatur und Ladespannung, für zyklische Alterung DOD, Strom und Temperatur."}, {"id": 102, "e": "VL06", "t": "cloze", "src": "VL06 S.69–70", "q": "Nenne die vier Hauptalterungseffekte der Blei-Säure-Batterie.", "parts": ["", " , ", " , ", " und ", "."], "blanks": ["Erosion", "Sulfatierung", "Korrosion", "Wasserverlust"], "ex": "Sulfatierung ist zumindest teilweise durch intensives Laden reversibel; Erosion und Korrosion nicht."}, {"id": 103, "e": "VL06", "t": "mc", "src": "VL06 S.70", "q": "Warum verringert Sulfatierung die nutzbare Kapazität?", "opts": ["PbSO₄-Kristalle werden mit der Zeit schwerer wieder aufzulösen bzw. zurückzuladen.", "Sie erhöht die Leitfähigkeit immer.", "Sie vergrößert die aktive Oberfläche unbegrenzt.", "Sie betrifft nur das Gehäuse."], "correct": 0, "ex": "Intensives Laden kann Sulfatierung teilweise zurückbilden."}, {"id": 104, "e": "VL06", "t": "mc", "src": "VL06 S.83–85", "q": "Welche Daumenregel gilt für die Gasungsrate?", "opts": ["×3 je +100 mV Zellspannung und ×2 je +10 K Temperatur.", "×2 je +100 mV und ÷2 je +10 K.", "Unabhängig von Spannung und Temperatur.", "Nur proportional zur Kapazität."], "correct": 0, "ex": "Gasung zerlegt Wasser; ohne Rekombination entsteht Wasserverlust."}, {"id": 105, "e": "VL06", "t": "graphic", "src": "VL06 S.89–91", "q": "Was ist der Hauptvorteil des Sauerstoffkreislaufs in einer VRLA-Batterie?", "graphic": "oxygen_cycle", "opts": ["Effektive Wasserrekombination und damit deutlich geringerer Wasserverlust.", "Erzeugung von zusätzlichem Wasserstoff.", "Verhinderung jeder Wärmeentwicklung.", "Vollständige Vermeidung von Überdruck ohne Ventil."], "correct": 0, "ex": "Die Rekombination ist exotherm; dadurch steigt das Thermal-Runaway-Risiko. Überdruckventile begrenzen den Druck."}, {"id": 106, "e": "VL06", "t": "mc", "src": "VL06 S.117–122", "q": "Warum ist die Kapazität von Bleibatterien stark stromabhängig?", "opts": ["Hohe Ströme verschlechtern die Kapazitätsausnutzung; deshalb gilt z.B. 10·I10 nicht einfach als I1.", "Kapazität ist immer exakt konstant.", "Nur die Spannung ändert sich.", "Bleibatterien besitzen keine Diffusionslimitierung."], "correct": 0, "ex": "Die Vorlesung gibt typische Peukert-artige Abhängigkeiten für I10, I1 und I100 an."}, {"id": 107, "e": "VL06", "t": "mc", "src": "VL06 S.135–136", "q": "Welche Aussage zum Recycling stimmt?", "opts": ["In Europa werden über 98 % der Industriebatterien recycelt; Blei kann wieder für neue Batterien verwendet werden.", "Bleibatterien sind praktisch nicht recyclebar.", "Nur das Kunststoffgehäuse wird genutzt.", "Schwefelsäure wird unverändert in neue Batterien gefüllt."], "correct": 0, "ex": "Die hohe Recyclingquote ist ein wesentlicher Vorteil der Bleitechnologie."}, {"id": 108, "e": "VL06", "t": "mc", "src": "VL06 S.136", "q": "Für welche Anwendungen ist die Bleibatterie laut Zusammenfassung besonders attraktiv?", "opts": ["Stationäre Stand-by-Anwendungen und günstige Starteranwendungen.", "Hochenergie-Flugzeuge.", "Smartphones.", "Nur Hochtemperaturbetrieb."], "correct": 0, "ex": "Nachteilig ist vor allem das hohe Gewicht bzw. die geringe Energiedichte."}, {"id": 109, "e": 5, "t": "formula", "src": "Ü5 S.4", "q": "Wie wird bei einer Impedanzmessung die komplexe Impedanz bestimmt?", "answer": "Z(f, I_dc) = U_ac / I_ac", "alts": ["uac", "iac", "/"], "ex": "Ein kleiner AC-Strom bekannter Frequenz wird eingeprägt und die Spannungsantwort gemessen."}, {"id": 110, "e": 5, "t": "mc", "src": "Ü5 S.5–6", "q": "Wozu dient Elektrochemische Impedanzspektroskopie (EIS) in der Übung?", "opts": ["Zur Identifikation geeigneter Ersatzschaltbilder.", "Nur zur Bestimmung der Batteriemasse.", "Zur direkten Messung der chemischen Zusammensetzung.", "Nur zum Laden der Batterie."], "correct": 0, "ex": "Zusätzliche RC-Glieder, Induktivität oder komplexere Elemente können den Fit verbessern."}, {"id": 111, "e": 5, "t": "graphic", "src": "Ü5 S.7", "q": "Welche Elemente enthält das vereinfachte Ersatzschaltbild?", "graphic": "ecm", "opts": ["U_OCV, R_ohm sowie R_ct parallel C_dl.", "Nur eine ideale Spannungsquelle.", "Nur R_ohm und eine Induktivität.", "Zwei ideale Stromquellen."], "correct": 0, "ex": "Diffusionsüberspannungen und induktives Verhalten werden in diesem vereinfachten Modell vernachlässigt."}, {"id": 112, "e": 5, "t": "formula", "src": "Ü5 S.8–10", "q": "Wie lautet die Zeitkonstante des Rct-Cdl-Glieds?", "answer": "τ = R_ct · C_dl", "alts": ["rct", "cdl"], "ex": "Sie bestimmt das transiente Reaktionsverhalten."}, {"id": 113, "e": 5, "t": "mc", "src": "Ü5 S.8–10", "q": "Was gilt für t ≫ τ bei konstantem Batteriestrom?", "opts": ["U_C nähert sich R_ct · i_batt.", "U_C bleibt immer null.", "Der Kondensatorstrom bleibt maximal.", "R_ct verschwindet."], "correct": 0, "ex": "Im stationären Zustand trägt der Kondensator keinen Gleichstrom mehr."}, {"id": 114, "e": 5, "t": "formula", "src": "Ü5 Ü5.2", "q": "Wie lautet die ohmsche Verlustleistung eines Packs?", "answer": "P_verlust = R_i · I²", "alts": ["ri", "i", "2"], "ex": "Diese Verlustleistung erwärmt das Pack."}, {"id": 115, "e": 5, "t": "formula", "src": "Ü5 Ü5.2", "q": "Wie lautet die thermische Energiebilanz ohne Wärmeaustausch?", "answer": "R_i I² = m · c_T · dT/dt", "alts": ["ri", "m", "dt"], "ex": "Ohmsche Verluste werden vollständig in innere Wärme des Packs umgesetzt."}, {"id": 116, "e": 5, "t": "formula", "src": "Ü5 Ü5.2", "q": "Wie wird die konvektive Kühlleistung modelliert?", "answer": "P_Kühlung = h · A · (T_pack − T_umgebung)", "alts": ["h", "a", "tpack"], "ex": "Mit Kühlung gilt P_verlust = P_Speicherung + P_Kühlung."}, {"id": 117, "e": 6, "t": "mc", "src": "Ü6 S.2", "q": "Welche Folgen hat intensives Laden einer Blei-Säure-Batterie?", "opts": ["Sulfatierung kann teilweise rückgängig gemacht werden, gleichzeitig kann intensive Gasung auftreten.", "Korrosion wird vollständig rückgängig gemacht.", "Es gibt keine Gasung.", "Erosion wird repariert."], "correct": 0, "ex": "Sulfatierung ist teilweise reversibel; Korrosion und Erosion sind es nicht."}, {"id": 118, "e": 6, "t": "mc", "src": "Ü6 S.3–4", "q": "Welche Aussagen zu verschlossenen (VRLA) Batterien stimmen?", "opts": ["Geringerer Wasserverlust und höheres Thermal-Runaway-Risiko durch exotherme Rekombination.", "Sie besitzen nie Überdruckventile.", "Sie haben grundsätzlich keinerlei Gasreaktion.", "Sie platzen zwangsläufig bei jeder Ladung."], "correct": 0, "ex": "Der Sauerstoffkreislauf rekombiniert Wasser; Ventile schützen vor zu hohem Druck."}, {"id": 119, "e": 6, "t": "cloze", "src": "Ü6 S.5", "q": "Vervollständige die Gasungsregeln.", "parts": ["Gasungsrate ×", " bei +100 mV; Gasungsrate ×", " bei +10 °C. H₂ entsteht an der ", " Elektrode, O₂ an der ", " Elektrode."], "blanks": ["3", "2", "negativen", "positiven"], "ex": "Diese Daumenregeln werden in Ü6 verwendet."}, {"id": 120, "e": 6, "t": "formula", "src": "Ü6 S.5", "q": "Gib das Faraday-Gesetz an.", "answer": "Q = n · z · F", "alts": ["n", "z", "f"], "ex": "F = 96485 C/mol."}, {"id": 121, "e": 6, "t": "open", "src": "Ü6 Ü6.1", "q": "Eine 12-V-Blei-Säure-Batterie besteht aus Zellen mit etwa 2 V Nennspannung. Wie viele Zellen sind in Serie?", "answer": "6 Zellen", "ex": "12 V / 2 V pro Zelle = 6."}, {"id": 122, "e": 6, "t": "formula", "src": "Ü6 Ü6.2", "q": "Welche Energie besitzt ein Kondensator/Supercap bei Spannung U?", "answer": "E = 1/2 · C · U²", "alts": ["c", "u", "2"], "ex": "Die Energie sinkt quadratisch mit der Spannung."}, {"id": 123, "e": 6, "t": "formula", "src": "Ü6 Ü6.2", "q": "Wie ergibt sich die Ersatzkapazität N identischer Supercaps in Serie?", "answer": "C_pack = C_einzel / N", "alts": ["c", "n", "/"], "ex": "Bei identischen Serienschaltungen addieren sich die Kehrwerte der Kapazitäten."}, {"id": 124, "e": 6, "t": "formula", "src": "Ü6 Ü6.2", "q": "Wie ergibt sich der Gesamtwiderstand N identischer Supercaps in Serie?", "answer": "R_pack = N · R_i", "alts": ["n", "ri"], "ex": "Serienwiderstände addieren sich."}, {"id": 125, "e": 6, "t": "open", "src": "Ü6 Ü6.2", "q": "Ein Fahrzeug mit 1500 kg wird von 0 auf 60 km/h beschleunigt. Welche Grundformel liefert zunächst die benötigte kinetische Energie?", "answer": "E_kin = 1/2 · m · v²; die Batterie muss wegen η < 1 entsprechend E_kin/η liefern.", "ex": "In der Übung beträgt der Antriebswirkungsgrad 94 %."}, {"id": 126, "e": "VL01", "t": "formula", "src": "VL01 S.19", "q": "Eine Li-Ionen-Zelle besitzt eine volumetrische Energiedichte von etwa 600 kWh/m³. Wie viel Energie wären idealisiert in 10 Litern Zellvolumen enthalten?", "answer": "ca. 6 kWh", "alts": ["6", "kwh"], "ex": "10 L = 0,01 m³; 600 kWh/m³ × 0,01 m³ = 6 kWh."}, {"id": 127, "e": "VL01", "t": "open", "src": "VL01 S.24–25", "q": "Warum benötigt ein Brennstoffzellenfahrzeug bei erneuerbarer Stromerzeugung deutlich mehr Primärstrom als ein BEV?", "answer": "Weil zusätzliche Umwandlungsschritte wie Elektrolyse, H₂-Speicherung/Verteilung und Brennstoffzelle Verluste verursachen; der Gesamtwirkungsgrad ist deutlich kleiner.", "ex": "Die Vorlesung stellt ungefähr 70–75 % für den batterieelektrischen Pfad etwa 25–30 % für den H₂/FCEV-Pfad gegenüber."}, {"id": 128, "e": "VL02", "t": "formula", "src": "VL02 S.8–10", "q": "Wie lässt sich die elektrische Energie bei näherungsweise konstanter Spannung aus Spannung und Kapazität abschätzen?", "answer": "E [Wh] ≈ U [V] · C [Ah]", "alts": ["u", "c"], "ex": "Volt × Amperestunde ergibt Wattstunde."}, {"id": 129, "e": "VL02", "t": "mc", "src": "VL02 S.16", "q": "Warum sinkt die nutzbare Kapazität bei sehr hohen Entladeströmen typischerweise?", "opts": ["Weil stärkere Überspannungen und Transport-/Diffusionslimitierungen die Entladeschlussspannung früher erreichen lassen.", "Weil die Nennspannung proportional zum Strom steigt.", "Weil der Separator Elektronen leitet.", "Weil die Zellmasse während der Entladung sinkt."], "correct": 0, "ex": "Die Vorlesung verknüpft hohe Ströme mit größerer Polarisation und schlechterer Kapazitätsausnutzung."}, {"id": 130, "e": "VL02", "t": "cloze", "src": "VL02 S.34", "q": "Vervollständige den Unterschied zwischen OCV und Gleichgewichtsspannung.", "parts": ["OCV bedeutet zunächst nur ", " Strom. Nach einer Belastung können noch ", "überspannungen vorhanden sein; echte Gleichgewichtsspannung setzt vollständige ", " voraus."], "blanks": ["null", "Diffusions", "Relaxation"], "ex": "Darum ist eine unmittelbar nach Stromabschaltung gemessene OCV nicht zwingend die thermodynamische Gleichgewichtsspannung."}, {"id": 131, "e": "VL02", "t": "mc", "src": "VL02 S.60–66", "q": "Was bedeutet eine hohe Austauschstromdichte i₀ für die Reaktionskinetik?", "opts": ["Für einen gegebenen Strom ist eine kleinere Reaktionsüberspannung erforderlich.", "Die Reaktion ist grundsätzlich blockiert.", "Die ohmsche Überspannung wird unendlich.", "Die Gleichgewichtsspannung wird null."], "correct": 0, "ex": "Eine hohe Austauschstromdichte steht für schnelle Elektrodenkinetik."}, {"id": 132, "e": "VL03", "t": "mc", "src": "VL03 S.65", "q": "Was ist bei einer High-Power-Li-Ionen-Zelle unter hoher Entladerate charakteristisch?", "opts": ["Die Klemmspannung fällt durch höhere Überspannungen stärker ab.", "Die Zellspannung ist unabhängig vom Strom.", "Die nutzbare Leistung wird ausschließlich durch die Zellmasse bestimmt.", "Der Innenwiderstand erzeugt keine Verluste."], "correct": 0, "ex": "Die Entladecharakteristik in VL03 zeigt die Stromabhängigkeit der Zellspannung."}, {"id": 133, "e": "VL03", "t": "mc", "src": "VL03 S.124", "q": "Welche Folge kann mechanisches Cracking von Graphitpartikeln für die Alterung haben?", "opts": ["Neue Oberfläche entsteht, auf der zusätzliche SEI gebildet werden kann.", "Die SEI verschwindet dauerhaft ohne Nebenreaktion.", "Die Energiedichte steigt automatisch.", "Lithium-Plating wird unmöglich."], "correct": 0, "ex": "Neue Oberfläche kann weiteren Elektrolytverbrauch und SEI-Bildung verursachen."}, {"id": 134, "e": "VL03", "t": "mc", "src": "VL03 S.198–199", "q": "Warum kann die geringere Energiedichte von Natrium-Ionen-Zellen einen Teil des Rohstoffkostenvorteils wieder aufzehren?", "opts": ["Pro kWh werden mehr Zellmaterial, Gehäuse, Stromableiter, Elektrolyt und Produktionskapazität benötigt.", "Natrium ist teurer als Lithiumcarbonat.", "Natrium-Ionen-Zellen benötigen keine Stromableiter.", "Die Zellspannung ist immer höher als bei NMC."], "correct": 0, "ex": "VL03 nennt bei etwa halber Energiedichte ungefähr doppelten Aufwand für mehrere passive Komponenten pro kWh."}, {"id": 135, "e": "VL03", "t": "cloze", "src": "VL03 S.199", "q": "Vervollständige die in VL03 gezeigten typischen Systemvolumina.", "parts": ["SIB ca. ", " l/kWh, LFP ca. ", " l/kWh, NMC ca. ", " l/kWh."], "blanks": ["3,7", "2,7", "1,5"], "ex": "Die niedrigere Zellspannung und Energiedichte erhöhen bei SIB den Pack- und Elektronikaufwand."}, {"id": 136, "e": "VL04", "t": "open", "src": "VL04 S.13–14", "q": "Warum fällt beim CC-CV-Laden der Strom in der CV-Phase ab?", "answer": "Weil die Zellspannung an der Ladeschlussspannung gehalten wird und mit zunehmendem Ladezustand die treibende Spannungsdifferenz kleiner wird.", "ex": "Nach der Konstantstromphase begrenzt die konstante Ladeschlussspannung den Strom."}, {"id": 137, "e": "VL04", "t": "mc", "src": "VL04 S.9–11", "q": "Warum ist ein relatives Kriterium wie −ΔU oder dT/dt bei NiMH oft robuster als nur ein absoluter Spannungsgrenzwert?", "opts": ["Weil absolute Werte von Temperatur, Alterung und Zelltyp abhängen können.", "Weil Spannung bei NiMH nie messbar ist.", "Weil Temperatur keinerlei Einfluss hat.", "Weil relative Kriterien nur die Ladezeit messen."], "correct": 0, "ex": "Gradienten können das Ladeende trotz variierender Absolutwerte anzeigen."}, {"id": 138, "e": "VL04", "t": "open", "src": "VL04 S.24", "q": "Eine 80-kWh-Batterie wird mit 240 kW geladen. Welche mittlere C-Rate entspricht das näherungsweise?", "answer": "3 C", "ex": "C-Rate ≈ 240 kW / 80 kWh = 3 h⁻¹ bzw. 3 C."}, {"id": 139, "e": "VL04", "t": "mc", "src": "VL04 S.31–39", "q": "Warum ist Schnellladen bei niedriger Zelltemperatur besonders kritisch?", "opts": ["Die Transport- und Einlagerungskinetik an der Anode wird langsamer, wodurch das Anodenpotential leichter in den Plating-Bereich fällt.", "Der Elektrolyt wird zum perfekten Leiter.", "Die Zellspannung sinkt auf 0 V.", "Die Kathode nimmt kein Lithium mehr auf, weil sie zu warm ist."], "correct": 0, "ex": "Niedrige Temperatur plus hohe Laderate ist eine zentrale Plating-Risikokombination."}, {"id": 140, "e": "VL05", "t": "open", "src": "VL05 S.43–49", "q": "Ein Pack soll aus 3,7-V-Zellen ungefähr 400 V erreichen. Wie viele Zellen werden idealisiert in Serie benötigt?", "answer": "ca. 108 Zellen", "ex": "400 V / 3,7 V ≈ 108. In der Praxis hängen Nenn- und Grenzspannungen von Zellchemie und Auslegung ab."}, {"id": 141, "e": "VL05", "t": "mc", "src": "VL05 S.46", "q": "Warum kann eine Parallelschaltung die Robustheit gegenüber Zellstreuung erhöhen?", "opts": ["Parallele Zellen teilen den Strom und bilden gemeinsam eine Kapazitäts-/Stromeinheit; einzelne Abweichungen wirken anders als in einem reinen langen Serienstrang.", "Weil parallel geschaltete Zellen unterschiedliche Spannungen behalten können.", "Weil kein BMS mehr nötig ist.", "Weil Parallelschaltung die Zellchemie verändert."], "correct": 0, "ex": "VL05 diskutiert Verschaltung als Stellhebel für Leistung, Redundanz und Alterungsverhalten."}, {"id": 142, "e": "VL05", "t": "open", "src": "VL05 S.62", "q": "Ein Vorladekreis hat R = 100 Ω und C = 2 mF. Wie groß ist die Zeitkonstante τ und ungefähr 5τ?", "answer": "τ = 0,2 s; 5τ ≈ 1,0 s", "ex": "τ = R·C = 100 Ω × 0,002 F = 0,2 s."}, {"id": 143, "e": "VL05", "t": "mc", "src": "VL05 S.81/141", "q": "Warum kann das BMS den SOC nicht einfach direkt mit einem Sensor messen?", "opts": ["SOC ist eine innere Zustandsgröße und wird aus Messgrößen wie Strom, Spannung, Temperatur und Modellen geschätzt.", "SOC ist identisch mit der Zelltemperatur.", "SOC ist immer exakt proportional zur momentanen Klemmspannung.", "SOC existiert nur bei Blei-Säure-Batterien."], "correct": 0, "ex": "Das BMS kombiniert Messung und Modell zur Zustandsbestimmung."}, {"id": 144, "e": "VL06", "t": "formula", "src": "VL06 S.18–26", "q": "Wie viele Elektronen werden bei der Gesamtreaktion Pb + PbO₂ + 2 H₂SO₄ ⇌ 2 PbSO₄ + 2 H₂O übertragen?", "answer": "z = 2", "alts": ["2"], "ex": "Die Teilreaktionen übertragen insgesamt zwei Elektronen pro stöchiometrischem Umsatz."}, {"id": 145, "e": "VL06", "t": "mc", "src": "VL06 S.26", "q": "Warum kann die Säuredichte einer Blei-Säure-Batterie als Hinweis auf den Ladezustand dienen?", "opts": ["Weil Schwefelsäure Reaktant ist und ihre Konzentration beim Entladen abnimmt.", "Weil Schwefelsäure nur Kühlmittel ist.", "Weil beim Entladen zusätzliche Schwefelsäure entsteht.", "Weil die Dichte ausschließlich von der Gehäusemasse abhängt."], "correct": 0, "ex": "Beim Entladen werden Sulfationen in PbSO₄ gebunden und Wasser entsteht."}, {"id": 146, "e": "VL06", "t": "open", "src": "VL06 S.83–85", "q": "Die Gasungsrate einer Zelle sei bei einem Referenzpunkt 1. Wie groß ist sie nach +100 mV Zellspannung und zusätzlich +10 °C nach der Daumenregel?", "answer": "Faktor 6", "ex": "×3 für +100 mV und ×2 für +10 K → insgesamt ×6."}, {"id": 147, "e": "VL06", "t": "mc", "src": "VL06 S.89–91", "q": "Warum kann der Sauerstoffkreislauf einer VRLA-Batterie das Thermal-Runaway-Risiko erhöhen?", "opts": ["Die Sauerstoffrekombination ist exotherm und kann zusätzliche Wärme erzeugen.", "Weil dabei keine Wärme entsteht.", "Weil das Ventil die Batterie aktiv heizt.", "Weil Schwefelsäure vollständig verdampft."], "correct": 0, "ex": "Wasserrekombination reduziert Wasserverlust, erzeugt aber Wärme."}, {"id": 148, "e": 1, "t": "open", "src": "Ü1 S.6–10", "q": "Vier identische Zellen mit 3,7 V und 5 Ah werden parallel geschaltet. Welche Nennspannung und Kapazität hat der Verbund idealisiert?", "answer": "3,7 V und 20 Ah", "ex": "Parallel: Spannung bleibt gleich, Kapazitäten addieren sich."}, {"id": 149, "e": 1, "t": "open", "src": "Ü1 S.9–10", "q": "Vier identische Zellen mit 3,7 V und 5 Ah werden in Serie geschaltet. Welche Nennspannung und Kapazität hat der Verbund idealisiert?", "answer": "14,8 V und 5 Ah", "ex": "Serie: Spannungen addieren sich, Ah-Kapazität bleibt gleich."}, {"id": 150, "e": 2, "t": "open", "src": "Ü2 S.3–4", "q": "Eine Batterie nimmt beim Laden 10,0 Ah auf und gibt 9,8 Ah wieder ab. Wie groß ist der coulombsche Wirkungsgrad?", "answer": "98 %", "ex": "ηAh = 9,8 Ah / 10,0 Ah = 0,98."}, {"id": 151, "e": 2, "t": "mc", "src": "Ü2 S.10–13", "q": "Welche physikalische Ursache wird mit der Diffusionsüberspannung verknüpft?", "opts": ["Begrenzter Stofftransport bzw. Konzentrationsgradienten.", "Elektronenwiderstand der Batteriepole allein.", "Freie Gibbs-Energie im Gleichgewicht.", "Mechanische Gehäuseverformung."], "correct": 0, "ex": "Der Diffusionsanteil wird über Stofftransport/Fick beschrieben."}, {"id": 152, "e": 2, "t": "open", "src": "Ü2 S.16", "q": "Eine C20-Batterie besitzt 80 Ah. Wie groß sind I20 und 4·I20?", "answer": "I20 = 4 A; 4·I20 = 16 A", "ex": "80 Ah / 20 h = 4 A."}, {"id": 153, "e": 3, "t": "formula", "src": "Ü3 S.3", "q": "Wie lässt sich aus ΔG die Gleichgewichtsspannung U₀ bestimmen?", "answer": "U₀ = −ΔG / (z · F)", "alts": ["dg", "z", "f"], "ex": "Umgestellt aus ΔG = −U₀·z·F."}, {"id": 154, "e": 3, "t": "open", "src": "Ü3 S.9", "q": "Eine 75-Ah-Batterie wird mit 150 A entladen. Welche C-Rate liegt vor?", "answer": "2 C", "ex": "C-Rate = 150 A / 75 Ah = 2 C."}, {"id": 155, "e": 3, "t": "mc", "src": "Ü3 S.11–13", "q": "Welche Teilreaktion ist bei einer Oxidation charakteristisch?", "opts": ["Abgabe/Entzug von Elektronen.", "Aufnahme von Elektronen.", "Kein Ladungstransfer.", "Nur Diffusion ohne Reaktion."], "correct": 0, "ex": "Oxidation bedeutet Elektronenabgabe; Reduktion Elektronenaufnahme."}, {"id": 156, "e": 4, "t": "open", "src": "Ü4", "q": "Ein Elektrolyt hat κ = 1 S/m, A = 0,02 m² und l = 1 mm. Wie groß ist der Leitwert G?", "answer": "20 S", "ex": "G = κA/l = 1·0,02/0,001 = 20 S."}, {"id": 157, "e": 4, "t": "mc", "src": "Ü4 S.6", "q": "Warum begünstigen dünne Elektroden hohe Leistung?", "opts": ["Ionen haben kürzere Transportwege und Konzentrationsgradienten werden geringer.", "Sie enthalten immer mehr Aktivmaterial.", "Der Separator wird überflüssig.", "Die Zellspannung verdoppelt sich."], "correct": 0, "ex": "Der Nachteil ist ein größerer Anteil passiver Komponenten und damit geringere Energiedichte."}, {"id": 158, "e": 4, "t": "cloze", "src": "Ü4 S.7–10", "q": "Vervollständige die Potentialbeziehung.", "parts": ["Die Zellspannung ergibt sich näherungsweise als Potential der ", " Elektrode minus Potential der ", " Elektrode."], "blanks": ["positiven", "negativen"], "ex": "U_Zelle = φ_pos − φ_neg."}, {"id": 159, "e": 5, "t": "open", "src": "Ü5 S.8–10", "q": "Für Rct = 20 mΩ und Cdl = 500 F: Wie groß ist die Zeitkonstante τ?", "answer": "10 s", "ex": "τ = Rct·Cdl = 0,020 Ω × 500 F = 10 s."}, {"id": 160, "e": 5, "t": "open", "src": "Ü5 Ü5.2", "q": "Ein Pack hat Ri = 50 mΩ und führt 200 A. Welche ohmsche Verlustleistung entsteht?", "answer": "2 kW", "ex": "P = Ri·I² = 0,05 Ω × 40.000 A² = 2.000 W."}, {"id": 161, "e": 6, "t": "open", "src": "Ü6 Ü6.2", "q": "Vier identische Supercaps mit je 100 F werden in Serie geschaltet. Welche Ersatzkapazität ergibt sich?", "answer": "25 F", "ex": "C_pack = C_einzel/N = 100 F / 4 = 25 F."}, {"id": 162, "e": 6, "t": "open", "src": "Ü6 Ü6.2", "q": "Vier identische Supercaps mit je 2 mΩ Innenwiderstand werden in Serie geschaltet. Wie groß ist der Gesamtwiderstand?", "answer": "8 mΩ", "ex": "Serienwiderstände addieren sich: 4 × 2 mΩ = 8 mΩ."}, {"id": 163, "e": "VL02", "t": "multi", "src": "VL02 Grundlagen", "q": "Welche Aussagen zu einer elektrochemischen Zelle sind korrekt? (Mehrfachauswahl)", "opts": ["Der Elektrolyt leitet Ionen.", "Der Separator soll elektronisch isolieren und ionisch durchlässig sein.", "Aktivmaterialien speichern die elektrochemische Energie.", "Der Elektrolyt muss Elektronen zwischen den Elektroden leiten."], "correct": [0, 1, 2], "ex": "Elektrolyt: Ionentransport; Separator: elektronische Trennung bei Ionendurchgang; Aktivmaterialien: Energiespeicherung."}, {"id": 164, "e": "VL03", "t": "multi", "src": "VL03 Lithium-Ionen", "q": "Welche Punkte können zur Alterung einer Graphitanode beitragen? (Mehrfachauswahl)", "opts": ["SEI-Wachstum", "Lithium-Plating", "Dendritenbildung", "Cracking/Abblättern von Graphit", "Gezielte Erhöhung der Elektrolytleitfähigkeit als Alterungsmechanismus"], "correct": [0, 1, 2, 3], "ex": "Die Vorlesung nennt u.a. SEI-Wachstum, Plating, Dendritenbildung sowie Cracking/Abblättern."}, {"id": 165, "e": "VL04", "t": "multi", "src": "VL04 Ladeverfahren", "q": "Welche Aussagen zum CC-CV-Laden von Lithium-Ionen-Zellen sind korrekt? (Mehrfachauswahl)", "opts": ["Zunächst wird mit konstantem Strom geladen.", "Nach Erreichen der Ladeschlussspannung folgt eine Konstantspannungsphase.", "In der CV-Phase sinkt der Strom typischerweise ab.", "Die Zellspannung darf in der CC-Phase unbegrenzt steigen."], "correct": [0, 1, 2], "ex": "Das Standardverfahren ist CC-CV: Konstantstrom bis zur Ladeschlussspannung, danach Konstantspannung mit abfallendem Strom."}, {"id": 166, "e": "VL05", "t": "multi", "src": "VL05 Batteriepackdesign", "q": "Welche Aufgaben gehören typischerweise zum Batteriemanagementsystem? (Mehrfachauswahl)", "opts": ["SOC-Schätzung", "Überwachung von Spannungs- und Temperaturgrenzen", "Leistungsprognose", "Balancing", "Mechanisches Verschweißen der Zellverbinder im Betrieb"], "correct": [0, 1, 2, 3], "ex": "Das BMS überwacht und schätzt Zustände und Grenzen; mechanische Fertigung gehört nicht zu seinen Betriebsaufgaben."}, {"id": 167, "e": "VL06", "t": "multi", "src": "VL06 Blei-Säure", "q": "Welche Alterungseffekte werden für Blei-Säure-Batterien als Hauptalterungseffekte genannt? (Mehrfachauswahl)", "opts": ["Erosion", "Sulfatierung", "Korrosion", "Wasserverlust", "SEI-Wachstum"], "correct": [0, 1, 2, 3], "ex": "Bei Blei-Säure werden Erosion, Sulfatierung, Korrosion und Wasserverlust hervorgehoben."}, {"id": 168, "e": 5, "t": "multi", "src": "Ü5 Ersatzschaltbild", "q": "Welche Elemente gehören zum vereinfachten Batterie-Ersatzschaltbild der Übung? (Mehrfachauswahl)", "opts": ["U_OCV", "R_ohm", "R_ct", "C_dl", "Idealtransformator"], "correct": [0, 1, 2, 3], "ex": "Das vereinfachte Modell enthält U_OCV, R_ohm sowie R_ct parallel zu C_dl."}, {"id": 169, "e": 6, "t": "multi", "src": "Ü6 Blei/Supercaps", "q": "Welche Aussagen zu identischen Supercaps in Serienschaltung sind korrekt? (Mehrfachauswahl)", "opts": ["Die Spannungsfestigkeiten addieren sich.", "Die Ersatzkapazität wird kleiner.", "Die Innenwiderstände addieren sich.", "Die Ersatzkapazität ist N-mal größer als die Einzelkapazität."], "correct": [0, 1, 2], "ex": "Bei identischen Supercaps in Serie: U_max addiert sich, C_pack = C/N, R_pack = N·R_i."}, {"id": 170, "e": "K16-LI", "t": "open", "src": "F16 1.1a", "q": "Nimmt der Elektrolyt einer Lithium-Ionen-Batterie an der Elektroden-Hauptreaktion teil bzw. verändert sich sein chemischer Aufbau beim Laden/Entladen?", "answer": "Nein. Der Elektrolyt dient im idealisierten Hauptprozess als Ionenleiter und wird bei der reversiblen Hauptreaktion nicht umgesetzt.", "ex": "Musterlösung: Nein."}, {"id": 171, "e": "K16-LI", "t": "open", "src": "F16 1.1b", "q": "Nenne drei passive Zellkomponenten, die nicht an der Elektrodenreaktion teilnehmen.", "answer": "Zum Beispiel Stromsammler/Stromableiter, Binder und Leitzusätze; auch Separator/Gehäuse sind passive Komponenten.", "ex": "Die Musterlösung nennt u.a. Stromsammler, Binder und leitfähige Additive."}, {"id": 172, "e": "K16-LI", "t": "open", "src": "F16 1.1c", "q": "Wie wird eine Hochleistungszelle gegenüber einer Hochenergiezelle hinsichtlich aktiver Oberfläche, Elektrodenabstand und Beschichtungsdicke ausgelegt?", "answer": "Größere aktive Oberfläche, kürzere Transportwege/kleinere effektive Elektrodenabstände und dünnere Aktivmaterialbeschichtung.", "ex": "Zusätzlich nennt die Musterlösung u.a. mehr poröses Material, mehr leitfähige Additive und geringeren Aktivmaterialanteil."}, {"id": 173, "e": "K16-LI", "t": "multi", "src": "F16 1.1d", "q": "Welche Aussagen sind typische Vor-/Nachteile von LFP gegenüber Lithium-Metall-Oxid-Kathoden?", "opts": ["Hohe thermische Stabilität/Sicherheit", "Relativ flache Spannung über einen großen SOC-Bereich", "Geringere Zellspannung", "Geringere Energiedichte", "Deutlich höhere Zellspannung als typische Metalloxide"], "correct": [0, 1, 2, 3], "ex": "Gefordert waren ein Vorteil und ein Nachteil."}, {"id": 174, "e": "K16-LI", "t": "open", "src": "F16 1.1e", "q": "Nenne drei geometrische Bauformen von Lithium-Ionen-Zellen.", "answer": "Prismatisch, zylindrisch und Pouch; als weitere Bauform ist auch die Knopfzelle möglich.", "ex": "Musterlösung: prismatisch, zylindrisch, pouch, Knopfzelle."}, {"id": 175, "e": "K16-LI", "t": "mc", "src": "F16 1.1f", "q": "Wo befindet sich das aktive Lithium im vollgeladenen Zustand einer üblichen Graphit/Lithium-Metalloxid-Zelle überwiegend?", "opts": ["In der negativen Elektrode (Graphit/„Anode“)", "In der positiven Elektrode („Kathode“)", "Im Separator", "Ausschließlich im Elektrolyten"], "correct": 0, "ex": "Im geladenen Zustand ist das Lithium in das Graphit eingelagert."}, {"id": 176, "e": "K16-LI", "t": "open", "src": "F16 1.2a", "q": "Nenne einen möglichen Effekt an der positiven Elektrode/Kathode beim Überladen einer LiCoO₂/C₆-Zelle.", "answer": "Zum Beispiel Gasung, Zersetzung/Instabilität der Kathode oder daraus resultierender Thermal Runaway.", "ex": "Ein Effekt genügt."}, {"id": 177, "e": "K16-LI", "t": "open", "src": "F16 1.2b", "q": "Nenne einen möglichen Effekt an der negativen Elektrode/Anode beim Überladen einer LiCoO₂/C₆-Zelle.", "answer": "Zum Beispiel Lithium-Plating; außerdem sind Cracking, Verlust von Aktivmaterial oder Verlust von aktivem Lithium mögliche Folgen.", "ex": "Ein Effekt genügt."}, {"id": 178, "e": "K16-LI", "t": "open", "src": "F16 1.2c", "q": "Warum eignet sich die OCV bei LiCoO₂/C₆ besser zur SOC-Bestimmung als bei LFP/C₆?", "answer": "LFP besitzt über einen großen SOC-Bereich eine sehr flache OCV-Kennlinie (Zweiphasengebiet). Kleine Spannungsfehler führen deshalb zu großen SOC-Unsicherheiten.", "ex": "Bei einer stärker geneigten OCV-SOC-Kurve ist der SOC aus der Leerlaufspannung besser unterscheidbar."}, {"id": 179, "e": "K16-LI", "t": "open", "src": "F16 1.2d", "q": "Warum ist bei Lithium-Ionen-Packs eine Einzelzellspannungsüberwachung wichtig, während Bleibatterien typischerweise toleranter sind?", "answer": "Li-Ionen-Zellen besitzen keine gutmütige reversible Überlade-Nebenreaktion wie die Wasserzersetzung/Rekombination bei Blei. Einzelne Zellen dürfen ihre engen Spannungsgrenzen nicht über- oder unterschreiten.", "ex": "Musterlösung: keine reversible Nebenreaktion/Hydrolyse als Ausgleich."}, {"id": 180, "e": "K16-LI", "t": "open", "src": "F16 1.2e", "q": "Warum könnte man theoretisch zwei typische Kathodenmaterialien wie LiCoO₂ und LFP als positive und negative Elektrode kombinieren – und was ist der Nachteil?", "answer": "Entscheidend ist die Potentialdifferenz der beiden Elektroden. Sie kann prinzipiell eine Zellspannung erzeugen, ist zwischen zwei typischen Kathodenmaterialien aber klein, wodurch die praktische Energiedichte sehr gering wäre.", "ex": "Das Prinzip funktioniert über Potentialdifferenz, nicht über die Bezeichnung 'Kathode'."}, {"id": 181, "e": "K16-LI", "t": "multi", "src": "F16 1.2f", "q": "Unter welchen Betriebsbedingungen kann eine nicht gealterte Li-Ionen-Zelle ihre nominelle Kapazität nicht vollständig bereitstellen?", "opts": ["Sehr niedrige Temperatur", "Hoher Entladestrom", "Moderate Temperatur und sehr kleiner Strom", "Nur weil die Zelle neu ist"], "correct": [0, 1], "ex": "Niedrige Temperatur und hohe Ströme vergrößern Polarisation/Transportlimitierungen."}, {"id": 182, "e": "K16-LI", "t": "open", "src": "F16 1.3a1", "q": "USV-Pack: 12 Zellen in Serie je Strang, Ucell=3,7 V, Ccell=20 Ah. Aus dem vorgegebenen Leistungsprofil werden bis 1000 s 2,083 kWh entnommen. Wie viel Ladung entspricht das bei konstanter Packspannung?", "answer": "Q = 46,92 Ah", "ex": "U_Strang = 12·3,7 V = 44,4 V; Q = 2083 Wh / 44,4 V = 46,92 Ah."}, {"id": 183, "e": "K16-LI", "t": "open", "src": "F16 1.3a2", "q": "Wie viele parallele 20-Ah-Stränge werden benötigt, um 46,92 Ah bereitzustellen?", "answer": "3 parallele Stränge", "ex": "2 Stränge liefern nur 40 Ah; 3 Stränge liefern 60 Ah."}, {"id": 184, "e": "K16-LI", "t": "open", "src": "F16 1.3b", "q": "Wie groß ist die DOD jeder Zelle nach Entnahme von 46,92 Ah aus einem Pack mit drei parallelen 20-Ah-Strängen?", "answer": "DOD ≈ 78 %", "ex": "Gesamtkapazität = 60 Ah; 46,92/60 ≈ 0,782."}, {"id": 185, "e": "K16-LI", "t": "open", "src": "F16 1.3c", "q": "Das Pack wird anschließend mit 1 kW bei 44,4 V geladen. Wie lange dauert die vollständige Wiederaufladung von 46,92 Ah idealisiert?", "answer": "ca. 2,08 h", "ex": "I = 1000/44,4 = 22,52 A; t = 46,92/22,52 ≈ 2,08 h."}, {"id": 186, "e": "K16-LI", "t": "open", "src": "F16 1.3d", "q": "Nach der Entladung bleiben 13,08 Ah im Pack. Nach welcher Ladezeit wäre wieder genug Ladung für denselben Notbetrieb vorhanden?", "answer": "ca. 1,50 h", "ex": "Benötigte Nachladung = 46,92−13,08 = 33,84 Ah; t = 33,84/22,52 ≈ 1,50 h."}, {"id": 187, "e": "K16-LI", "t": "open", "src": "F16 1.4a", "q": "Berechne aus M(FePO₄)=150,8 g/mol, M(LiC₆)=79 g/mol, U₀=3,2 V und z=1 die theoretische gravimetrische Energiedichte.", "answer": "ca. 373 Wh/kg", "ex": "Mges=229,8 g/mol; E_mol=F·U/3600≈85,76 Wh/mol; 85,76/0,2298≈373 Wh/kg."}, {"id": 188, "e": "K16-LI", "t": "open", "src": "F16 1.4b", "q": "Warum kann man bei Lithium-Luft-Batterien für geladenen und entladenen Zustand unterschiedliche gravimetrische Energiedichten berechnen?", "answer": "Weil Sauerstoff im entladenen Zustand als Reaktionsprodukt/-bestandteil in der Zellmasse enthalten ist, im geladenen Zustand aber aus der Umgebung stammt bzw. nicht in gleicher Weise zur gespeicherten Zellmasse zählt.", "ex": "Die Systemgrenze/Massenbilanz verändert sich durch den aus der Atmosphäre aufgenommenen Sauerstoff."}, {"id": 189, "e": "K16-LI", "t": "open", "src": "F16 1.5a", "q": "Bei der Formierung gehen 15 % des aktiven Lithiums verloren. Wenn nach der Formierung bei 100 % SOC alles verbleibende aktive Lithium in der Anode steckt und der stöchiometrische Faktor 1,1 beträgt: Bestimme y.", "answer": "y ≈ 0,77", "ex": "Verbleibendes aktives Li = 0,85; y = 0,85/1,1 ≈ 0,77."}, {"id": 190, "e": "K16-LI", "t": "open", "src": "F16 1.5b", "q": "Welches Wertepaar (x,y) ergibt sich bei 60 % SOC nach der Formierung?", "answer": "x = 0,34; y ≈ 0,46", "ex": "40 % des verbleibenden Li in der Kathode: x=0,4·0,85=0,34; 60 % in der Anode: y=0,6·0,85/1,1≈0,46."}, {"id": 191, "e": "K16-LI", "t": "open", "src": "F16 1.5c", "q": "Wie verändern sich x und y bei zusätzlichem Verlust von aktivem Lithium, wenn der SOC weiterhin auf die aktuelle Kapazität bezogen wird?", "answer": "Beide Werte werden kleiner.", "ex": "Die Menge zyklierbaren Lithiums sinkt; bei gleichem relativen SOC sind die absoluten stöchiometrischen Anteile kleiner."}, {"id": 192, "e": "K16-PB", "t": "open", "src": "F16 2.1a", "q": "Gib die Elektrodenreaktionen der Blei-Säure-Batterie bei Entladung an.", "answer": "Negativ: Pb + SO₄²⁻ → PbSO₄ + 2e⁻. Positiv: PbO₂ + SO₄²⁻ + 4H⁺ + 2e⁻ → PbSO₄ + 2H₂O.", "ex": "Zusammen: Pb + PbO₂ + 2H₂SO₄ → 2PbSO₄ + 2H₂O."}, {"id": 193, "e": "K16-PB", "t": "multi", "src": "F16 2.1b", "q": "Warum ist die volumetrische Energiedichte von Blei-Säure-Zellen geringer als die von Li-Ionen-Zellen?", "opts": ["Der Elektrolyt nimmt an der Hauptreaktion teil und benötigt entsprechend Volumen/Masse.", "Die Zellspannung/Potentialdifferenz ist geringer.", "Blei ist besonders leicht.", "Der Elektrolyt ist masselos."], "correct": [0, 1], "ex": "Gefordert waren zwei Gründe."}, {"id": 194, "e": "K16-PB", "t": "open", "src": "F16 2.1c1", "q": "Unter welchen Bedingungen kann bei Blei-Säure-Batterien Thermal Runaway auftreten?", "answer": "Insbesondere bei Konstantspannungs-/Erhaltungsladung und Überladung, wenn Erwärmung den Lade-/Gasungsstrom erhöht und dadurch weitere Wärme entsteht.", "ex": "Positive Rückkopplung zwischen Temperatur, Strom/Gasung und Wärme."}, {"id": 195, "e": "K16-PB", "t": "multi", "src": "F16 2.1c2", "q": "Warum sind VRLA-Batterien besonders anfällig für Thermal Runaway?", "opts": ["Geringere Elektrolytmenge → kleinere thermische Masse", "Exotherme Sauerstoffrekombination erzeugt zusätzliche Wärme", "VRLA besitzt immer perfekte Kühlung", "Die Rekombination ist stark endotherm"], "correct": [0, 1], "ex": "Beide Punkte stehen in der Musterlösung."}, {"id": 196, "e": "K16-PB", "t": "open", "src": "F16 2.1d1", "q": "Wie sieht qualitativ die I10 Lade-/Entladekurve einer 100-Ah-Blei-Batterie aus?", "answer": "Beim Entladen liegt die Klemmspannung unter der Gleichgewichtsspannung und fällt bis zum Entladeende stark ab; beim Laden liegt sie darüber und steigt zum Lade-/Gasungsende an. Ohmsche Sprünge treten bei Stromänderungen auf.", "ex": "Die Klausur verlangt die Bereiche Entladung, Ladung, Reaktanden aufgebraucht und Ende der Entladung."}, {"id": 197, "e": "K16-PB", "t": "open", "src": "F16 2.1d2", "q": "Wie verändert Alterung auf 80 % Restkapazität plus erhöhter Innenwiderstand die Lade-/Entladekurve?", "answer": "Die nutzbare Zeit/Kapazität wird kürzer und der ohmsche Spannungsabfall bzw. Spannungssprung wird größer.", "ex": "Musterlösung: verkürzte Kurven + erhöhter ohmscher Spannungsabfall."}, {"id": 198, "e": "K16-PB", "t": "open", "src": "F16 2.2a", "q": "Nenne zwei Elektroden-Gitterdesigns für Blei-Säure-Batterien.", "answer": "Zum Beispiel Gitterplatte, Panzerplatte oder rohrförmiges Gitter.", "ex": "Zwei Nennungen genügen."}, {"id": 199, "e": "K16-PB", "t": "open", "src": "F16 2.2b", "q": "Benenne zentrale Elemente des schematischen Blei-Säure-Zellaufbaus.", "answer": "Hartbleigitter/Stromableiter, poröse PbO₂-Aktivmasse der positiven Elektrode, poröser Separator, poröser Bleischwamm der negativen Elektrode und Elektrolyt.", "ex": "Diese Bezeichnungen entsprechen der Musterlösung der Schemazeichnung."}, {"id": 200, "e": "K16-PB", "t": "open", "src": "F16 2.3a1", "q": "Bei Tmin = −20 °C: Welche H₂SO₄-Konzentration muss laut Klausurdiagramm mindestens vorliegen, damit der Elektrolyt nicht gefriert?", "answer": "ca. 2,8 mol/l", "ex": "Dieser Punkt wird als minimaler SOC definiert."}, {"id": 201, "e": "K16-PB", "t": "open", "src": "F16 2.3a2", "q": "Eine vollgeladene Batterie enthält 5 mol/l H₂SO₄. Wie viel Konzentrationsdifferenz kann bis 2,8 mol/l genutzt werden?", "answer": "2,2 mol/l", "ex": "5,0−2,8=2,2 mol/l."}, {"id": 202, "e": "K16-PB", "t": "open", "src": "F16 2.3b", "q": "Wie viel Elektrolytvolumen ergibt die Musterrechnung für eine Entladung der 55-Ah-Batterie von 100 % auf 20 % SOC?", "answer": "ca. 0,746 l", "ex": "Entnommene Ladung = 44 Ah; über Faraday und den Verbrauch von 2 H₂SO₄ pro Reaktionsumsatz ergibt sich die benötigte Stoffmenge und daraus V≈0,746 l."}, {"id": 203, "e": "K16-PB", "t": "open", "src": "F16 2.4a1", "q": "Bestimme die molare Masse von Wasser aus MH=1,007 g/mol und MO=16 g/mol.", "answer": "ca. 18,0 g/mol", "ex": "M(H₂O)=2·1,007+16≈18,014 g/mol."}, {"id": 204, "e": "K16-PB", "t": "open", "src": "F16 2.4a2", "q": "Eine geschlossene Blei-Batterie gast täglich 4 h mit 1 A, sonst 0 A. Wie viel Wasser geht in 365 Tagen idealisiert verloren? Nutze z=2 und F=96485 C/mol.", "answer": "ca. 0,49 kg Wasser pro Jahr", "ex": "Q=1 A·4 h·365=1460 Ah=5,256 MC; n(H₂O)=Q/(2F)≈27,24 mol; m≈0,491 kg."}, {"id": 205, "e": "K16-PB", "t": "open", "src": "F16 2.5a", "q": "Nenne je mindestens einen beschleunigenden Faktor für Korrosion, Aktivmasseverlust, Selbstentladung und Sulfatierung.", "answer": "Korrosion: z.B. hohe Spannung/Temperatur/Zyklisierung/niedriger SOC. Aktivmasseverlust: mechanischer Stress, Korrosion, Gasung, hoher DOD/Spannung. Selbstentladung: Mikrokurzschlüsse, hohe Temperatur, Antimonvergiftung. Sulfatierung: hoher DOD, Säureschichtung, seltene Volladung, niedriger SOC.", "ex": "Je Prozess war mindestens ein Faktor gefordert."}, {"id": 206, "e": "K16-PB", "t": "open", "src": "F16 2.5b1", "q": "Bei Säureschichtung: Wo ist die Säuredichte höher bzw. niedriger?", "answer": "Oben niedriger, unten höher.", "ex": "Die dichtere Säure sammelt sich im unteren Zellbereich."}, {"id": 207, "e": "K16-PB", "t": "open", "src": "F16 2.5b2", "q": "Warum ist Sulfatierung bei Säureschichtung unten typischerweise stärker als oben?", "answer": "Oben ist bei geringerer Säurekonzentration die Löslichkeit von PbSO₄ höher und Rückladung leichter. Unten führen hohe Säurekonzentration und unzureichende Ladung zu stärkerer Sulfatierung und Kristallwachstum.", "ex": "Die Musterlösung fordert mindestens zwei Argumente."}, {"id": 208, "e": "K16-PB", "t": "open", "src": "F16 2.5c", "q": "Wie kann Säureschichtung in einem elektrischen Ersatzschaltbild modelliert werden?", "answer": "Durch mehrere gekoppelte Teilmodelle/Zellschichten mit jeweils eigener OCV bzw. eigenem elektrochemischem Teilmodell und Austauschpfaden zwischen den Schichten.", "ex": "Die Klausur verlangt ein benanntes Ersatzschaltbild; entscheidend ist die räumliche Aufteilung der Zelle in Bereiche unterschiedlicher Säurekonzentration."}, {"id": 209, "e": "K16-DSK", "t": "open", "src": "F16 3.1a", "q": "Welche Materialien werden typischerweise für positiven/negativen DSK-Elektroden, Elektrolyt und Stromsammler verwendet?", "answer": "Beide Elektroden: Kohlenstoff/Graphit/Ruß; Elektrolyt: organisches Lösungsmittel mit Leitsalz; Stromsammler: Aluminium.", "ex": "So ist es in der Musterlösung angegeben."}, {"id": 210, "e": "K16-DSK", "t": "open", "src": "F16 3.1b", "q": "Ordne Li-Ionen-Batterie, Blei-Säure-Batterie, DSK und supraleitende Spule nach Speicherprinzip.", "answer": "Elektrochemisch: Li-Ionen und Blei-Säure. Elektrisch: Doppelschichtkondensator und supraleitende Spule.", "ex": "Die Klausur unterscheidet elektrochemische und elektrische Speicherung."}, {"id": 211, "e": "K16-DSK", "t": "mc", "src": "F16 3.1c1", "q": "Wie ist die spezifische Leistung eines DSK im Vergleich zu einer Blei-Säure-Batterie?", "opts": ["Im Allgemeinen größer", "Im Allgemeinen kleiner", "Immer exakt gleich", "Nicht vergleichbar"], "correct": 0, "ex": "DSK zeichnen sich durch sehr hohe spezifische Leistung aus."}, {"id": 212, "e": "K16-DSK", "t": "mc", "src": "F16 3.1c2", "q": "Wie ist die spezifische Energie eines DSK im Vergleich zu einer Li-Ionen-Batterie?", "opts": ["Im Allgemeinen kleiner", "Im Allgemeinen größer", "Immer exakt gleich", "Unendlich groß"], "correct": 0, "ex": "DSK haben hohe Leistung, aber geringe spezifische Energie."}, {"id": 213, "e": "K16-DSK", "t": "open", "src": "F16 3.2a", "q": "Welche Verluste repräsentiert R1 im vereinfachten DSK-Ersatzschaltbild und wodurch entstehen sie?", "answer": "Den internen ohmschen Widerstand, insbesondere Verluste in Polen, Stromsammlern und metallischen Leitern.", "ex": "Nur 'Serienwiderstand' war laut Musterlösung als Erklärung nicht ausreichend."}, {"id": 214, "e": "K16-DSK", "t": "open", "src": "F16 3.2b", "q": "Welche zwei Merkmale führen zur sehr hohen Doppelschichtkapazität C0?", "answer": "Sehr große wirksame Elektrodenoberfläche und sehr kleiner Ladungstrennungsabstand.", "ex": "C steigt mit Fläche und sinkendem Abstand."}, {"id": 215, "e": "K16-DSK", "t": "open", "src": "F16 3.2c1", "q": "Welche Verluste bildet ein Parallelwiderstand R2 im einfachen DSK-Modell ab?", "answer": "Selbstentladungsverluste.", "ex": "R2 stellt einen Leck-/Selbstentladungspfad dar."}, {"id": 216, "e": "K16-DSK", "t": "open", "src": "F16 3.2c2", "q": "Warum reicht ein einzelner Parallelwiderstand nicht aus, um den typischen Spannungsabfall nach dem Laden eines DSK zu beschreiben?", "answer": "Weil ein großer Teil des Nachlaufs durch zeitabhängige Umverteilung von Ladungsträgern in unterschiedlich zugänglichen Poren entsteht und nicht nur durch Selbstentladung.", "ex": "Dafür werden mehrere RC-Zweige bzw. verteilte Zeitkonstanten benötigt."}, {"id": 217, "e": "K16-DSK", "t": "open", "src": "F16 3.2c3", "q": "Welche Ersatzschaltbild-Topologie beschreibt die Ladungsumverteilung in DSK-Poren besser?", "answer": "Ein Netzwerk aus mehreren RC-Teilzweigen mit unterschiedlichen Zeitkonstanten/Porengrößen plus Selbstentladungswiderständen.", "ex": "Die Musterlösung zeigt eine hierarchische Macro-/Meso-/Micro-RC-Struktur."}, {"id": 218, "e": "K16-DSK", "t": "open", "src": "F16 3.2d", "q": "Wie verändert sich die Leerlauf-Spannungsrelaxation, wenn derselbe DSK statt 1 h einen ganzen Tag bei gleicher Spannung geladen wurde?", "answer": "Die Spannung fällt nach Abschalten zunächst langsamer bzw. bleibt höher, weil tiefere/ langsamere Porenbereiche stärker aufgeladen sind.", "ex": "Die 1-Tages-Kurve liegt in der Musterlösung oberhalb der 1-Stunden-Kurve."}, {"id": 219, "e": "K16-DSK", "t": "open", "src": "F16 3.3a", "q": "Fünf identische DSK mit C=800 F, Umax=2,8 V, Ri=0,5 mΩ werden in Serie geschaltet. Bestimme Cm, U0,m und Rm.", "answer": "Cm=160 F; U0,m=14 V; Rm=2,5 mΩ", "ex": "Serie: C/N, Spannungen addieren, Widerstände addieren."}, {"id": 220, "e": "K16-DSK", "t": "open", "src": "F16 3.3b", "q": "Wie viel Energie ist zu Beginn im vollgeladenen 5er-DSK-Modul gespeichert?", "answer": "15 680 J (Ws)", "ex": "E=½·Cm·U²=0,5·160·14²=15 680 J."}, {"id": 221, "e": "K16-DSK", "t": "open", "src": "F16 3.3c1", "q": "Das Startprofil fordert 9,6 kW von t=0,2 s bis 0,7 s. Wie viel Nutzenergie benötigt der Startvorgang?", "answer": "4 800 J", "ex": "9,6 kW·0,5 s=4,8 kJ."}, {"id": 222, "e": "K16-DSK", "t": "open", "src": "F16 3.3c2", "q": "Die gespeicherte Modulenergie sinkt beim Start um 6 000 J, obwohl der Starter 4 800 J erhält. Warum?", "answer": "Die Differenz von 1 200 J sind Verluste, vor allem ohmsche I²R-Verluste im Innenwiderstand.", "ex": "Die Musterlösung nennt die Verlustenergie als Ursache."}, {"id": 223, "e": "K16-DSK", "t": "open", "src": "F16 3.3d", "q": "Welche Ströme ergeben sich in der Musterlösung für die 9,6-kW-Konstantleistungsentladung bei t=0,2 s und t=0,7 s?", "answer": "ca. 800 A bei 0,2 s und ca. 1200 A bei 0,7 s", "ex": "Mit sinkender Spannung muss bei konstanter Leistung der Strom steigen."}, {"id": 224, "e": "K16-DSK", "t": "open", "src": "F16 3.3e", "q": "Welche Klemmspannungen ergeben sich mit Rm=2,5 mΩ für 800 A bei U0=14 V und 1200 A bei U0=11 V?", "answer": "12 V bei 0,2 s und 8 V bei 0,7 s", "ex": "Uterm=U0−I·R; 14−800·0,0025=12 V; 11−1200·0,0025=8 V."}, {"id": 225, "e": "K16-DSK", "t": "open", "src": "F16 3.3f", "q": "Beim Laden wird die Lichtmaschine idealisiert sofort auf 14 V gesetzt, während das Modul 11 V OCV besitzt. Welcher theoretische Strom ergäbe sich nur aus Rm=2,5 mΩ?", "answer": "1200 A", "ex": "I=(14−11)/0,0025=1200 A; real begrenzt die Lichtmaschine auf 200 A."}, {"id": 226, "e": "K16-DSK", "t": "open", "src": "F16 3.3g", "q": "Beschreibe den Ladeverlauf bei Lichtmaschine 14 V / 200 A für das DSK-Modul. Welche charakteristischen Werte nennt die Musterlösung?", "answer": "Zunächst 200-A-Konstantstrom. Der ohmsche Spannungsabfall beträgt 0,5 V, die Konstantstromphase dauert ca. 2 s. Danach folgt bei 14 V eine exponentiell abklingende Stromphase mit τ=Rm·Cm=0,4 s.", "ex": "Die Klemmspannung steigt beim Zuschalten zunächst von 11 auf 11,5 V und während CC bis 14 V."}, {"id": 227, "e": "K16-BMS", "t": "open", "src": "F16 4.1a1", "q": "Sortiere die Packtopologien A, B, C aus der Klausur absteigend nach der minimal nötigen Anzahl von Spannungssensoren.", "answer": "C > B ≥ A oder C > A ≥ B", "ex": "Die Musterlösung akzeptiert wegen der dargestellten Topologievarianten beide Gleichstandsordnungen."}, {"id": 228, "e": "K16-BMS", "t": "open", "src": "F16 4.1a2", "q": "Sortiere die Packtopologien A, B, C absteigend nach der minimal nötigen Anzahl von Stromsensoren, wenn der Strom jeder Zelle bekannt sein soll.", "answer": "B > C > A", "ex": "Musterlösung."}, {"id": 229, "e": "K16-BMS", "t": "open", "src": "F16 4.1a3", "q": "Sortiere die Packtopologien A, B, C absteigend nach verlorener Kapazität bei einer offenen Verbindung in einer Zelle.", "answer": "A > B ≥ C oder A > C ≥ B", "ex": "Musterlösung."}, {"id": 230, "e": "K16-BMS", "t": "open", "src": "F16 4.1b", "q": "Benenne die drei gezeigten Ladeprofile i), ii), iii) der Klausur.", "answer": "i) CC-CV; ii) CC-CV-CV; iii) CC-CV-CC", "ex": "Die Bezeichnungen folgen der Musterlösung."}, {"id": 231, "e": "K16-BMS", "t": "open", "src": "F16 4.1c", "q": "Wie verlaufen Strom und Spannung bei einer CC-CP-Ladung qualitativ?", "answer": "Zunächst konstanter Strom: Spannung steigt. In der Konstantleistungsphase gilt P=U·I: Während U weiter steigt, muss I entsprechend sinken.", "ex": "Bei CP sinkt I ungefähr invers mit steigender U."}, {"id": 232, "e": "K16-BMS", "t": "open", "src": "F16 4.1d", "q": "Sortiere Kühlsysteme nach Investitionskosten: Kühlflüssigkeit (CF), Wasser (W), Zwangsbelüftung (FA), natürliche Lüftung (NA).", "answer": "CF > W > FA > NA", "ex": "Musterlösung."}, {"id": 233, "e": "K16-BMS", "t": "open", "src": "F16 4.1e", "q": "Welche Komponenten muss das in der Klausur geforderte Hochvolt-Pack-Blockdiagramm enthalten?", "answer": "Zellstapel, Hauptschütz an Plus und Minus, Sicherung, Laststecker sowie Vorladewiderstand und Vorladerelais parallel zu einem Hauptschütz.", "ex": "Der Vorladekreis lädt die Eingangskapazität der Last strombegrenzt vor."}, {"id": 234, "e": "K16-BMS", "t": "open", "src": "F16 4.1f1", "q": "Welche Größen zeigen die oberen beiden Kurven der Vorladesequenz in Aufgabe 4.1f?", "answer": "Spannung und Strom.", "ex": "Musterlösung: Voltage, Current."}, {"id": 235, "e": "K16-BMS", "t": "open", "src": "F16 4.1f2", "q": "Welche Schaltreihenfolge gilt für die Relais/Schütze K1, K2, K3 in der gezeigten Vorladesequenz?", "answer": "K3, dann K1, dann K2", "ex": "Zuerst Vorladerelais, dann das überbrückte Hauptschütz, anschließend der übrige Hauptpfad entsprechend der dargestellten Sequenz."}, {"id": 236, "e": "K16-BMS", "t": "open", "src": "F16 4.2a", "q": "Zellmodell: UOCV(Q)=−8·10⁻⁵ Q²−8·10⁻³ Q+4,2 V, Ri=1 mΩ, Entladung mit 100 A. Bestimme Ubat bei Q=0 Ah und 100 Ah.", "answer": "Ubat(0)=4,1 V; Ubat(100)=2,5 V", "ex": "Bei Entladung: Ubat=UOCV−I·Ri. UOCV(0)=4,2 V, UOCV(100)=2,6 V."}, {"id": 237, "e": "K16-BMS", "t": "open", "src": "F16 4.2b", "q": "Wie liegt die Klemmspannungs-Entladekurve bei konstant 100 A relativ zur OCV-Kurve?", "answer": "Parallel unterhalb der OCV-Kurve, hier um I·Ri = 0,1 V verschoben.", "ex": "Bei konstantem I und konstantem Ri ist der ohmsche Spannungsabfall konstant."}, {"id": 238, "e": "K16-BMS", "t": "open", "src": "F16 4.2c", "q": "Bei welcher entnommenen Ladung wird Ubat=2,6 V erreicht, wenn mit 100 A und Ri=1 mΩ entladen wird?", "answer": "Qreal,dch ≈ 95,77 Ah", "ex": "Abbruchbedingung: UOCV=2,7 V. Einsetzen in die quadratische OCV-Gleichung ergibt die physikalische Lösung 95,77 Ah."}, {"id": 239, "e": "K16-BMS", "t": "open", "src": "F16 4.2d", "q": "Wie viel elektrische Energie kann bis Q=95,77 Ah bei 100-A-Konstantstromentladung aus der Zelle entnommen werden?", "answer": "ca. 332,6 Wh", "ex": "Integration der Klemmspannung Ubat(Q)=UOCV(Q)−0,1 V von 0 bis 95,77 Ah. Bei angenommener 95-A-Grenze wären es ca. 330,5 Wh."}, {"id": 240, "e": "K16-BMS", "t": "open", "src": "F16 4.2e", "q": "Die vollgeladene Zelle wird mit konstanter Leistung 100 W bis Ubat=2,6 V entladen. Welche OCV liegt am Abbruchpunkt an, wenn nur Ri=1 mΩ berücksichtigt wird?", "answer": "ca. 2,638 V", "ex": "I=P/Ubat=100/2,6≈38,46 A; ohmscher Abfall≈0,0385 V; UOCV≈2,6385 V."}, {"id": 241, "e": "K16-BMS", "t": "open", "src": "F16 4.2f", "q": "Nun enthält das Modell zusätzlich Rp=1 mΩ parallel zu C=20 mF; τ ist viel kleiner als die Entladezeit. Bei konstant 100 A wird bei Ubat=2,6 V abgebrochen. Welche OCV liegt näherungsweise vor?", "answer": "ca. 2,8 V", "ex": "Für t≫τ wirkt der Polarisationszweig stationär mit zusätzlichem Spannungsabfall I·Rp. Gesamtabfall ≈100 A·(1+1)mΩ=0,2 V; UOCV≈2,8 V."}, {"id": 242, "e": "F14-A1", "t": "open", "src": "F14 1.1", "q": "Skizziere den detaillierten Querschnitt eines Doppelschichtkondensators, benenne Komponenten, Elektrodenmaterial und Besonderheit.", "answer": "Elektroden: Kohlenstoff/Graphit/Aktivkohle mit sehr großer innerer poröser Oberfläche; Elektrolyt, Separator, Stromsammler und elektrische Doppelschichten."}, {"id": 243, "e": "F14-A1", "t": "open", "src": "F14 1.2", "q": "Zeichne/beschreibe das einfache Ersatzschaltbild eines DSK.", "answer": "Rs/ESR in Serie, L (meist vernachlässigbar), C und Rp/EPR parallel zur Kapazität."}, {"id": 244, "e": "F14-A1", "t": "open", "src": "F14 1.3", "q": "Was zeigt die Abbildung mit Re(Z) und Im(Z)? Beschrifte Achsen sowie Richtungen von Frequenz und Temperatur.", "answer": "Impedanzspektroskopie/Nyquist-Plot eines Supercaps. Achsen Re(Z), Im(Z); Frequenz und Temperatur gemäß Kurvenschar/Pfeilen der Musterlösung."}, {"id": 245, "e": "F14-A1", "t": "open", "src": "F14 1.4a", "q": "Welche Aufgaben hat das DSK-Managementsystem und warum wird es benötigt?", "answer": "Überwachung jeder Zellspannung und Balancing; Unterschiede in Selbstentladung und Kapazität führen zu Spannungsdrift, Überladung muss verhindert werden."}, {"id": 246, "e": "F14-A1", "t": "open", "src": "F14 1.4b", "q": "Beschreibe ein einfaches passiv gesteuertes Balancing.", "answer": "Bei Überschreiten einer Schwellspannung wird ein Parallelwiderstand zugeschaltet und die Zelle entladen."}, {"id": 247, "e": "F14-A1", "t": "open", "src": "F14 1.4c", "q": "Vergleiche passive und aktive Balancingmöglichkeiten.", "answer": "Passiv: Energie wird verheizt; billig/einfach, aber langsam und verlustreich. Aktiv: Energie wird zwischen Zellen übertragen; effizienter, aber komplexer/teurer."}, {"id": 248, "e": "F14-A1", "t": "open", "src": "F14 1.5a", "q": "1500-kg-Fahrzeug von 0 auf 50 km/h; ηDCDC=90 %, ηAntrieb=70 %. Wie bestimmst du die vom DSK-Modul bereitzustellende Energie?", "answer": "Ekin=½mv²; elektrische Modulenergie = Ekin/(ηDCDC·ηAntrieb)."}, {"id": 249, "e": "F14-A1", "t": "open", "src": "F14 1.5b", "q": "Umax=2,5 V, C=600 F, DC/DC max. 300 V: maximale Anzahl DSK in Serie und maximal gespeicherte Energie?", "answer": "nmax=300/2,5=120. Modulenergie über E=½·(C/n)·(nU)² = n·½CU²."}, {"id": 250, "e": "F14-A1", "t": "open", "src": "F14 1.5c", "q": "Bei zwei parallelen Strängen: Wie viele DSK je Strang sind mindestens nötig, um die geforderte Energie bereitzustellen?", "answer": "Musterlösung: 98 DSK je Strang."}, {"id": 251, "e": "F14-A1", "t": "open", "src": "F14 1.5d", "q": "55°C für 1 h/Tag, sonst 25°C; +7,5 K halbiert Lebensdauer. Wie wird die resultierende Lebensdauer bestimmt?", "answer": "Zeitgewichtete Alterungsrate: Alterungsbeschleunigung der heißen Stunde und 23 h bei Referenztemperatur mitteln und auf 10 Jahre Referenzlebensdauer anwenden."}, {"id": 252, "e": "F14-A2", "t": "open", "src": "F14 2.1", "q": "Skizziere Aufbau/Funktion einer Blei-Säure-Zelle und gib die Hauptreaktion an.", "answer": "Pb/PbO₂ Aktivmassen, Bleigitter als Stromsammler, Separator, H₂SO₄ als Reaktand/Ionenleiter. Pb + PbO₂ + 2H₂SO₄ ⇌ 2PbSO₄ + 2H₂O."}, {"id": 253, "e": "F14-A2", "t": "open", "src": "F14 2.2a", "q": "Skizziere I20-Entladespannung und markiere Ruhespannung, ohmschen Abfall, Spannungssack, Reaktandenverarmung, Entladeschluss.", "answer": "Stromsprung → ohmscher Abfall; dynamische Polarisation/Spannungssack; Plateau; am Ende starker Abfall durch Reaktandenverarmung bis Entladeschluss."}, {"id": 254, "e": "F14-A2", "t": "open", "src": "F14 2.2b", "q": "Kann bei I1 dieselbe Kapazität wie bei I20 entnommen werden?", "answer": "Nein. Höhere Entladerate reduziert die verfügbare Kapazität."}, {"id": 255, "e": "F14-A2", "t": "open", "src": "F14 2.3", "q": "Skizziere CC-CV und CC-CV-CC für Blei und erkläre die Funktion.", "answer": "CC-CV Standardladung; CC-CV-CC Refresh-/Ausgleichsladung zur teilweisen Rückgewinnung reversibel verlorener Kapazität."}, {"id": 256, "e": "F14-A2", "t": "open", "src": "F14 2.4", "q": "Nenne die zwei ständigen Nebenreaktionen und den Wasserverlust bei 30 mA Erhaltungsladestrom über ein Jahr.", "answer": "Korrosion und Elektrolyse/Gasung; Musterlösung: 88,235 g Wasser."}, {"id": 257, "e": "F14-A2", "t": "open", "src": "F14 2.5", "q": "Erkläre Säureschichtung, Ursachen, Gegenkräfte und Alterungscharakter.", "answer": "Gradient durch Hauptreaktion und Gravitation; Diffusion und Gasung wirken entgegen. Kein Hauptalterungseffekt, beschleunigt aber andere Alterung."}, {"id": 258, "e": "F14-A2", "t": "open", "src": "F14 2.6", "q": "Vier wichtigste Alterungseffekte und reversibel/irreversibel?", "answer": "Wasserverlust, Korrosion, Sulfatierung, Erosion/Aktivmasseverlust. Sulfatierung teilweise reversibel; Korrosion/Erosion irreversibel."}, {"id": 259, "e": "F14-A2", "t": "open", "src": "F14 2.7", "q": "Wie berechnet man Gibbs-Energie und Gleichgewichtsspannung der positiven Elektrode?", "answer": "ΔG=ΣGProdukte−ΣGEdukte; E=−ΔG/(zF), mit den in der Aufgabe gegebenen Stoffdaten."}, {"id": 260, "e": "F14-A3", "t": "open", "src": "F14 3.1a", "q": "Größter Sicherheitsvorteil Li-Ion gegenüber Lithium-Metall?", "answer": "Kein metallisches Lithium nimmt an der Hauptreaktion teil → geringeres Dendriten-/Kurzschlussrisiko."}, {"id": 261, "e": "F14-A3", "t": "open", "src": "F14 3.1b", "q": "Funktion des Elektrolyten in Li-Ion; nimmt er an der Hauptreaktion teil?", "answer": "Transportmedium für Li-Ionen; idealisiert nicht an der Hauptreaktion beteiligt."}, {"id": 262, "e": "F14-A3", "t": "open", "src": "F14 3.1c", "q": "Warum kein Wasser-Elektrolyt; Nachteil organischer/aprotischer Elektrolyte; Kompensation?", "answer": "Hohe Zellspannung zersetzt Wasser. Organische Elektrolyte leiten schlechter; kurze Transportwege/größere Oberfläche kompensieren."}, {"id": 263, "e": "F14-A3", "t": "open", "src": "F14 3.1d", "q": "Wie groß ist der Strom am Ende einer normalen CC-CV-Ladung?", "answer": "Nähert sich 0 A."}, {"id": 264, "e": "F14-A3", "t": "open", "src": "F14 3.2a", "q": "Warum ist Lithium-Plating Sicherheits-/Lebensdauerrisiko und wann tritt es auf?", "answer": "Metallisches Li kann Dendriten/Kurzschlüsse und Lithiumverlust verursachen; vor allem beim Laden bei niedriger Temperatur und hohen Strömen."}, {"id": 265, "e": "F14-A3", "t": "open", "src": "F14 3.2b", "q": "Skizziere Li-Ionen-Zelle, Li-Fluss beim Entladen und SEI-Position.", "answer": "Li-Ionen wandern beim Entladen von Graphit zur positiven Elektrode; SEI liegt an der Graphit/Elektrolyt-Grenze."}, {"id": 266, "e": "F14-A3", "t": "open", "src": "F14 3.2c", "q": "Wann entsteht die SEI erstmals?", "answer": "Bei der ersten Ladung/Formierung."}, {"id": 267, "e": "F14-A3", "t": "open", "src": "F14 3.3a", "q": "SOC-Gleichung über Ah-Bilanz inklusive Verluste?", "answer": "SOC(t)=SOC0+(1/C)∫η·I(t)dt bei passender Vorzeichenkonvention."}, {"id": 268, "e": "F14-A3", "t": "open", "src": "F14 3.3b", "q": "5-Ah-Zelle, anfangs voll; SOC nach dem vorgegebenen Lastprofil?", "answer": "Musterlösung: ca. 33 %."}, {"id": 269, "e": "F14-A3", "t": "open", "src": "F14 3.3c", "q": "Zusammenhang DOD und SOC?", "answer": "DOD=100 %−SOC; z.B. 66,7 % bei SOC=33,3 %."}, {"id": 270, "e": "F14-A3", "t": "open", "src": "F14 3.3d", "q": "Wie ändert sich SOC bei gealterter Restkapazität 4,167 Ah unter gleichem Profil?", "answer": "Gleiche entnommene Ah geteilt durch kleinere aktuelle Kapazität → stärkerer relativer SOC-Abfall."}, {"id": 271, "e": "F14-A3", "t": "open", "src": "F14 3.4a", "q": "Theoretische gravimetrische Energiedichte LFP/Graphit bei 3,2 V?", "answer": "Ca. 373,4 Wh/kg."}, {"id": 272, "e": "F14-A3", "t": "open", "src": "F14 3.4b", "q": "Warum ist Li-Luft theoretisch gravimetrisch deutlich energiereicher?", "answer": "Sauerstoff wird aus der Umgebung aufgenommen und muss nicht vollständig als Zellmasse mitgeführt werden."}, {"id": 273, "e": "F14-A4", "t": "multi", "src": "F14 4.1", "q": "Welche Technologien sind sekundäre Batterien?" opts": ["Netzfern", "USV", "Netzspeicher", "Hybrid/PHEV/EV"], "correct": [0, 1, 2, 3]}, {"id": 282, "e": "F14-A4", "t": "multi", "src": "F14 4.10", "q": "Welche Parameter müssen für Speicherkosten berücksichtigt werden?", "opts": ["Energiebedarf", "Lebensdauer", "Entladetiefe", "Leistungsbedarf"], "correct": [0, 1, 2, 3]}, {"id": 283, "e": "F14-A4", "t": "multi", "src": "F14 4.11", "q": "Welche Aussagen zu Hochenergie-/Hochleistungszellen sind richtig?", "opts": ["HE hat bei gleicher Größe mehr aktive Masse", "HP hat mehr aktive Masse", "HP hat durch dünnere Aktivschichten kleineren Innenwiderstand", "HP hat bei typischem Betrieb oft geringere Effizienz wegen hoher spezifischer Ströme"], "correct": [0, 2, 3]}, {"id": 284, "e": "F14-A4", "t": "multi", "src": "F14 4.12", "q": "Faktoren für Kühlsystemauslegung?", "opts": ["Platzbedarf/Auslegung", "elektrische Isolation und thermische Leitfähigkeit Interface", "Wärmeabtransport/Kühlmittel", "mechanische Stabilisierung/Kontaktierung"], "correct": [0, 1, 2, 3]}, {"id": 285, "e": "F14-A4", "t": "multi", "src": "F14 4.13", "q": "Warum ist eine Schützbox wichtig?", "opts": ["Sicherung gegen Überstrom", "Batteriezellen haben keine abschaltbaren Elemente", "Vorladeresistor begrenzt Einschaltstrom", "Vorladesystem lädt Umrichterkondensator vor"], "correct": [0, 1, 2, 3]}, {"id": 286, "e": "F14-A4", "t": "mc", "src": "F14 4.14", "q": "Welche Kurve entspricht im gezeigten kalendarischen Test 80°C?", "opts": ["Kurve 1", "Kurve 2", "Kurve 3", "Kurve 4", "Kurve 5"], "correct": 4}, {"id": 287, "e": "F14-A4", "t": "multi", "src": "F14 4.15", "q": "Welche SEI-Aussagen sind korrekt?", "opts": ["SEI ist Produkt von Anodenmaterial/Elektrolytreaktion", "SEI-Wachstum reduziert Kapazität", "Li-Ionen können SEI passieren", "SEI passiviert Elektrode", "SEI-Wachstum senkt Innenwiderstand"], "correct": [0, 1, 2, 3]}, {"id": 288, "e": "F14-A4", "t": "mc", "src": "F14 4.16", "q": "Warum ist Li-Ion-Laden bei niedriger Temperatur kritisch?", "opts": lumen erfordert Raum/Abstand."}, {"id": 312, "e": "H14-A2", "t": "open", "src": "H14 2.6", "q": "Start-Stop-Profil: Wie viel Prozent SOC gehen verloren?", "answer": "Ah-Bilanz der 30 s·85 A plus 2 s·950 A relativ zu 70 Ah."}, {"id": 313, "e": "H14-A2", "t": "open", "src": "H14 2.7", "q": "Wie berechnest du die Ruhespannung bei t=32 s aus dem SOC?", "answer": "Zuerst SOC per Ah-Bilanz, dann in die in der Klausur gegebene lineare OCV-SOC-Gleichung einsetzen."}, {"id": 314, "e": "H14-A2", "t": "open", "src": "H14 2.8a", "q": "Minimale Klemmspannung während des Startvorgangs mit Ri=3mΩ und Tafel-Überspannung?", "answer": "OCV minus ohmscher Spannungsabfall minus Reaktionsüberspannung; Konzentrationsüberspannung vernachlässigt."}, {"id": 315, "e": "H14-A2", "t": "open", "src": "H14 2.8b", "q": "Minimaler Anfangs-SOC für Uterminal >9 V beim Start?", "answer": "Musterlösung: mindestens 19,72 % SOC."}, {"id": 316, "e": "H14-A2", "t": "open", "src": "H14 2.8c", "q": "Ist der Start Energie- oder Leistungs-begrenzt?", "answer": "Leistungsbegrenzt; für Energie reichen ca. 1,77 % SOC, für erforderliche Spannung/Leistung ca. 19,72 %."}, {"id": 317, "e": "H14-A2", "t": "open", "src": "H14 2.9a", "q": "Wie viele Starterbatterien für 10,5 kWh nutzbar bei max. 70 % DOD?", "answer": "Gesamt-Nennenergie = 10,5kWh/0,7; durch 12V·70Ah je Batterie teilen und aufrunden."}, {"id": 318, "e": "H14-A2", "t": "open", "src": "H14 2.9b", "q": "Wie bestimmst du gravimetrische und volumetrische Energiedichte des Packs bezogen auf nutzbare Energie?", "answer": "Nutzenergie durch Gesamtmasse bzw. Gesamtvolumen aller Batterien teilen."}, {"id": 319, "e": "H14-A3", "t": "open", "src": "H14 3.1", "q": "Nenne drei Li-Ionen-Zellbauformen mit je zwei Vor- und Nachteilen.", "answer": "Rundzelle, Pouch, prismatisch; Musterlösung nennt u.a. Robustheit/Sicherheitsmechanismen, Packdichte/Kühlbarkeit, Dichtigkeit/Steifigkeit/Innendruck als Trade-offs."}, {"id": 320, "e": "H14-A3", "t": "open", "src": "H14 3.2", ss nur an einer Stelle gemessen werden"], "correct": [0, 2, 3]}, {"id": 345, "e": "H14-A4", "t": "mc", "src": "H14 4.17", "q": "Eigenschaften für wirtschaftliches Recycling?", "opts": ["viele Metalle kleine Mengen", "wenige Metalle große Mengen", "viele organische Verbindungen", "Metalle geringe Dichte"], "correct": 1}, {"id": 346, "e": "H14-A4", "t": "multi", "src": "H14 4.18", "q": "Vorteile LFP vs LCO?", "opts": ["bessere SOC-Diagnostik", "höhere thermische Stabilität", "günstigere Rohstoffe", "100% Lithiumausnutzung"], "correct": [1, 2]}, {"id": 347, "e": "H14-A4", "t": "multi", "src": "H14 4.19", "q": "Coulomb-Wirkungsgrad <100% bei geschlossener Blei korrekt?", "opts": ["nur irreversibler Verlust", "Gasung/Wasserverlust", "Wasserrekombination kann Verlust vermeiden", "Mikrokurzschluss/Selbstentladung möglich"], "correct": [1, 2, 3]}, {"id": 348, "e": "H14-A4", "t": "multi", "src": "H14 4.20", "q": "Unterschiedliche Entladeschlussspannungen sinnvoll wenn?", "opts": ["hohe Überspannungen am Entladeende", "bei hohem Strom Grenze vor Verbrauch Restladung erreicht", "temperaturunabhängig", "tiefe Spannung darf Alterung nicht stark erhöhen"], "correct": [0, 1, 3]}, {"id": 349, "e": "H14-A4", "t": "multi", "src": "H14 4.21", "q": "AC/DC-Laden korrekt?", "opts": ["Onboard-Leistungselektronik bietet Flexibilität mit bestehender Infrastruktur", "Haushalte 3-9kW unabhängig vom Konzept", "bei AC sitzt Leistungselektronik außerhalb Fahrzeug", "externe DC-Schnelllader >100kW können Mittelspannungsanschluss erfordern"], "correct": [0, 3]}, {"id": 350, "e": "F15-A1", "t": "open", "src": "F15 1.1a-i", "q": "Material der DSK-Elektroden?", "answer": "Kohlenstoff/Aktivkohle/Graphit."}, {"id": 351, "e": "F15-A1", "t": "open", "src": "F15 1.1a-ii", "q": "Warum dieses Material?", "answer": "Sehr große innere poröse Oberfläche."}, {"id": 352, "e": "F15-A1", "t": "open", "src": "F15 1.1a-iii", "q": "Zwei weitere interne Komponenten?", "answer": "Elektrolyt, Separator, Aluminium-Stromk
