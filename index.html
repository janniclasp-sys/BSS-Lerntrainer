<script>
const Q=[{"id": 1, "e": 1, "t": "formula", "src": "Ü1 S.2", "q": "Gib die Definition der Nennspannung Uₙ als Formel an.", "answer": "U_N = (1/T) · ∫ U_Entladung(t) dt", "alts": ["1/t", "integral", "uentladung"], "ex": "Die Nennspannung ist der zeitliche Mittelwert der Spannung während einer Entladung unter nominalen Bedingungen."}, {"id": 2, "e": 1, "t": "formula", "src": "Ü1 S.2", "q": "Wie wird die entnehmbare Batteriekapazität C aus dem Entladestrom bestimmt?", "answer": "C = ∫ I_Entladung(t) dt", "alts": ["integral", "ientladung"], "ex": "Kapazität ist eine Ladungsmenge; deshalb wird der Strom über die Zeit integriert."}, {"id": 3, "e": 1, "t": "cloze", "src": "Ü1 S.3", "q": "Vervollständige den Zusammenhang zwischen SOC und DOD.", "parts": ["DOD(t) = ", " % − ", "(t)"], "blanks": ["100", "SOC"], "ex": "DOD beschreibt den bereits entladenen Anteil, SOC den noch verfügbaren Anteil."}, {"id": 4, "e": 1, "t": "mc", "src": "Ü1 S.4–5", "q": "Welcher Teil einer Batteriezelle speichert im Allgemeinen die Energie?", "opts": ["Elektrolyt", "Separator", "Aktivmaterialien", "Stromsammler"], "correct": 2, "ex": "Die Energie steckt in den elektrochemisch aktiven Materialien."}, {"id": 5, "e": 1, "t": "mc", "src": "Ü1 S.5", "q": "Was ist im Allgemeinen die Aufgabe des Elektrolyten?", "opts": ["Elektrische Isolation der Elektroden", "Ionen leiten", "Elektronen leiten", "Energie speichern"], "correct": 1, "ex": "Der Elektrolyt ermöglicht den Ionentransport zwischen den Elektroden."}, {"id": 6, "e": 1, "t": "graphic", "src": "Ü1 S.6–10", "q": "Welche Verschaltung ist dargestellt und was passiert mit Spannung und Kapazität?", "graphic": "parallel", "opts": ["Reihenschaltung: U steigt, C bleibt gleich", "Parallelschaltung: U bleibt gleich, C steigt", "Parallelschaltung: U steigt, C bleibt gleich", "Reihenschaltung: U bleibt gleich, C steigt"], "correct": 1, "ex": "Bei Parallelschaltung bleibt die Zellspannung erhalten; die Kapazitäten addieren sich."}, {"id": 7, "e": 1, "t": "graphic", "src": "Ü1 S.9–10", "q": "Welche Verschaltung ist dargestellt und was passiert mit Spannung und Kapazität?", "graphic": "series", "opts": ["Reihenschaltung: U addiert sich, C bleibt gleich", "Parallelschaltung: U bleibt gleich, C addiert sich", "Reihenschaltung: U bleibt gleich, C addiert sich", "Parallelschaltung: U addiert sich, C bleibt gleich"], "correct": 0, "ex": "In Serie addieren sich die Zellspannungen; die Ah-Kapazität bleibt die einer Einzelzelle."}, {"id": 8, "e": 1, "t": "cloze", "src": "Ü1 S.13", "q": "Vervollständige die Aussage zum äquivalenten Vollzyklus.", "parts": ["Anzahl Zyklen × ", " = Anzahl ", " Vollzyklen"], "blanks": ["DOD", "äquivalenter"], "ex": "Beispiel: vier Zyklen mit je 25 % DOD entsprechen einem äquivalenten Vollzyklus."}, {"id": 9, "e": 1, "t": "open", "src": "Ü1 S.14", "q": "Ein Fahrzeug benötigt 15 kWh/100 km und fährt täglich 60 km. Wie viel Energie benötigt es pro Tag?", "answer": "9 kWh", "ex": "60 km × 15 kWh / 100 km = 9 kWh."}, {"id": 10, "e": 2, "t": "cloze", "src": "Ü2 S.3–4", "q": "Vervollständige die Wirkungsgrad-Beziehungen.", "parts": ["Coulombscher Wirkungsgrad ηAh = entladene ", " / geladene ", ". Energetischer Wirkungsgrad ηWh = entnommene ", " / eingeladene ", "."], "blanks": ["Ah", "Ah", "Wh", "Wh"], "ex": "Der Coulombsche Wirkungsgrad betrachtet Ladungsmenge, der energetische Wirkungsgrad Energie."}, {"id": 11, "e": 2, "t": "mc", "src": "Ü2 S.4", "q": "Welcher typische energetische Wirkungsgrad wird für Lithium-Ionen-Batterien angegeben?", "opts": ["65–75 %", "80–90 %", "90–95 %", "≈50 %"], "correct": 2, "ex": "In der Übung werden für Lithium-Ionen-Batterien etwa 90–95 % genannt; ηAh liegt ungefähr bei 100 %."}, {"id": 12, "e": 2, "t": "graphic", "src": "Ü2 S.5", "q": "Welche Kurve entspricht einer CC-CV-CC-Ladung?", "graphic": "cccvcc", "opts": ["A", "B", "C"], "correct": 1, "ex": "Bei CC-CV-CC folgt auf einen Konstantstromabschnitt ein Konstantspannungsabschnitt und danach wieder ein Konstantstromabschnitt."}, {"id": 13, "e": 2, "t": "formula", "src": "Ü2 S.6", "q": "Vervollständige die allgemeine Gleichung der Batterieklemmenspannung.", "answer": "U_Batterieklemme = U_Gleichgewicht + U_Widerstand + U_Reaktion + U_Diffusion", "alts": ["gleichgewicht", "widerstand", "reaktion", "diffusion"], "ex": "Die Klemmenspannung setzt sich aus Gleichgewichtsspannung und den drei Überspannungsanteilen zusammen."}, {"id": 14, "e": 2, "t": "mc", "src": "Ü2 S.10–13", "q": "Welche Zuordnung ist korrekt?", "opts": ["U_Gleichgewicht → Ohmsches Gesetz", "U_Widerstand → Butler-Volmer", "U_Reaktion → Butler-Volmer", "U_Diffusion → freie Gibbs-Energie"], "correct": 2, "ex": "U_Gleichgewicht: Thermodynamik/Gibbs bzw. Nernst; U_Widerstand: Ohm; U_Reaktion: Butler-Volmer; U_Diffusion: Fick."}, {"id": 15, "e": 2, "t": "mc", "src": "Ü2 S.12", "q": "Welche Widerstände tragen laut Übung zur ohmschen Überspannung U_Widerstand bei?", "opts": ["Stromsammler + Batteriepole + Elektrolyt", "Nur Ladungsdurchtrittswiderstand", "Nur Separator", "Nur Aktivmaterial"], "correct": 0, "ex": "Genannt werden Stromsammler, Batteriepole und Elektrolyt. Der Ladungsdurchtrittswiderstand gehört zur Reaktionskinetik."}, {"id": 16, "e": 2, "t": "open", "src": "Ü2 S.16", "q": "Eine C20-Batterie besitzt 100 Ah. Welche Stromstärke entspricht I20 und welche 4·I20?", "answer": "I20 = 5 A; 4·I20 = 20 A", "ex": "C20 bedeutet Entladung der Nennkapazität über 20 h: 100 Ah / 20 h = 5 A."}, {"id": 17, "e": 3, "t": "cloze", "src": "Ü3 S.3", "q": "Vervollständige die thermodynamischen Grundbeziehungen.", "parts": ["ΔG = ΔH − ", "·ΔS;   ΔG = −U₀·", "·F;   Q = n·", "·F"], "blanks": ["T", "z", "z"], "ex": "z ist die Zahl der übertragenen Elektronen pro Stoffumsatz."}, {"id": 18, "e": 3, "t": "mc", "src": "Ü3 S.4", "q": "Für die Gesamtreaktion der Blei-Säure-Batterie werden wie viele Elektronen übertragen?", "opts": ["0,5", "1", "2", "4"], "correct": 2, "ex": "In der Gesamtreaktion werden zwei Elektronen übertragen, also z = 2."}, {"id": 19, "e": 3, "t": "formula", "src": "Ü3 S.5", "q": "Wie wird die Reaktions-Gibbsenergie ΔG aus den freien Bildungsenthalpien bestimmt?", "answer": "ΔG = ΣΔG_Produkte − ΣΔG_Reaktanden", "alts": ["produkte", "reaktanden", "-"], "ex": "Produkte minus Reaktanden, jeweils mit stöchiometrischen Faktoren."}, {"id": 20, "e": 3, "t": "open", "src": "Ü3 S.7", "q": "Warum besitzen elementares Pb und H⁺ in der Tabelle eine freie Bildungsenthalpie von 0?", "answer": "Referenzzustand; die Bildungsenergie elementarer Stoffe im Standardzustand wird als 0 definiert.", "ex": "Die Folie veranschaulicht zusätzlich: Energie steckt in chemischen Bindungen."}, {"id": 21, "e": 3, "t": "mc", "src": "Ü3 S.9", "q": "Welche Aussagen zur C-Rate sind korrekt?", "opts": ["120 A an 60 Ah = 2C; 10 A an 50 Ah = 0,2C; 200 A an 50 Ah = 4C", "120 A an 60 Ah = 3C", "5 A an 50 Ah = 10C", "Nur 10 A an 50 Ah = 0,2C"], "correct": 0, "ex": "C-Rate = Strom / Nennkapazität. Damit: 2C, 0,2C und 4C."}, {"id": 22, "e": 3, "t": "cloze", "src": "Ü3 S.11–13", "q": "Vervollständige die elektrochemische Kinetik.", "parts": ["Oxidation bedeutet ", " von Elektronen und entspricht hier der ", ". Reduktion bedeutet ", " von Elektronen und entspricht hier der ", "."], "blanks": ["Entzug", "Entladung", "Zuführung", "Ladung"], "ex": "Die Übung ordnet anodische Reaktion der Oxidation/Entladung und kathodische Reaktion der Reduktion/Ladung zu."}, {"id": 23, "e": 3, "t": "mc", "src": "Ü3 S.12", "q": "Was repräsentieren die beiden Exponentialterme der Butler-Volmer-Gleichung?", "opts": ["Oxidation und Reduktion an einer Elektrode", "Je eine Reaktion an den beiden unterschiedlichen Elektroden", "Ohmschen und diffusionsbedingten Spannungsabfall", "SOC und DOD"], "correct": 0, "ex": "Beide Teilreaktionen gehören zur selben Elektrode: anodischer und kathodischer Teilstrom."}, {"id": 24, "e": 4, "t": "mc", "src": "Ü4 S.2–4", "q": "Welche Komponenten gelten im elektrochemischen Sinn als aktive Komponenten einer Lithium-Ionen-Batterie?", "opts": ["Stromsammler und BMS", "Aktivmaterial und Elektrolyt", "Separator und Batteriepole", "Nur Stromsammler"], "correct": 1, "ex": "Die Übungen markieren Aktivmaterial und Elektrolyt als aktive Komponenten."}, {"id": 25, "e": 4, "t": "graphic", "src": "Ü4 S.5", "q": "Im gezeigten Ladezustand wandern Li-Ionen zur Graphitanode. Wann ist die Zelle vollgeladen?", "graphic": "liion", "opts": ["Wenn die negative Elektrode mit Li-Ionen gefüllt ist", "Wenn die positive Elektrode maximal mit Li-Ionen gefüllt ist", "Wenn die Spannung der negativen Elektrode maximal steigt", "Wenn keine Li-Ionen im Elektrolyt sind"], "correct": 0, "ex": "Beim Laden werden Li-Ionen aus der positiven Elektrode deinterkaliert und in Graphit eingelagert."}, {"id": 26, "e": 4, "t": "mc", "src": "Ü4 S.6", "q": "Was ist ein grundlegender Unterschied zwischen Hochleistungs- (HP) und Hochenergiezellen (HE)?", "opts": ["HP besitzen typischerweise dünneres/weniger Aktivmaterial", "HP besitzen grundsätzlich mehr Aktivmaterial", "HE haben immer dünnere Elektroden", "Es gibt keinen geometrischen Unterschied"], "correct": 0, "ex": "Dünnere Elektroden verkürzen Transportwege und begünstigen Leistung, reduzieren aber den Aktivmaterialanteil."}, {"id": 27, "e": 4, "t": "graphic", "src": "Ü4 S.7–10", "q": "Welche Größe entspricht näherungsweise der Zellspannung in einem Halbzellspannungsdiagramm?", "graphic": "halfcells", "opts": ["Potential positive Elektrode + Potential negative Elektrode", "Potential positive Elektrode − Potential negative Elektrode", "Nur Potential der Anode", "Nur Potential der Kathode"], "correct": 1, "ex": "Die Zellspannung ist die Potentialdifferenz zwischen positiver und negativer Elektrode."}, {"id": 28, "e": 4, "t": "mc", "src": "Ü4 S.11", "q": "Was bedeutet eine Einschränkung 0 < x < 0,6 für den Lithiierungsgrad der positiven Elektrode?", "opts": ["Nur 60 % der Reaktionsenergie sind elektrisch nutzbar", "Maximal 60 % der Li-Ionen sollen der positiven Elektrode entnommen werden", "Nur 60 % der Li-Ionen benötigen Elektronen", "Der SOC darf nie über 60 % liegen"], "correct": 1, "ex": "x beschreibt die Stöchiometrie/Lithiierung; die Grenze beschränkt die nutzbare Entlithiierung."}, {"id": 29, "e": 4, "t": "formula", "src": "Ü4", "q": "Wie hängt der Leitwert G eines Elektrolyten qualitativ von Leitfähigkeit κ, Fläche A und Elektrodenabstand l ab?", "answer": "G = κ · A / l", "alts": ["kappa", "a", "/l"], "ex": "Große Fläche und kleiner Abstand erhöhen den Leitwert und senken damit den Elektrolytwiderstand."}, {"id": 30, "e": 4, "t": "open", "src": "Ü4 Ü4.1", "q": "Bei der Formierung einer LFP/Graphit-Zelle werden 8 % des anfänglichen Lithiums für die SEI verbraucht. Was ist die unmittelbare Folge für die zyklierbare Lithiuminventur?", "answer": "Nur 92 % des anfänglichen Lithiums bleiben für die reversible Zyklierung verfügbar.", "ex": "Die SEI bindet Lithium irreversibel; dieses Lithium steht anschließend nicht mehr für die Hauptreaktion zur Verfügung."}, {"id": 31, "e": "VL01", "t": "mc", "src": "VL01 S.12–15", "q": "Welche Klimaziele für Deutschland nennt VL01?", "opts": ["2030 mindestens −65 %, 2040 mindestens −88 %, 2045 Treibhausgasneutralität", "2030 −40 %, 2040 −65 %, 2050 Neutralität", "2030 −88 %, 2040 Neutralität, 2045 −100 %", "Nur ein Ziel für 2030"], "correct": 0, "ex": "Die Vorlesung zeigt mindestens −65 % bis 2030, mindestens −88 % bis 2040 und Treibhausgasneutralität bis 2045."}, {"id": 32, "e": "VL01", "t": "cloze", "src": "VL01 S.14", "q": "Was entspricht laut Vorlesung ungefähr einer Tonne CO₂ pro Jahr?", "parts": ["Autofahrt: ca. ", " km bei 5 l Diesel/100 km; Heizöl: ca. ", " l; Flugreise: ca. ", " km."], "blanks": ["5400", "320", "7000"], "ex": "Diese Größenordnungen werden auf Folie 14 als anschauliche Beispiele für 1 t CO₂/Jahr genannt."}, {"id": 33, "e": "VL01", "t": "mc", "src": "VL01 S.17", "q": "Was ist laut Vorlesung der zentrale Unterschied zwischen fossilen und erneuerbaren Energieträgern?", "opts": ["Foss r", "Kapazitätsverlust", "Kurzschlüsse"], "ex": "Die Vorlesung verbindet Plating außerdem mit Dendritenbildung."}, {"id": 51, "e": "VL01", "t": "mc", "src": "VL01 S.77/90", "q": "Welche Punkte nennt VL01 als Herausforderungen hoher Laderaten?", "opts": ["Leistungsorientiertes Zelldesign, aktive Kühlung, höhere Batteriespannung und Plating-Risiko", "Nur größere Reifen", "Nur Softwareoptimierung", "Ausschließlich höherer SOC"], "correct": 0, "ex": "Die Vorlesung fasst diese vier Punkte mehrfach als Kernthemen des Schnellladens zusammen."}, {"id": 52, "e": "VL01", "t": "mc", "src": "VL01 S.94", "q": "Wie funktioniert Vehicle-to-Home (V2H) nach VL01 typischerweise?", "opts": ["Bei hoher PV-Erzeugung Fahrzeug laden; abends/nachts zur Versorgung des Hauses entladen", "Tagsüber entladen und nachts mit PV laden", "Fahrzeug nur als Notstromquelle ohne Laden", "V2H bedeutet ausschließlich Netzeinspeisung"], "correct": 0, "ex": "Motivation ist höherer Eigenverbrauch; Herausforderungen sind Verfügbarkeit, Verluste bei kleiner Leistung und Schnittstellen."}, {"id": 53, "e": "VL01", "t": "mc", "src": "VL01 S.96", "q": "Warum sieht VL01 Potenzial für Fahrzeugbatterien bei Netzdienstleistungen?", "opts": ["Ein großer Teil der möglichen Zyklenlebensdauer wird allein fürs Fahren nicht genutzt, besonders bei kleinen DOD", "Weil Netzdienste keine Zyklen verursachen", "Weil Fahrzeugbatterien immer am Netz sind", "Weil die Batterie dadurch keine Alterung erfährt"], "correct": 0, "ex": "Die Folie nennt ungenutzte Zyklenlebensdauer von etwa 70–78 % je nach Fahrzeugklasse."}, {"id": 54, "e": "VL01", "t": "mc", "src": "VL01 S.97", "q": "Wie hängen bei 20 % DOD die gezeigten 50.000 Teilzyklen mit äquivalenten Vollzyklen zusammen?", "opts": ["50.000 × 0,2 = 10.000 äquivalente Vollzyklen", "50.000 × 5 = 250.000 Vollzyklen", "20 % DOD entspricht immer einem Vollzyklus", "Es besteht kein Zusammenhang"], "correct": 0, "ex": "Äquivalente Vollzyklen ergeben sich aus Zyklenzahl × DOD."}, {"id": 55, " ombsche Wirkungsgrad vergleicht ausschließlich Spannungen.", "Die Ruhespannung ist unabhängig vom Ladezustand."], "correct": 0, "ex": "Die Ruhespannung × Kapazität charakterisiert die maximal entnehmbare Energie; Überspannungen verursachen Verluste."}, {"id": 60, "e": "VL02", "t": "cloze", "src": "VL02 S.12", "q": "Vervollständige die Definition von SOC und DOD.", "parts": ["SOC = 100 % entspricht ", " Batterie; DOD = ", " % − SOC. Bei SOC = 0 % ist DOD = ", " %."], "blanks": ["vollgeladener", "100", "100"], "ex": "DOD = 100 % − SOC."}, {"id": 61, "e": "VL02", "t": "mc", "src": "VL02 S.16", "q": "Wie ändern sich Kapazität und Betriebsbedingungen typischerweise?", "opts": ["Kapazität steigt mit Temperatur und sinkt bei höherem Entladestrom.", "Kapazität sinkt immer mit steigender Temperatur.", "Kapazität ist völlig unabhängig vom Entladestrom.", "Höherer Entladestrom erhöht immer die nutzbare Kapazität."], "correct": 0, "ex": "Schnellere Diffusion bei höherer Temperatur hilft; hohe Ströme erhöhen Überspannung und Diffusionsprobleme."}, {"id": 62, "e": "VL02", "t": "mc", "src": "VL02 S.34", "q": "Was ist der Unterschied zwischen Gleichgewichtsspannung und OCV?", "opts": ["Gleichgewichtsspannung ist frei von Polarisation; OCV ist nur stromlos und kann nach einem Strompuls noch Diffusionsüberspannungen enthalten.", "Es gibt grundsätzlich keinen Unterschied.", "OCV wird nur unter Last gemessen.", "Gleichgewichtsspannung ist immer kleiner als 0 V."], "correct": 0, "ex": "In vereinfachten Betrachtungen werden beide häufig gleichgesetzt."}, {"id": 63, "e": "VL02", "t": "mc", "src": "VL02 S.60–66", "q": "Welche Aussage zur Butler-Volmer-Beschreibung ist richtig?", "opts": ["Im Gleichgewicht sind anodische und kathodische Reaktionsraten gleich, aber nicht null.", "Im Gleichgewicht findet keinerlei mikroskopische Reaktion statt.", "Oxidation entspricht der Zuführung von Elektronen.", "Eine hohe Austauschstromdichte führt zu besonders großen Spannungsänderungen."], "correct": 0, "ex": "Hohe Austauschstromdichte bedeutet eine 'steifere' Reaktion mit geringerer Überspannung bei Stromänderung."}, {"id": 64, "e": "VL02", "t": "mc", "src": "VL02 S.76", "q": "Warum liegen praktische Energiedichten deutlich unter theoretischen Werten?", "opts": ["Zusätzliche Massen für Elektrolyt, Separator, Stromsammler, Gehäuse und Trägermaterialien sind nötig.", "Weil eine Batterie nur bei 0 V arbeitet.", "Weil Elektronen keine Energie tragen.", "Nur wegen der Temperatur."], "correct": 0, "ex": "Als Faustformel nennt die Vorlesung etwa ein Drittel der theoretischen Energiedichte als praktisch erreichbar."}, {"id": 65, "e": "VL03", "t": "cloze", "src": "VL03 S.3", "q": "Vervollständige die Größenordnung: Eine Zelle mit 250 Wh/kg benötigt ungefähr ___ kg Zellen für 1 kWh.", "parts": ["Benötigte Zellmasse ≈ ", " kg."], "blanks": ["4"], "ex": "1000 Wh / 250 Wh/kg = 4 kg."}, {"id": 66, "e": "VL03", "t": "mc", "src": "VL03 S.5", "q": "Warum ist Lithium als Elektrodenmaterial besonders attraktiv?", "opts": ["Sehr negatives Elektrodenpotential und sehr hohe spezifische Kapazität.", "Sehr hohe Dichte und geringe Spannung.", "Es reagiert überhaupt nicht.", "Es besitzt zwei Elektronen pro Reaktion."], "correct": 0, "ex": "VL03 nennt für Lithium u.a. −3,05 V gegen Wasserstoff und 3,86 Ah/g."}, {"id": 67, "e": "VL03", "t": "graphic", "src": "VL03 S.22", "q": "Was charakterisiert das 'Rocking-Chair'-Prinzip der Lithium-Ionen-Batterie?", "graphic": "rockingchair", "opts": ["Li-Ionen pendeln beim Laden/Entladen zwischen den Elektroden; metallisches Lithium ist im normalen Li-Ionen-System nicht erforderlich.", "Der Elektrolyt wird vollständig verbraucht.", "Elektronen wandern durch den Separator.", "Beide Elektroden bestehen aus metallischem Lithium."], "correct": 0, "ex": "Der Elektrolyt dient vor allem als Transportmedium für Li-Ionen."}, {"id": 68, "e": "VL03", "t": "mc", "src": "VL03 S.51", "q": "Welche Funktion kann ein Shutdown-Separator übernehmen?", "opts": ["Bei Über "t": "formula", "src": "VL04 S.6", "q": "Gib die Ladezeit beim zeitgesteuerten Konstantstromladen an.", "answer": "t = c · Q / I_K", "alts": ["c", "q", "ik"], "ex": "c steht in der Vorlesung für den Ladefaktor/Ladewirkungsgrad."}, {"id": 79, "e": "VL04", "t": "mc", "src": "VL04 S.9–11", "q": "Welches Kriterium eignet sich bei NiMH gut zur Vollladeerkennung?", "opts": ["Spannungs- oder Temperaturgradienten, z.B. −ΔU bzw. dT/dt.", "Nur die absolute Uhrzeit.", "Ausschließlich die Fahrzeuggeschwindigkeit.", "Nur die Umgebungsluftfeuchte."], "correct": 0, "ex": "Absolute Grenzwerte können stark von Temperatur, Alter und Zelltyp abhängen."}, {"id": 80, "e": "VL04", "t": "mc", "src": "VL04 S.12", "q": "Was passiert bei reiner Konstantspannungsladung mit dem Ladestrom?", "opts": ["Er sinkt mit zunehmendem Ladezustand selbsttätig ab.", "Er bleibt immer konstant.", "Er steigt unbegrenzt.", "Er wird exakt null, sobald das Laden beginnt."], "correct": 0, "ex": "Ruhespannung und Innenwiderstand steigen bzw. die Spannungsdifferenz zum Ladegerät wird kleiner."}, {"id": 81, "e": "VL04", "t": "graphic", "src": "VL04 S.13–14", "q": "Welches Profil ist das Standardladeverfahren für Lithium-Ionen-Batterien?", "graphic": "cccv", "opts": ["CC-CV / IU: erst Konstantstrom, dann Konstantspannung.", "Nur Konstantstrom bis beliebig hohe Spannung.", "Nur Konstantspannung ohne Strombegrenzung.", "Reine Pulsladung ohne Grenzwerte."], "correct": 0, "ex": "Umschaltung erfolgt beim Erreichen der Ladeschlussspannung; Ende meist bei Unterschreiten eines Mindeststroms."}, {"id": 82, "e": "VL04", "t": "mc", "src": "VL04 S.19", "q": "Welche Aussage zu AC- und DC-Laden stimmt?", "opts": ["Beim AC-Laden liegt die Ladeelektronik typischerweise im Fahrzeug; beim DC-Laden wird die Regelung weitgehend von der Ladesäule übernommen.", "DC-Laden ist immer auf 3,7 kW begrenzt.", "AC-Laden ist grundsätzlich bidirektional.", "DC-Laden benötigt keine Leistungselektronik."], "correct": 0, "ex": "Typische AC-Leistunge 10.", "Es gibt keinen Zusatzaufwand."], "correct": 0, "ex": "Integration, Sicherheit, Kühlung, BMS und Struktur verursachen Zusatzkosten."}, {"id": 88, "e": "VL05", "t": "cloze", "src": "VL05 S.13", "q": "Vervollständige den Zielkonflikt.", "parts": ["Hohe Leistungsdichte und hohe ", "dichte sind nicht gleichzeitig maximal erreichbar. Im Pack werden nur etwa ", "–", " % der theoretischen Materialenergiedichte erreicht."], "blanks": ["Energie", "20", "30"], "ex": "Zusätzliche Packkomponenten reduzieren die praktische Energiedichte."}, {"id": 89, "e": "VL05", "t": "mc", "src": "VL05 S.43", "q": "Welche Spannungslagen nennt VL05 typischerweise?", "opts": ["12 V Mikrohybrid, ca. 150 V Mild-Hybrid, ca. 400 V Vollhybrid/EV, 800 V für Ultraschnellladen diskutiert.", "Alle Fahrzeuge arbeiten mit 12 V.", "EV immer 24 V.", "Mild-Hybrid immer 800 V."], "correct": 0, "ex": "Busse und Straßenbahnen liegen typischerweise ebenfalls im hohen Hunderte-Volt-Bereich."}, {"id": 90, "e": "VL05", "t": "graphic", "src": "VL05 S.44/49", "q": "Welche Aussage zur Verschaltung ist korrekt?", "graphic": "packtopology", "opts": ["Serienschaltung erhöht die Spannung; Parallelschaltung erhöht Kapazität/Stromfähigkeit und Redundanz.", "Parallelschaltung addiert nur Spannung.", "Serienschaltung erhöht immer die Ah-Kapazität.", "Beide sind elektrisch identisch."], "correct": 0, "ex": "Die Wahl beeinflusst BMS-Aufwand, Sicherungskonzept und Fehlerverhalten."}, {"id": 91, "e": "VL05", "t": "mc", "src": "VL05 S.46", "q": "Warum ist eine lange Serienschaltung hinsichtlich Alterung kritisch?", "opts": ["Der Strang wird durch die schwächste Zelle limitiert.", "Alle Zellen altern dadurch exakt gleich.", "Serienschaltung verhindert jede Alterung.", "Die Spannung jeder Zelle wird automatisch gleich."], "correct": 0, "ex": "Zellstreuung wächst mit Alterung; Selektion, Modularität und Parallelschaltung sind mögliche Gegenmaßnahmen."}, {"id": 92, "e": "VL05", "t": "formula", "src": "VL05 S.62", "q": "Welche Zei
