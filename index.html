const Q=[{"id": 1, "e": 1, "t": "formula", "src": "Ü1 S.2", "q": "Gib die Definition der Nennspannung Uₙ als Formel an.", "answer": "U_N = (1/T) · ∫ U_Entladung(t) dt", "alts": ["1/t", "integral", "uentladung"], "ex": "Die Nennspannung ist der zeitliche Mittelwert der Spannung während einer Entladung unter nominalen Bedingungen."}, {"id": 2, "e": 1, "t": "formula", "src": "Ü1 S.2", "q": "Wie wird die entnehmbare Batteriekapazität C aus dem Entladestrom bestimmt?", "answer": "C = ∫ I_Entladung(t) dt", "alts": ["integral", "ientladung"], "ex": "Kapazität ist eine Ladungsmenge; deshalb wird der Strom über die Zeit integriert."}, {"id": 3, "e": 1, "t": "cloze", "src": "Ü1 S.3", "q": "Vervollständige den Zusammenhang zwischen SOC und DOD.", "parts": ["DOD(t) = ", " % − ", "(t)"], "blanks": ["100", "SOC"], "ex": "DOD beschreibt den bereits entladenen Anteil, SOC den noch verfügbaren Anteil."}, {"id": 4, "e": 1, "t": "mc", "src": "Ü1 S.4–5", "q": "Welcher Teil einer Batteriezelle speichert im Allgemeinen die Energie?", "opts": ["Elektrolyt", "Separator", "Aktivmaterialien", "Stromsammler"], "correct": 2, "ex": "Die Energie steckt in den elektrochemisch aktiven Materialien."}, {"id": 5, "e": 1, "t": "mc", "src": "Ü1 S.5", "q": "Was ist im Allgemeinen die Aufgabe des Elektrolyten?", "opts": ["Elektrische Isolation der Elektroden", "Ionen leiten", "Elektronen leiten", "Energie speichern"], "correct": 1, "ex": "Der Elektrolyt ermöglicht den Ionentransport zwischen den Elektroden."}, {"id": 6, "e": 1, "t": "graphic", "src": "Ü1 S.6–10", "q": "Welche Verschaltung ist dargestellt und was passiert mit Spannung und Kapazität?", "graphic": "parallel", "opts": ["Reihenschaltung: U steigt, C bleibt gleich", "Parallelschaltung: U bleibt gleich, C steigt", "Parallelschaltung: U steigt, C bleibt gleich", "Reihenschaltung: U bleibt gleich, C steigt"], "correct": 1, "ex": "Bei Parallelschaltung bleibt die Zellspannung erhalten; die Kapazitäten addieren sich."}, {"id": 7, "e": 1, "t": "graphic", "src": "Ü1 S.9–10", "q": "Welche Verschaltung ist dargestellt und was passiert mit Spannung und Kapazität?", "graphic": "series", "opts": ["Reihenschaltung: U addiert sich, C bleibt gleich", "Parallelschaltung: U bleibt gleich, C addiert sich", "Reihenschaltung: U bleibt gleich, C addiert sich", "Parallelschaltung: U addiert sich, C bleibt gleich"], "correct": 0, "ex": "In Serie addieren sich die Zellspannungen; die Ah-Kapazität bleibt die einer Einzelzelle."}, {"id": 8, "e": 1, "t": "cloze", "src": "Ü1 S.13", "q": "Vervollständige die Aussage zum äquivalenten Vollzyklus.", "parts": ["Anzahl Zyklen × ", " = Anzahl ", " Vollzyklen"], "blanks": ["DOD", "äquivalenter"], "ex": "Beispiel: vier Zyklen mit je 25 % DOD entsprechen einem äquivalenten Vollzyklus."}, {"id": 9, "e": 1, "t": "open", "src": "Ü1 S.14", "q": "Ein Fahrzeug benötigt 15 kWh/100 km und fährt täglich 60 km. Wie viel Energie benötigt es pro Tag?", "answer": "9 kWh", "ex": "60 km × 15 kWh / 100 km = 9 kWh."}, {"id": 10, "e": 2, "t": "cloze", "src": "Ü2 S.3–4", "q": "Vervollständige die Wirkungsgrad-Beziehungen.", "parts": ["Coulombscher Wirkungsgrad ηAh = entladene ", " / geladene ", ". Energetischer Wirkungsgrad ηWh = entnommene ", " / eingeladene ", "."], "blanks": ["Ah", "Ah", "Wh", "Wh"], "ex": "Der Coulombsche Wirkungsgrad betrachtet Ladungsmenge, der energetische Wirkungsgrad Energie."}, {"id": 11, "e": 2, "t": "mc", "src": "Ü2 S.4", "q": "Welcher typische energetische Wirkungsgrad wird für Lithium-Ionen-Batterien angegeben?", "opts": ["65–75 %", "80–90 %", "90–95 %", "≈50 %"], "correct": 2, "ex": "In der Übung werden für Lithium-Ionen-Batterien etwa 90–95 % genannt; ηAh liegt ungefähr bei 100 %."}, {"id": 12, "e": 2, "t": "graphic", "src": "Ü2 S.5", "q": "Welche Kurve entspricht einer CC-CV-CC-Ladung?", "graphic": "cccvcc", "opts": ["A", "B", "C"], "correct": 1, "ex": "Bei CC-CV-CC folgt auf einen Konstantstromabschnitt ein Konstantspannungsabschnitt und danach wieder ein Konstantstromabschnitt."}, {"id": 13, "e": 2, "t": "formula", "src": "Ü2 S.6", "q": "Vervollständige die allgemeine Gleichung der Batterieklemmenspannung.", "answer": "U_Batterieklemme = U_Gleichgewicht + U_Widerstand + U_Reaktion + U_Diffusion", "alts": ["gleichgewicht", "widerstand", "reaktion", "diffusion"], "ex": "Die Klemmenspannung setzt sich aus Gleichgewichtsspannung und den drei Überspannungsanteilen zusammen."}, {"id": 14, "e": 2, "t": "mc", "src": "Ü2 S.10–13", "q": "Welche Zuordnung ist korrekt?", "opts": ["U_Gleichgewicht → Ohmsches Gesetz", "U_Widerstand → Butler-Volmer", "U_Reaktion → Butler-Volmer", "U_Diffusion → freie Gibbs-Energie"], "correct": 2, "ex": "U_Gleichgewicht: Thermodynamik/Gibbs bzw. Nernst; U_Widerstand: Ohm; U_Reaktion: Butler-Volmer; U_Diffusion: Fick."}, {"id": 15, "e": 2, "t": "mc", "src": "Ü2 S.12", "q": "Welche Widerstände tragen laut Übung zur ohmschen Überspannung U_Widerstand bei?", "opts": ["Stromsammler + Batteriepole + Elektrolyt", "Nur Ladungsdurchtrittswiderstand", "Nur Separator", "Nur Aktivmaterial"], "correct": 0, "ex": "Genannt werden Stromsammler, Batteriepole und Elektrolyt. Der Ladungsdurchtrittswiderstand gehört zur Reaktionskinetik."}, {"id": 16, "e": 2, "t": "open", "src": "Ü2 S.16", "q": "Eine C20-Batterie besitzt 100 Ah. Welche Stromstärke entspricht I20 und welche 4·I20?", "answer": "I20 = 5 A; 4·I20 = 20 A", "ex": "C20 bedeutet Entladung der Nennkapazität über 20 h: 100 Ah / 20 h = 5 A."}, {"id": 17, "e": 3, "t": "cloze", "src": "Ü3 S.3", "q": "Vervollständige die thermodynamischen Grundbeziehungen.", "parts": ["ΔG = ΔH − ", "·ΔS;   ΔG = −U₀·", "·F;   Q = n·", "·F"], "blanks": ["T", "z", "z"], "ex": "z ist die Zahl der übertragenen Elektronen pro Stoffumsatz."}, {"id": 18, "e": 3, "t": "mc", "src": "Ü3 S.4", "q": "Für die Gesamtreaktion der Blei-Säure-Batterie werden wie viele Elektronen übertragen?", "opts": ["0,5", "1", "2", "4"], "correct": 2, "ex": "In der Gesamtreaktion werden zwei Elektronen übertragen, also z = 2."}, {"id": 19, "e": 3, "t": "formula", "src": "Ü3 S.5", "q": "Wie wird die Reaktions-Gibbsenergie ΔG aus den freien Bildungsenthalpien bestimmt?", "answer": "ΔG = ΣΔG_Produkte − ΣΔG_Reaktanden", "alts": ["produkte", "reaktanden", "-"], "ex": "Produkte minus Reaktanden, jeweils mit stöchiometrischen Faktoren."}, {"id": 20, "e": 3, "t": "open", "src": "Ü3 S.7", "q": "Warum besitzen elementares Pb und H⁺ in der Tabelle eine freie Bildungsenthalpie von 0?", "answer": "Referenzzustand; die Bildungsenergie elementarer Stoffe im Standardzustand wird als 0 definiert.", "ex": "Die Folie veranschaulicht zusätzlich: Energie steckt in chemischen Bindungen."}, {"id": 21, "e": 3, "t": "mc", "src": "Ü3 S.9", "q": "Welche Aussagen zur C-Rate sind korrekt?", "opts": ["120 A an 60 Ah = 2C; 10 A an 50 Ah = 0,2C; 200 A an 50 Ah = 4C", "120 A an 60 Ah = 3C", "5 A an 50 Ah = 10C", "Nur 10 A an 50 Ah = 0,2C"], "correct": 0, "ex": "C-Rate = Strom / Nennkapazität. Damit: 2C, 0,2C und 4C."}, {"id": 22, "e": 3, "t": "cloze", "src": "Ü3 S.11–13", "q": "Vervollständige die elektrochemische Kinetik.", "parts": ["Oxidation bedeutet ", " von Elektronen und entspricht hier der ", ". Reduktion bedeutet ", " von Elektronen und entspricht hier der ", "."], "blanks": ["Entzug", "Entladung", "Zuführung", "Ladung"], "ex": "Die Übung ordnet anodische Reaktion der Oxidation/Entladung und kathodische Reaktion der Reduktion/Ladung zu."}, {"id": 23, "e": 3, "t": "mc", "src": "Ü3 S.12", "q": "Was repräsentieren die beiden Exponentialterme der Butler-Volmer-Gleichung?", "opts": ["Oxidation und Reduktion an einer Elektrode", "Je eine Reaktion an den beiden unterschiedlichen Elektroden", "Ohmschen und diffusionsbedingten Spannungsabfall", "SOC und DOD"], "correct": 0, "ex": "Beide Teilreaktionen gehören zur selben Elektrode: anodischer und kathodischer Teilstrom."}, {"id": 24, "e": 4, "t": "mc", "src": "Ü4 S.2–4", "q": "Welche Komponenten gelten im elektrochemischen Sinn als aktive Komponenten einer Lithium-Ionen-Batterie?", "opts": ["Stromsammler und BMS", "Aktivmaterial und Elektrolyt", "Separator und Batteriepole", "Nur Stromsammler"], "correct": 1, "ex": "Die Übungen markieren Aktivmaterial und Elektrolyt als aktive Komponenten."}, {"id": 25, "e": 4, "t": "graphic", "src": "Ü4 S.5", "q": "Im gezeigten Ladezustand wandern Li-Ionen zur Graphitanode. Wann ist die Zelle vollgeladen?", "graphic": "liion", "opts": ["Wenn die negative Elektrode mit Li-Ionen gefüllt ist", "Wenn die positive Elektrode maximal mit Li-Ionen gefüllt ist", "Wenn die Spannung der negativen Elektrode maximal steigt", "Wenn keine Li-Ionen im Elektrolyt sind"], "correct": 0, "ex": "Beim Laden werden Li-Ionen aus der positiven Elektrode deinterkaliert und in Graphit eingelagert."}, {"id": 26, "e": 4, "t": "mc", "src": "Ü4 S.6", "q": "Was ist ein grundlegender Unterschied zwischen Hochleistungs- (HP) und Hochenergiezellen (HE)?", "opts": ["HP besitzen typischerweise dünneres/weniger Aktivmaterial", "HP besitzen grundsätzlich mehr Aktivmaterial", "HE haben immer dünnere Elektroden", "Es gibt keinen geometrischen Unterschied"], "correct": 0, "ex": "Dünnere Elektroden verkürzen Transportwege und begünstigen Leistung, reduzieren aber den Aktivmaterialanteil."}, {"id": 27, "e": 4, "t": "graphic", "src": "Ü4 S.7–10", "q": "Welche Größe entspricht näherungsweise der Zellspannung in einem Halbzellspannungsdiagramm?", "graphic": "halfcells", "opts": ["Potential positive Elektrode + Potential negative Elektrode", "Potential positive Elektrode − Potential negative Elektrode", "Nur Potential der Anode", "Nur Potential der Kathode"], "correct": 1, "ex": "Die Zellspannung ist die Potentialdifferenz zwischen positiver und negativer Elektrode."}, {"id": 28, "e": 4, "t": "mc", "src": "Ü4 S.11", "q": "Was bedeutet eine Einschränkung 0 < x < 0,6 für den Lithiierungsgrad der positiven Elektrode?", "opts": ["Nur 60 % der Reaktionsenergie sind elektrisch nutzbar", "Maximal 60 % der Li-Ionen sollen der positiven Elektrode entnommen werden", "Nur 60 % der Li-Ionen benötigen Elektronen", "Der SOC darf nie über 60 % liegen"], "correct": 1, "ex": "x beschreibt die Stöchiometrie/Lithiierung; die Grenze beschränkt die nutzbare Entlithiierung."}, {"id": 29, "e": 4, "t": "formula", "src": "Ü4", "q": "Wie hängt der Leitwert G eines Elektrolyten qualitativ von Leitfähigkeit κ, Fläche A und Elektrodenabstand l ab?", "answer": "G = κ · A / l", "alts": ["kappa", "a", "/l"], "ex": "Große Fläche und kleiner Abstand erhöhen den Leitwert und senken damit den Elektrolytwiderstand."}, {"id": 30, "e": 4, "t": "open", "src": "Ü4 Ü4.1", "q": "Bei der Formierung einer LFP/Graphit-Zelle werden 8 % des anfänglichen Lithiums für die SEI verbraucht. Was ist die unmittelbare Folge für die zyklierbare Lithiuminventur?", "answer": "Nur 92 % des anfänglichen Lithiums bleiben für die reversible Zyklierung verfügbar.", "ex": "Die SEI bindet Lithium irreversibel; dieses Lithium steht anschließend nicht mehr für die Hauptreaktion zur Verfügung."}, {"id": 31, "e": "VL01", "t": "mc", "src": "VL01 S.12–15", "q": "Welche Klimaziele für Deutschland nennt VL01?", "opts": ["2030 mindestens −65 %, 2040 mindestens −88 %, 2045 Treibhausgasneutralität", "2030 −40 %, 2040 −65 %, 2050 Neutralität", "2030 −88 %, 2040 Neutralität, 2045 −100 %", "Nur ein Ziel für 2030"], "correct": 0, "ex": "Die Vorlesung zeigt mindestens −65 % bis 2030, mindestens −88 % bis 2040 und Treibhausgasneutralität bis 2045."}, {"id": 32, "e": "VL01", "t": "cloze", "src": "VL01 S.14", "q": "Was entspricht laut Vorlesung ungefähr einer Tonne CO₂ pro Jahr?", "parts": ["Autofahrt: ca. ", " km bei 5 l Diesel/100 km; Heizöl: ca. ", " l; Flugreise: ca. ", " km."], "blanks": ["5400", "320", "7000"], "ex": "Diese Größenordnungen werden auf Folie 14 als anschauliche Beispiele für 1 t CO₂/Jahr genannt."}, {"id": 33, "e": "VL01", "t": "mc", "src": "VL01 S.17", "q": "Was ist laut Vorlesung der zentrale Unterschied zwischen fossilen und erneuerbaren Energieträgern?", "opts": ["Fossile Energieträger sind leicht speicher- und transportierbar; erneuerbare Energien liefern fluktuierend direkt elektrische Leistung", "Erneuerbare Energien sind immer chemisch gespeichert", "Fossile Energieträger können nicht transportiert werden", "Erneuerbare Energien erzeugen ausschließlich Wärme"], "correct": 0, "ex": "Die Vorlesung stellt fossile chemische Energieträger als gut speicher- und transportierbar den fluktuierenden erneuerbaren Stromquellen gegenüber."}, {"id": 34, "e": "VL01", "t": "mc", "src": "VL01 S.19", "q": "Welche Größenordnung der volumetrischen Energiedichte wird in VL01 genannt?", "opts": ["Li-Ion-Zelle ca. 600 kWh/m³; flüssiger H₂ ca. 2400 kWh/m³; Benzin/Diesel/Öl ca. 10.000 kWh/m³", "Li-Ion ca. 10.000; H₂ ca. 600; Benzin ca. 2400 kWh/m³", "Alle etwa 600 kWh/m³", "Li-Ion ca. 1; H₂ ca. 10; Benzin ca. 116 kWh/m³"], "correct": 0, "ex": "Die Angaben gelten mit den auf der Folie genannten Systemgrenzen; insbesondere H₂ und Kraftstoffe ohne Tank bzw. Konversionseinheiten."}, {"id": 35, "e": "VL01", "t": "mc", "src": "VL01 S.22", "q": "Wie vergleicht die Vorlesung die Flächennutzung von Photovoltaik und Biomass-to-Liquid für den Fahrbetrieb?", "opts": ["PV ermöglicht ungefähr die 16-fache Fahrstrecke pro Hektar", "Biomasse ermöglicht ungefähr die 16-fache Fahrstrecke", "Beide sind gleich", "PV ist nur etwa doppelt so gut"], "correct": 0, "ex": "Genannt werden ca. 60.000 km/ha·a für BTL und deutlich über 1.000.000 km/ha·a für PV."}, {"id": 36, "e": "VL01", "t": "graphic", "src": "VL01 S.24–25", "q": "Welche Aussage passt zur dargestellten Wirkungsgradkette von Brennstoffzellen- und Batterie-Elektrofahrzeug?", "graphic": "efficiency", "opts": ["BEV etwa 70–75 %, FCEV etwa 25–30 %; FCEV benötigt grob 2,5-mal mehr Primärstrom", "FCEV ist effizienter als BEV", "Beide liegen bei etwa 90 %", "BEV benötigt etwa 2,5-mal mehr Energie"], "correct": 0, "ex": "VL01 stellt den batterieelektrischen Pfad deutlich effizienter dar als Elektrolyse → H₂-Speicherung → 10.", "Es gibt keinen Zusatzaufwand."], "correct": 0, "ex": "Integration, Sicherheit, Kühlung, BMS und Struktur verursachen Zusatzkosten."}, {"id": 88, "e": "VL05", "t": "cloze", "src": "VL05 S.13", "q": "Vervollständige den Zielkonflikt.", "parts": ["Hohe Leistungsdichte und hohe ", "dichte sind nicht gleichzeitig maximal erreichbar. Im Pack werden nur etwa ", "–", " % der theoretischen Materialenergiedichte erreicht."], "blanks": ["Energie", "20", "30"], "ex": "Zusätzliche Packkomponenten reduzieren die praktische Energiedichte."}, {"id": 89, "e": "VL05", "t": "mc", "src": "VL05 S.43", "q": "Welche Spannungslagen nennt VL05 typischerweise?", "opts": ["12 V Mikrohybrid, ca. 150 V Mild-Hybrid, ca. 400 V Vollhybrid/EV, 800 V für Ultraschnellladen diskutiert.", "Alle Fahrzeuge arbeiten mit 12 V.", "EV immer 24 V.", "Mild-Hybrid immer 800 V."], "correct": 0, "ex": "Busse und Straßenbahnen liegen typischerweise ebenfalls im hohen Hunderte-Volt-Bereich."}, {"id": 90, "e": "VL05", "t": "graphic", "src": "VL05 S.44/49", "q": "Welche Aussage zur Verschaltung ist korrekt?", "graphic": "packtopology", "opts": ["Serienschaltung erhöht die Spannung; Parallelschaltung erhöht Kapazität/Stromfähigkeit und Redundanz.", "Parallelschaltung addiert nur Spannung.", "Serienschaltung erhöht immer die Ah-Kapazität.", "Beide sind elektrisch identisch."], "correct": 0, "ex": "Die Wahl beeinflusst BMS-Aufwand, Sicherungskonzept und Fehlerverhalten."}, {"id": 91, "e": "VL05", "t": "mc", "src": "VL05 S.46", "q": "Warum ist eine lange Serienschaltung hinsichtlich Alterung kritisch?", "opts": ["Der Strang wird durch die schwächste Zelle limitiert.", "Alle Zellen altern dadurch exakt gleich.", "Serienschaltung verhindert jede Alterung.", "Die Spannung jeder Zelle wird automatisch gleich."], "correct": 0, "ex": "Zellstreuung wächst mit Alterung; Selektion, Modularität und Parallelschaltung sind mögliche Gegenmaßnahmen."}, {"id": 92, "e": "VL05", "t": "formula", "src": "VL05 S.62", "q": "Welche Zei entile.", "Sie haben grundsätzlich keinerlei Gasreaktion.", "Sie platzen zwangsläufig bei jeder Ladung."], "correct": 0, "ex": "Der Sauerstoffkreislauf rekombiniert Wasser; Ventile schützen vor zu hohem Druck."}, {"id": 119, "e": 6, "t": "cloze", "src": "Ü6 S.5", "q": "Vervollständige die Gasungsregeln.", "parts": ["Gasungsrate ×", " bei +100 mV; Gasungsrate ×", " bei +10 °C. H₂ entsteht an der ", " Elektrode, O₂ an der ", " Elektrode."], "blanks": ["3", "2", "negativen", "positiven"], "ex": "Diese Daumenregeln werden in Ü6 verwendet."}, {"id": 120, "e": 6, "t": "formula", "src": "Ü6 S.5", "q": "Gib das Faraday-Gesetz an.", "answer": "Q = n · z · F", "alts": ["n", "z", "f"], "ex": "F = 96485 C/mol."}, {"id": 121, "e": 6, "t": "open", "src": "Ü6 Ü6.1", "q": "Eine 12-V-Blei-Säure-Batterie besteht aus Zellen mit etwa 2 V Nennspannung. Wie viele Zellen sind in Serie?", "answer": "6 Zellen", "ex": "12 V / 2 V pro Zelle = 6."}, {"id": 122, "e": 6, "t": "formula", "src": "Ü6 Ü6.2", "q": "Welche Energie besitzt ein Kondensator/Supercap bei Spannung U?", "answer": "E = 1/2 · C · U²", "alts": ["c", "u", "2"], "ex": "Die Energie sinkt quadratisch mit der Spannung."}, {"id": 123, "e": 6, "t": "formula", "src": "Ü6 Ü6.2", "q": "Wie ergibt sich die Ersatzkapazität N identischer Supercaps in Serie?", "answer": "C_pack = C_einzel / N", "alts": ["c", "n", "/"], "ex": "Bei identischen Serienschaltungen addieren sich die Kehrwerte der Kapazitäten."}, {"id": 124, "e": 6, "t": "formula", "src": "Ü6 Ü6.2", "q": "Wie ergibt sich der Gesamtwiderstand N identischer Supercaps in Serie?", "answer": "R_pack = N · R_i", "alts": ["n", "ri"], "ex": "Serienwiderstände addieren sich."}, {"id": 125, "e": 6, "t": "open", "src": "Ü6 Ü6.2", "q": "Ein Fahrzeug mit 1500 kg wird von 0 auf 60 km/h beschleunigt. Welche Grundformel liefert zunächst die benötigte kinetische Energie?", "answer": "E_kin = 1/2 · m · v²; die Batterie muss wegen η < 1 entsprechend E_kin/η liefern.", "ex": "In der Übung beträgt der  if(kind==='ecm')return `<svg viewBox="0 0 650 240"><circle cx="85" cy="120" r="34" fill="none" stroke="currentColor" stroke-width="2"/><text x="85" y="125" text-anchor="middle">U_OCV</text><line x1="119" y1="120" x2="180" y2="120" stroke="currentColor" stroke-width="3"/><rect x="180" y="95" width="90" height="50" fill="none" stroke="currentColor"/><text x="225" y="125" text-anchor="middle">R_ohm</text><line x1="270" y1="120" x2="330" y2="120" stroke="currentColor" stroke-width="3"/><line x1="330" y1="65" x2="330" y2="175" stroke="currentColor"/><line x1="545" y1="65" x2="545" y2="175" stroke="currentColor"/><rect x="380" y="45" width="115" height="45" fill="none" stroke="currentColor"/><text x="437" y="73" text-anchor="middle">R_ct</text><line x1="330" y1="65" x2="380" y2="65" stroke="currentColor"/><line x1="495" y1="65" x2="545" y2="65" stroke="currentColor"/><line x1="390" y1="155" x2="430" y2="155" stroke="currentColor" stroke-width="2"/><line x1="445" y1="135" x2="445" y2="175" stroke="currentColor" stroke-width="4"/><line x1="458" y1="135" x2="458" y2="175" stroke="currentColor" stroke-width="2"/><line x1="458" y1="155" x2="500" y2="155" stroke="currentColor"/><line x1="330" y1="175" x2="390" y2="175" stroke="currentColor"/><line x1="500" y1="175" x2="545" y2="175" stroke="currentColor"/><text x="450" y="205" text-anchor="middle">C_dl</text><line x1="545" y1="120" x2="610" y2="120" stroke="currentColor" stroke-width="3"/></svg>`;

function render(){const q=current;$('badgeExercise').textContent=(String(q.e).startsWith('VL')?'Vorlesung '+String(q.e).slice(2):'Übung '+q.e);$('badgeType').textContent=names[q.t];$('badgeSource').textContent=q.src;$('question').textContent=q.q;$('visual').innerHTML=q.graphic?visual(q.graphic):'';$('feedback').style.display='none';const f=$('answerForm');f.innerHTML='';
 if(q.t==='mc'||q.t==='graphic')q.opts.forEach((o,i)=>{const l=document.createElement('label');l.className='opt';l.innerHTML=`<input type="radio" name="ans" value="${i}"><span>${o}</span>`;f.appendChild(l)});
 else if(q.t==='cloze'){const w=document.createElement('div');w.className='cloze';q.parts.forEach((p,i)=>{w.append(document.createTextNode(p));if(i<q.blanks.length){const inp=document.createElement('input');inp.type='text';inp.dataset.blank=i;w.appendChild(inp)}});f.appendChild(w)}
 else{const a=document.createElement('textarea');a.id='textAns';a.rows=4;a.placeholder=q.t==='formula'?'Formel eingeben …':'Antwort in eigenen Worten …';f.appendChild(a)}
 $('check').textContent=q.t==='open'?'Musterlösung vergleichen':'Prüfen'}
function norm(s){return String(s).toLowerCase().replace(/\s/g,'').replace(/η/g,'eta').replace(/κ/g,'kappa').replace(/∫/g,'integral').replace(/·/g,'*').replace(/−/g,'-')}
function fb(title,body,kind='') {const e=$('feedback');e.style.display='block';e.className='feedback '+kind;e.innerHTML=`<b>${title}</b><div style="margin-top:6px">${body}</div>${current.ex?`<div class="muted" style="margin-top:8px;font-size:13px">${current.ex}</div>`:''}`}
function reg(ok){state.done++;if(ok)state.correct++;const k=String(current.id);if(!state.perQuestion[k])state.perQuestion[k]={attempts:0,correct:0,last:null};state.perQuestion[k].attempts++;if(ok)state.perQuestion[k].correct++;state.perQuestion[k].last=new Date().toISOString();save()}
function check(){if(answered&&current.t!=='open')return;let ok=false;
 if(current.t==='mc'||current.t==='graphic'){const r=document.querySelector('input[name="ans"]:checked');if(!r)return fb('Noch keine Antwort','Wähle zuerst eine Antwort.');ok=Number(r.value)===current.correct}
 else if(current.t==='cloze'){const ins=[...document.querySelectorAll('[data-blank]')];if(ins.some(x=>!x.value.trim()))return fb('Noch nicht vollständig','Fülle alle Lücken aus.');ok=ins.every((x,i)=>norm(x.value)===norm(current.blanks[i]))}
 else if(current.t==='formula'){const v=$('textAns').value;if(!v.trim())return fb('Noch keine Antwort','Gib zuerst eine Formel ein.');const n=norm(v);ok=current.alts.every(a=>n.includes(norm(a)))}
 else return fb('Musterlösung',`<b>${current.answer}</b>`);
 answered=true;reg(ok);fb(ok?'✓ Richtig':'✗ Noch nicht ganz',ok?'Sehr gut.':`Lösung: <b>${current.answer!==undefined?current.answer:current.opts[current.correct]}</b>`,ok?'good':'bad')}
function reveal(){let s='';if(current.t==='mc'||current.t==='graphic')s=current.opts[current.correct];else if(current.t==='cloze')s=current.parts.map((p,i)=>p+(i<current.blanks.length?'<b>'+current.blanks[i]+'</b>':'')).join('');else s=current.answer;fb('Lösung',s)}
function exportProgress(){const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='BSS_Lernfortschritt_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importProgress(file){const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(typeof x.done!=='number'||typeof x.correct!=='number')throw 0;state={version:1,perQuestion:{},...x};save();alert('Fortschritt importiert.')}catch(e){alert('Ungültige Fortschrittsdatei.')}};r.readAsText(file)}
$('newQuestion').onclick=pick;$('next').onclick=pick;$('check').onclick=check;$('show').onclick=reveal;$('exercise').onchange=pick;$('type').onchange=pick;
$('exportBtn').onclick=exportProgress;$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=e=>{if(e.target.files[0])importProgress(e.target.files[0]);e.target.value=''};
$('reset').onclick=()=>{if(confirm('Gesamten Fortschritt wirklich zurücksetzen?')){state={version:1,done:0,correct:0,perQuestion:{},updatedAt:null};save();pick()}};
load();pick();
</script></body></html>
