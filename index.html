<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#0f172a">
<title>BSS Lerntrainer</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--text:#111827;--muted:#667085;--border:#d0d5dd;--accent:#2563eb}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
.app{max-width:1100px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
h1{margin:0;font-size:clamp(24px,4vw,36px)}.sub,.muted{color:var(--muted)}.layout{display:grid;grid-template-columns:250px 1fr;gap:16px}.panel,.card{background:var(--card);border:1px solid var(--border);border-radius:18px}.panel{padding:14px;height:max-content;position:sticky;top:12px}.card{padding:20px}
label.small{display:block;font-size:13px;color:var(--muted);margin:10px 0 5px}select,textarea,input[type=text]{width:100%;font:inherit;border:1px solid var(--border);border-radius:10px;padding:10px;background:var(--card);color:var(--text)}
button{font:inherit;border:1px solid var(--border);background:var(--card);color:var(--text);border-radius:10px;padding:10px 13px;cursor:pointer;min-height:44px}.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.row{display:flex;gap:8px;flex-wrap:wrap}.badge{display:inline-block;border:1px solid var(--border);border-radius:999px;padding:5px 9px;font-size:12px;color:var(--muted);margin:0 5px 8px 0}.question{font-size:clamp(19px,2.8vw,25px);font-weight:700;line-height:1.35}.opt{display:flex;gap:10px;padding:12px;border:1px solid var(--border);border-radius:12px;margin:8px 0;cursor:pointer}.feedback{margin-top:14px;padding:14px;border:1px solid var(--border);border-radius:12px}.good{background:#f0fdf4;border-color:#86efac}.bad{background:#fff1f2;border-color:#fecaca}
.statline{display:flex;justify-content:space-between;margin:5px 0}.stats{font-size:14px;border-top:1px solid var(--border);margin-top:14px;padding-top:12px}.progress{height:9px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin-top:8px}.progress>div{height:100%;background:var(--accent);width:0}.cloze{line-height:3}.cloze input{display:inline-block;width:150px;margin:0 4px}svg{max-width:100%;height:auto;margin:14px auto;display:block}.note{font-size:12px;color:var(--muted);margin-top:10px}
@media(max-width:760px){.app{padding:10px}.layout{grid-template-columns:1fr}.panel{position:static}.card{padding:15px}}
@media(prefers-color-scheme:dark){:root{--bg:#0b1220;--card:#111827;--text:#f3f4f6;--muted:#a6adbb;--border:#374151;--accent:#3b82f6}.progress{background:#374151}}
</style>
<link rel="manifest" href="manifest.json"><script>if("serviceWorker" in navigator && location.protocol.startsWith("http"))navigator.serviceWorker.register("sw.js");</script></head>
<body><div class="app">
<div class="top"><div><h1>BSS Lerntrainer</h1><div class="sub">Übung 1–4 · offline · Fortschritt lokal gespeichert</div></div><div class="row"><button id="exportBtn">Fortschritt exportieren</button><button id="importBtn">Fortschritt importieren</button><input id="importFile" type="file" accept=".json,application/json" hidden></div></div>
<div class="layout">
<aside class="panel">
<label class="small">Übung</label><select id="exercise"><option value="all">Alle Übungen</option><option value="1">Übung 1</option><option value="2">Übung 2</option><option value="3">Übung 3</option><option value="4">Übung 4</option></select>
<label class="small">Fragentyp</label><select id="type"><option value="all">Gemischt</option><option value="mc">Multiple Choice</option><option value="formula">Formeln</option><option value="cloze">Lückentexte</option><option value="graphic">Grafiken</option><option value="open">Offene Fragen</option></select>
<button id="newQuestion" class="primary" style="width:100%;margin-top:12px">Neue Zufallsfrage</button>
<div class="stats"><div class="statline"><span>Bearbeitet</span><b id="done">0</b></div><div class="statline"><span>Richtig</span><b id="correct">0</b></div><div class="statline"><span>Quote</span><b id="rate">–</b></div><div class="progress"><div id="bar"></div></div><div class="note" id="lastSaved">Noch nicht gespeichert</div></div>
<button id="reset" style="width:100%;margin-top:12px">Fortschritt zurücksetzen</button>
</aside>
<main class="card">
<div><span id="badgeExercise" class="badge"></span><span id="badgeType" class="badge"></span><span id="badgeSource" class="badge"></span></div>
<div id="question" class="question"></div><div id="visual"></div><form id="answerForm" style="margin-top:16px"></form>
<div id="feedback" class="feedback" style="display:none" aria-live="polite"></div>
<div class="row" style="margin-top:16px"><button id="check" class="primary" type="button">Prüfen</button><button id="show" type="button">Lösung zeigen</button><button id="next" type="button">Nächste Frage</button></div>
<div class="note">Auf iPhone/iPad kann die Datei geöffnet werden. Für besonders zuverlässiges Speichern auf iOS ist die PWA-Version über HTTPS am besten.</div>
</main></div></div>
<script>
const Q=[{"id": 1, "e": 1, "t": "formula", "src": "Ü1 S.2", "q": "Gib die Definition der Nennspannung Uₙ als Formel an.", "answer": "U_N = (1/T) · ∫ U_Entladung(t) dt", "alts": ["1/t", "integral", "uentladung"], "ex": "Die Nennspannung ist der zeitliche Mittelwert der Spannung während einer Entladung unter nominalen Bedingungen."}, {"id": 2, "e": 1, "t": "formula", "src": "Ü1 S.2", "q": "Wie wird die entnehmbare Batteriekapazität C aus dem Entladestrom bestimmt?", "answer": "C = ∫ I_Entladung(t) dt", "alts": ["integral", "ientladung"], "ex": "Kapazität ist eine Ladungsmenge; deshalb wird der Strom über die Zeit integriert."}, {"id": 3, "e": 1, "t": "cloze", "src": "Ü1 S.3", "q": "Vervollständige den Zusammenhang zwischen SOC und DOD.", "parts": ["DOD(t) = ", " % − ", "(t)"], "blanks": ["100", "SOC"], "ex": "DOD beschreibt den bereits entladenen Anteil, SOC den noch verfügbaren Anteil."}, {"id": 4, "e": 1, "t": "mc", "src": "Ü1 S.4–5", "q": "Welcher Teil einer Batteriezelle speichert im Allgemeinen die Energie?", "opts": ["Elektrolyt", "Separator", "Aktivmaterialien", "Stromsammler"], "correct": 2, "ex": "Die Energie steckt in den elektrochemisch aktiven Materialien."}, {"id": 5, "e": 1, "t": "mc", "src": "Ü1 S.5", "q": "Was ist im Allgemeinen die Aufgabe des Elektrolyten?", "opts": ["Elektrische Isolation der Elektroden", "Ionen leiten", "Elektronen leiten", "Energie speichern"], "correct": 1, "ex": "Der Elektrolyt ermöglicht den Ionentransport zwischen den Elektroden."}, {"id": 6, "e": 1, "t": "graphic", "src": "Ü1 S.6–10", "q": "Welche Verschaltung ist dargestellt und was passiert mit Spannung und Kapazität?", "graphic": "parallel", "opts": ["Reihenschaltung: U steigt, C bleibt gleich", "Parallelschaltung: U bleibt gleich, C steigt", "Parallelschaltung: U steigt, C bleibt gleich", "Reihenschaltung: U bleibt gleich, C steigt"], "correct": 1, "ex": "Bei Parallelschaltung bleibt die Zellspannung erhalten; die Kapazitäten addieren sich."}, {"id": 7, "e": 1, "t": "graphic", "src": "Ü1 S.9–10", "q": "Welche Verschaltung ist dargestellt und was passiert mit Spannung und Kapazität?", "graphic": "series", "opts": ["Reihenschaltung: U addiert sich, C bleibt gleich", "Parallelschaltung: U bleibt gleich, C addiert sich", "Reihenschaltung: U bleibt gleich, C addiert sich", "Parallelschaltung: U addiert sich, C bleibt gleich"], "correct": 0, "ex": "In Serie addieren sich die Zellspannungen; die Ah-Kapazität bleibt die einer Einzelzelle."}, {"id": 8, "e": 1, "t": "cloze", "src": "Ü1 S.13", "q": "Vervollständige die Aussage zum äquivalenten Vollzyklus.", "parts": ["Anzahl Zyklen × ", " = Anzahl ", " Vollzyklen"], "blanks": ["DOD", "äquivalenter"], "ex": "Beispiel: vier Zyklen mit je 25 % DOD entsprechen einem äquivalenten Vollzyklus."}, {"id": 9, "e": 1, "t": "open", "src": "Ü1 S.14", "q": "Ein Fahrzeug benötigt 15 kWh/100 km und fährt täglich 60 km. Wie viel Energie benötigt es pro Tag?", "answer": "9 kWh", "ex": "60 km × 15 kWh / 100 km = 9 kWh."}, {"id": 10, "e": 2, "t": "cloze", "src": "Ü2 S.3–4", "q": "Vervollständige die Wirkungsgrad-Beziehungen.", "parts": ["Coulombscher Wirkungsgrad ηAh = entladene ", " / geladene ", ". Energetischer Wirkungsgrad ηWh = entnommene ", " / eingeladene ", "."], "blanks": ["Ah", "Ah", "Wh", "Wh"], "ex": "Der Coulombsche Wirkungsgrad betrachtet Ladungsmenge, der energetische Wirkungsgrad Energie."}, {"id": 11, "e": 2, "t": "mc", "src": "Ü2 S.4", "q": "Welcher typische energetische Wirkungsgrad wird für Lithium-Ionen-Batterien angegeben?", "opts": ["65–75 %", "80–90 %", "90–95 %", "≈50 %"], "correct": 2, "ex": "In der Übung werden für Lithium-Ionen-Batterien etwa 90–95 % genannt; ηAh liegt ungefähr bei 100 %."}, {"id": 12, "e": 2, "t": "graphic", "src": "Ü2 S.5", "q": "Welche Kurve entspricht einer CC-CV-CC-Ladung?", "graphic": "cccvcc", "opts": ["A", "B", "C"], "correct": 1, "ex": "Bei CC-CV-CC folgt auf einen Konstantstromabschnitt ein Konstantspannungsabschnitt und danach wieder ein Konstantstromabschnitt."}, {"id": 13, "e": 2, "t": "formula", "src": "Ü2 S.6", "q": "Vervollständige die allgemeine Gleichung der Batterieklemmenspannung.", "answer": "U_Batterieklemme = U_Gleichgewicht + U_Widerstand + U_Reaktion + U_Diffusion", "alts": ["gleichgewicht", "widerstand", "reaktion", "diffusion"], "ex": "Die Klemmenspannung setzt sich aus Gleichgewichtsspannung und den drei Überspannungsanteilen zusammen."}, {"id": 14, "e": 2, "t": "mc", "src": "Ü2 S.10–13", "q": "Welche Zuordnung ist korrekt?", "opts": ["U_Gleichgewicht → Ohmsches Gesetz", "U_Widerstand → Butler-Volmer", "U_Reaktion → Butler-Volmer", "U_Diffusion → freie Gibbs-Energie"], "correct": 2, "ex": "U_Gleichgewicht: Thermodynamik/Gibbs bzw. Nernst; U_Widerstand: Ohm; U_Reaktion: Butler-Volmer; U_Diffusion: Fick."}, {"id": 15, "e": 2, "t": "mc", "src": "Ü2 S.12", "q": "Welche Widerstände tragen laut Übung zur ohmschen Überspannung U_Widerstand bei?", "opts": ["Stromsammler + Batteriepole + Elektrolyt", "Nur Ladungsdurchtrittswiderstand", "Nur Separator", "Nur Aktivmaterial"], "correct": 0, "ex": "Genannt werden Stromsammler, Batteriepole und Elektrolyt. Der Ladungsdurchtrittswiderstand gehört zur Reaktionskinetik."}, {"id": 16, "e": 2, "t": "open", "src": "Ü2 S.16", "q": "Eine C20-Batterie besitzt 100 Ah. Welche Stromstärke entspricht I20 und welche 4·I20?", "answer": "I20 = 5 A; 4·I20 = 20 A", "ex": "C20 bedeutet Entladung der Nennkapazität über 20 h: 100 Ah / 20 h = 5 A."}, {"id": 17, "e": 3, "t": "cloze", "src": "Ü3 S.3", "q": "Vervollständige die thermodynamischen Grundbeziehungen.", "parts": ["ΔG = ΔH − ", "·ΔS;   ΔG = −U₀·", "·F;   Q = n·", "·F"], "blanks": ["T", "z", "z"], "ex": "z ist die Zahl der übertragenen Elektronen pro Stoffumsatz."}, {"id": 18, "e": 3, "t": "mc", "src": "Ü3 S.4", "q": "Für die Gesamtreaktion der Blei-Säure-Batterie werden wie viele Elektronen übertragen?", "opts": ["0,5", "1", "2", "4"], "correct": 2, "ex": "In der Gesamtreaktion werden zwei Elektronen übertragen, also z = 2."}, {"id": 19, "e": 3, "t": "formula", "src": "Ü3 S.5", "q": "Wie wird die Reaktions-Gibbsenergie ΔG aus den freien Bildungsenthalpien bestimmt?", "answer": "ΔG = ΣΔG_Produkte − ΣΔG_Reaktanden", "alts": ["produkte", "reaktanden", "-"], "ex": "Produkte minus Reaktanden, jeweils mit stöchiometrischen Faktoren."}, {"id": 20, "e": 3, "t": "open", "src": "Ü3 S.7", "q": "Warum besitzen elementares Pb und H⁺ in der Tabelle eine freie Bildungsenthalpie von 0?", "answer": "Referenzzustand; die Bildungsenergie elementarer Stoffe im Standardzustand wird als 0 definiert.", "ex": "Die Folie veranschaulicht zusätzlich: Energie steckt in chemischen Bindungen."}, {"id": 21, "e": 3, "t": "mc", "src": "Ü3 S.9", "q": "Welche Aussagen zur C-Rate sind korrekt?", "opts": ["120 A an 60 Ah = 2C; 10 A an 50 Ah = 0,2C; 200 A an 50 Ah = 4C", "120 A an 60 Ah = 3C", "5 A an 50 Ah = 10C", "Nur 10 A an 50 Ah = 0,2C"], "correct": 0, "ex": "C-Rate = Strom / Nennkapazität. Damit: 2C, 0,2C und 4C."}, {"id": 22, "e": 3, "t": "cloze", "src": "Ü3 S.11–13", "q": "Vervollständige die elektrochemische Kinetik.", "parts": ["Oxidation bedeutet ", " von Elektronen und entspricht hier der ", ". Reduktion bedeutet ", " von Elektronen und entspricht hier der ", "."], "blanks": ["Entzug", "Entladung", "Zuführung", "Ladung"], "ex": "Die Übung ordnet anodische Reaktion der Oxidation/Entladung und kathodische Reaktion der Reduktion/Ladung zu."}, {"id": 23, "e": 3, "t": "mc", "src": "Ü3 S.12", "q": "Was repräsentieren die beiden Exponentialterme der Butler-Volmer-Gleichung?", "opts": ["Oxidation und Reduktion an einer Elektrode", "Je eine Reaktion an den beiden unterschiedlichen Elektroden", "Ohmschen und diffusionsbedingten Spannungsabfall", "SOC und DOD"], "correct": 0, "ex": "Beide Teilreaktionen gehören zur selben Elektrode: anodischer und kathodischer Teilstrom."}, {"id": 24, "e": 4, "t": "mc", "src": "Ü4 S.2–4", "q": "Welche Komponenten gelten im elektrochemischen Sinn als aktive Komponenten einer Lithium-Ionen-Batterie?", "opts": ["Stromsammler und BMS", "Aktivmaterial und Elektrolyt", "Separator und Batteriepole", "Nur Stromsammler"], "correct": 1, "ex": "Die Übungen markieren Aktivmaterial und Elektrolyt als aktive Komponenten."}, {"id": 25, "e": 4, "t": "graphic", "src": "Ü4 S.5", "q": "Im gezeigten Ladezustand wandern Li-Ionen zur Graphitanode. Wann ist die Zelle vollgeladen?", "graphic": "liion", "opts": ["Wenn die negative Elektrode mit Li-Ionen gefüllt ist", "Wenn die positive Elektrode maximal mit Li-Ionen gefüllt ist", "Wenn die Spannung der negativen Elektrode maximal steigt", "Wenn keine Li-Ionen im Elektrolyt sind"], "correct": 0, "ex": "Beim Laden werden Li-Ionen aus der positiven Elektrode deinterkaliert und in Graphit eingelagert."}, {"id": 26, "e": 4, "t": "mc", "src": "Ü4 S.6", "q": "Was ist ein grundlegender Unterschied zwischen Hochleistungs- (HP) und Hochenergiezellen (HE)?", "opts": ["HP besitzen typischerweise dünneres/weniger Aktivmaterial", "HP besitzen grundsätzlich mehr Aktivmaterial", "HE haben immer dünnere Elektroden", "Es gibt keinen geometrischen Unterschied"], "correct": 0, "ex": "Dünnere Elektroden verkürzen Transportwege und begünstigen Leistung, reduzieren aber den Aktivmaterialanteil."}, {"id": 27, "e": 4, "t": "graphic", "src": "Ü4 S.7–10", "q": "Welche Größe entspricht näherungsweise der Zellspannung in einem Halbzellspannungsdiagramm?", "graphic": "halfcells", "opts": ["Potential positive Elektrode + Potential negative Elektrode", "Potential positive Elektrode − Potential negative Elektrode", "Nur Potential der Anode", "Nur Potential der Kathode"], "correct": 1, "ex": "Die Zellspannung ist die Potentialdifferenz zwischen positiver und negativer Elektrode."}, {"id": 28, "e": 4, "t": "mc", "src": "Ü4 S.11", "q": "Was bedeutet eine Einschränkung 0 < x < 0,6 für den Lithiierungsgrad der positiven Elektrode?", "opts": ["Nur 60 % der Reaktionsenergie sind elektrisch nutzbar", "Maximal 60 % der Li-Ionen sollen der positiven Elektrode entnommen werden", "Nur 60 % der Li-Ionen benötigen Elektronen", "Der SOC darf nie über 60 % liegen"], "correct": 1, "ex": "x beschreibt die Stöchiometrie/Lithiierung; die Grenze beschränkt die nutzbare Entlithiierung."}, {"id": 29, "e": 4, "t": "formula", "src": "Ü4", "q": "Wie hängt der Leitwert G eines Elektrolyten qualitativ von Leitfähigkeit κ, Fläche A und Elektrodenabstand l ab?", "answer": "G = κ · A / l", "alts": ["kappa", "a", "/l"], "ex": "Große Fläche und kleiner Abstand erhöhen den Leitwert und senken damit den Elektrolytwiderstand."}, {"id": 30, "e": 4, "t": "open", "src": "Ü4 Ü4.1", "q": "Bei der Formierung einer LFP/Graphit-Zelle werden 8 % des anfänglichen Lithiums für die SEI verbraucht. Was ist die unmittelbare Folge für die zyklierbare Lithiuminventur?", "answer": "Nur 92 % des anfänglichen Lithiums bleiben für die reversible Zyklierung verfügbar.", "ex": "Die SEI bindet Lithium irreversibel; dieses Lithium steht anschließend nicht mehr für die Hauptreaktion zur Verfügung."}];
const KEY='bss_trainer_progress_v1'; let current=null,answered=false;
let state={version:1,done:0,correct:0,perQuestion:{},updatedAt:null};
const $=id=>document.getElementById(id), names={mc:'Multiple Choice',formula:'Formel',cloze:'Lückentext',graphic:'Grafik',open:'Offene Frage'};
function load(){try{const x=localStorage.getItem(KEY);if(x)state={...state,...JSON.parse(x)}}catch(e){} updateStats()}
function save(){state.updatedAt=new Date().toISOString();try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){} updateStats()}
function updateStats(){$('done').textContent=state.done;$('correct').textContent=state.correct;const r=state.done?Math.round(100*state.correct/state.done):0;$('rate').textContent=state.done?r+' %':'–';$('bar').style.width=r+'%';if(state.updatedAt)$('lastSaved').textContent='Gespeichert: '+new Date(state.updatedAt).toLocaleString()}
function pool(){const e=$('exercise').value,t=$('type').value;return Q.filter(x=>(e==='all'||String(x.e)===e)&&(t==='all'||x.t===t))}
function pick(){const p=pool();if(!p.length)return;let n=p[Math.floor(Math.random()*p.length)];if(p.length>1&&current&&n.id===current.id)n=p[(p.indexOf(n)+1)%p.length];current=n;answered=false;render()}
function visual(kind){
 if(kind==='parallel')return `<svg viewBox="0 0 560 180"><line x1="60" y1="35" x2="500" y2="35" stroke="currentColor" stroke-width="3"/><line x1="60" y1="145" x2="500" y2="145" stroke="currentColor" stroke-width="3"/>${[130,240,350,460].map(x=>`<line x1="${x}" y1="35" x2="${x}" y2="65" stroke="currentColor" stroke-width="3"/><rect x="${x-22}" y="65" width="44" height="50" rx="6" fill="none" stroke="currentColor"/><line x1="${x}" y1="115" x2="${x}" y2="145" stroke="currentColor" stroke-width="3"/>`).join('')}<text x="280" y="174" text-anchor="middle">Parallelschaltung</text></svg>`;
 if(kind==='series')return `<svg viewBox="0 0 600 150"><line x1="40" y1="75" x2="80" y2="75" stroke="currentColor" stroke-width="3"/>${[110,210,310,410].map(x=>`<rect x="${x}" y="50" width="55" height="50" rx="6" fill="none" stroke="currentColor"/><line x1="${x+55}" y1="75" x2="${x+100}" y2="75" stroke="currentColor" stroke-width="3"/>`).join('')}<text x="300" y="135" text-anchor="middle">Reihenschaltung</text></svg>`;
 if(kind==='cccvcc')return `<svg viewBox="0 0 660 230"><text x="105" y="215">A</text><text x="325" y="215">B</text><text x="545" y="215">C</text>${[0,220,440].map((o,i)=>`<g transform="translate(${o},0)"><line x1="25" y1="180" x2="205" y2="180" stroke="currentColor"/><line x1="25" y1="180" x2="25" y2="25" stroke="currentColor"/>${i===0?'<path d="M30 55 L105 55 Q120 70 130 105 L200 105" fill="none" stroke="#ef4444" stroke-width="4"/><path d="M30 145 Q90 130 115 95 Q145 55 200 48" fill="none" stroke="#0ea5e9" stroke-width="4"/>':i===1?'<path d="M30 55 L95 55 Q110 75 120 105 L155 105 L155 145 L200 145" fill="none" stroke="#ef4444" stroke-width="4"/><path d="M30 145 Q90 130 112 90 L155 90 L155 125 L200 125" fill="none" stroke="#0ea5e9" stroke-width="4"/>':'<path d="M30 55 L92 55 Q110 95 120 145 L195 145" fill="none" stroke="#ef4444" stroke-width="4"/><path d="M30 145 Q80 130 110 95 L150 95 L150 70 Q175 50 200 45" fill="none" stroke="#0ea5e9" stroke-width="4"/>'}</g>`).join('')}</svg>`;
 if(kind==='liion')return `<svg viewBox="0 0 620 230"><rect x="60" y="45" width="150" height="140" rx="18" fill="#ef4444" opacity=".18"/><rect x="410" y="45" width="150" height="140" rx="18" fill="#2563eb" opacity=".18"/><line x1="310" y1="35" x2="310" y2="195" stroke="currentColor" stroke-dasharray="6 6"/><text x="135" y="28" text-anchor="middle">positive Elektrode</text><text x="485" y="28" text-anchor="middle">Graphit / negative Elektrode</text><text x="310" y="218" text-anchor="middle">Elektrolyt + Separator</text></svg>`;
 if(kind==='halfcells')return `<svg viewBox="0 0 620 260"><line x1="55" y1="220" x2="575" y2="220" stroke="currentColor"/><line x1="55" y1="30" x2="55" y2="220" stroke="currentColor"/><path d="M60 70 C150 55 230 80 315 65 S470 75 565 60" fill="none" stroke="#ef4444" stroke-width="4"/><path d="M60 190 C140 165 220 175 315 185 S470 170 565 188" fill="none" stroke="#2563eb" stroke-width="4"/><path d="M60 120 C150 100 235 110 315 105 S470 100 565 108" fill="none" stroke="currentColor" stroke-width="4"/></svg>`;
 return ''
}
function render(){const q=current;$('badgeExercise').textContent='Übung '+q.e;$('badgeType').textContent=names[q.t];$('badgeSource').textContent=q.src;$('question').textContent=q.q;$('visual').innerHTML=q.graphic?visual(q.graphic):'';$('feedback').style.display='none';const f=$('answerForm');f.innerHTML='';
 if(q.t==='mc'||q.t==='graphic')q.opts.forEach((o,i)=>{const l=document.createElement('label');l.className='opt';l.innerHTML=`<input type="radio" name="ans" value="${i}"><span>${o}</span>`;f.appendChild(l)});
 else if(q.t==='cloze'){const w=document.createElement('div');w.className='cloze';q.parts.forEach((p,i)=>{w.append(document.createTextNode(p));if(i<q.blanks.length){const inp=document.createElement('input');inp.type='text';inp.dataset.blank=i;w.appendChild(inp)}});f.appendChild(w)}
 else{const a=document.createElement('textarea');a.id='textAns';a.rows=4;a.placeholder=q.t==='formula'?'Formel eingeben …':'Antwort in eigenen Worten …';f.appendChild(a)}
 $('check').textContent=q.t==='open'?'Musterlösung vergleichen':'Prüfen'}
function norm(s){return String(s).toLowerCase().replace(/\s/g,'').replace(/η/g,'eta').replace(/κ/g,'kappa').replace(/∫/g,'integral').replace(/·/g,'*').replace(/−/g,'-')}
function fb(title,body,kind='') {const e=$('feedback');e.style.display='block';e.className='feedback '+kind;e.innerHTML=`<b>${title}</b><div style="margin-top:6px">${body}</div>${current.ex?`<div class="muted" style="margin-top:8px;font-size:13px">${current.ex}</div>`:''}`}
function reg(ok){state.done++;if(ok)state.correct++;const k=String(current.id);if(!state.perQuestion[k])state.perQuestion[k]={attempts:0,correct:0,last:null};state.perQuestion[k].attempts++;if(ok)state.perQuestion[k].correct++;state.perQuestion[k].last=new Date().toISOString();save()}
function check(){if(answered&&current.t!=='open')return;let ok=false;
 if(current.t==='mc'||current.t==='graphic'){const r=document.querySelector('input[name="ans"]:checked');if(!r)return fb('Noch keine Antwort','Wähle zuerst eine Antwort.');ok=Number(r.value)===current.correct}
 else if(current.t==='cloze'){const ins=[...document.querySelectorAll('[data-blank]')];if(ins.some(x=>!x.value.trim()))return fb('Noch nicht vollständig','Fülle alle Lücken aus.');ok=ins.every((x,i)=>norm(x.value)===norm(current.blanks[i]))}
 else if(current.t==='formula'){const v=$('textAns').value;if(!v.trim())return fb('Noch keine Antwort','Gib zuerst eine Formel ein.');const n=norm(v);ok=current.alts.every(a=>n.includes(norm(a)))}
 else return fb('Musterlösung',`<b>${current.answer}</b>`);
 answered=true;reg(ok);fb(ok?'✓ Richtig':'✗ Noch nicht ganz',ok?'Sehr gut.':`Lösung: <b>${current.answer!==undefined?current.answer:current.opts[current.correct]}</b>`,ok?'good':'bad')}
function reveal(){let s='';if(current.t==='mc'||current.t==='graphic')s=current.opts[current.correct];else if(current.t==='cloze')s=current.parts.map((p,i)=>p+(i<current.blanks.length?'<b>'+current.blanks[i]+'</b>':'')).join('');else s=current.answer;fb('Lösung',s)}
function exportProgress(){const b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='BSS_Lernfortschritt_'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
function importProgress(file){const r=new FileReader();r.onload=()=>{try{const x=JSON.parse(r.result);if(typeof x.done!=='number'||typeof x.correct!=='number')throw 0;state={version:1,perQuestion:{},...x};save();alert('Fortschritt importiert.')}catch(e){alert('Ungültige Fortschrittsdatei.')}};r.readAsText(file)}
$('newQuestion').onclick=pick;$('next').onclick=pick;$('check').onclick=check;$('show').onclick=reveal;$('exercise').onchange=pick;$('type').onchange=pick;
$('exportBtn').onclick=exportProgress;$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=e=>{if(e.target.files[0])importProgress(e.target.files[0]);e.target.value=''};
$('reset').onclick=()=>{if(confirm('Gesamten Fortschritt wirklich zurücksetzen?')){state={version:1,done:0,correct:0,perQuestion:{},updatedAt:null};save();pick()}};
load();pick();
</script></body></html>
